<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>H2 Budget — Family Finance</title>
    <meta name="description" content="A focused budgeting app for the Hubele family — track spending, plan bills, and stay ahead of debt." />
    <meta name="theme-color" content="#19315b" />
    <style>
      /* The platinum ground, before the stylesheet arrives — kills the white
         flash. Dark mode is gone: the app is light-only on the navy/platinum
         palette, so there is no pre-hydration theme script any more. */
      html { background: #f7f9fc; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      ⚠️ Inter Variable is SELF-HOSTED and preloaded here.

      This used to be three cross-origin requests (two preconnects and a
      render-blocking Google Fonts stylesheet pulling ten static weights), which
      sat in front of first paint. One same-origin 48 KB woff2 covers every
      weight the app uses, and preloading it starts the download in parallel
      with the CSS instead of after it — a webfont discovered inside a
      stylesheet is always one round trip late.

      The `href` below is a placeholder: `interPreload()` in vite.config.ts
      rewrites it to the real emitted filename (content-hashed in a build,
      the node_modules path in dev). Never hardcode a hash here.
    -->
    <link rel="preload" href="__INTER_WOFF2__" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
