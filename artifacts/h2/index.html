<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>H2</title>
    <meta name="description" content="H2 — the household's money, every morning." />
    <meta name="theme-color" content="#FBFAF7" />
    <meta name="color-scheme" content="light" />
    <style>
      /* THE PRE-HYDRATION SHELL: paper, the wordmark, a hairline and a few
         blank lines, painted from the document alone before any script runs.
         No numbers and no copy that can go stale. React replaces all of it.
         Keep it under ~1 KB: it ships in every document. The hexes mirror the
         tokens in src/styles/index.css (tokens.test.ts pins that they do). */
      html, body { margin: 0; background: #FBFAF7; }
      #boot { min-height: 100vh; color: #1E1C18; }
      #boot .bar { border-bottom: 1px solid #D9D4C7; padding: 14px 16px; }
      #boot .mark { font: 600 20px/1 Georgia, "Times New Roman", serif; letter-spacing: -0.01em; }
      #boot .col { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
      #boot .ln { height: 12px; margin: 0 0 20px; border-radius: 4px; background: #ECE8DF; }
      #boot .xl { height: 40px; width: 55%; }
      @media (min-width: 640px) { #boot .bar, #boot .col { padding-left: 32px; padding-right: 32px; } }
    </style>
    <link rel="icon" type="image/svg+xml" href="/h2-mark.svg" />
    <!--
      Webfonts are self-hosted and the two the open screen needs (sans for
      words, mono for figures) are preloaded. The hrefs are placeholders that
      `fontPreload()` in vite.config.ts rewrites to the emitted file names.
      Never hardcode a hash here.
    -->
    <link rel="preload" href="__FONT_SANS__" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="__FONT_MONO_500__" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="__FONT_MONO_400__" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root">
      <div id="boot" role="presentation" aria-hidden="true">
        <div class="bar"><span class="mark">H2</span></div>
        <div class="col">
          <div class="ln" style="width: 40%"></div>
          <div class="ln xl"></div>
          <div class="ln" style="width: 30%"></div>
          <div class="ln" style="width: 100%; height: 1px; background: #D9D4C7"></div>
          <div class="ln" style="width: 70%"></div>
          <div class="ln" style="width: 50%"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
