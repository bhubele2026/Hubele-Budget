  /plaid/link-token:
    post:
      operationId: createPlaidLinkToken
      tags: [plaid]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaidLinkToken" }
  /plaid/link-token/update:
    post:
      operationId: createPlaidUpdateLinkToken
      tags: [plaid]
      summary: |
        Create a Plaid Link token in update mode for an existing item, so the
        user can re-authenticate the bank when Plaid reports
        ITEM_LOGIN_REQUIRED (or another re-auth code).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaidUpdateLinkTokenInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaidLinkToken" }
  /plaid/exchange:
    post:
      operationId: exchangePlaidPublicToken
      tags: [plaid]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaidExchangeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaidItemDetail" }
  /plaid/items:
    get:
      operationId: listPlaidItems
      tags: [plaid]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlaidItemDetail" }
  /plaid/items/{id}/clear-refresh-disabled:
    post:
      operationId: clearPlaidItemRefreshDisabled
      tags: [plaid]
      summary: |
        (#725) Clear the `refreshProductDisabledAt` short-circuit stamp
        on a single Plaid item so the next manual Sync actually calls
        /transactions/refresh. Surfaced as a "Re-enable refresh" link
        on the Settings bank tile after a user enables the
        `transactions_refresh` add-on on their Plaid Dashboard.
        Idempotent — returns the refreshed PlaidItemDetail with
        `refreshProductDisabledAt: null`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaidItemDetail" }
        "404":
          description: Plaid item not found
  /plaid/items/{id}:
    delete:
      operationId: deletePlaidItem
      tags: [plaid]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
  /plaid/items/{id}/sync-attempts:
    get:
      operationId: listPlaidSyncAttempts
      tags: [plaid]
      summary: |
        (#279) Most recent Plaid sync attempts for a single linked item.
        Powers the Settings → Linked banks "Recent activity" expander
        so users can spot a flaky bank link (e.g. "failed 4 of the
        last 10 syncs") instead of only seeing the latest
        `lastSyncError` snapshot. Newest first; capped server-side at
        ~20 rows.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaidSyncAttemptsResult" }
        "404": { description: Plaid item not found }
  /plaid/accounts/{id}/import-cutoff:
    patch:
      operationId: updatePlaidImportCutoffDate
      tags: [plaid]
      summary: |
        (#361) Override the first-sync `import_cutoff_date` for a
        single Plaid account. Allowed only while
        `firstSyncCompletedAt` is still null — once the first sync
        has stamped that timestamp the gate is permanently off and a
        later override would silently do nothing (returns 409
        instead). Pass `null` to clear the cutoff so the first sync
        inserts every row Plaid returns.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importCutoffDate]
              properties:
                importCutoffDate: { type: ["string", "null"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, importCutoffDate, firstSyncCompletedAt]
                properties:
                  id: { type: string }
                  importCutoffDate: { type: ["string", "null"] }
                  firstSyncCompletedAt: { type: ["string", "null"] }
        "400": { description: Invalid date }
        "404": { description: Plaid account not found }
        "409": { description: First sync already completed }
  /plaid/items/{id}/dismiss-expiration-warning:
    post:
      operationId: dismissPlaidExpirationWarning
      tags: [plaid]
      summary: |
        (#274) Persist the user's dismissal of the dashboard "bank
        consent expiring soon" banner for this item. The server stamps
        `consentWarningDismissedForCutoff` with the current
        `consentExpirationAt`, so the alert stays hidden across page
        reloads but re-surfaces automatically if Plaid moves the
        cutoff (e.g. after a successful re-consent).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaidItemDetail" }
  /plaid/sync:
    post:
      operationId: syncPlaidTransactions
      tags: [plaid]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaidSyncInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaidSyncResult" }
  /plaid/environment:
    get:
      operationId: getPlaidEnvironment
      tags: [plaid]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaidEnvironmentInfo" }
  /plaid/refresh-consent-expirations:
    post:
      operationId: refreshPlaidConsentExpirations
      tags: [plaid]
      summary: |
        (#253) Manually refresh `consent_expiration_time` for every Plaid
        item belonging to the caller. Same code path as the daily 03:17
        UTC cron job — exposed so users can self-serve from Settings when
        they suspect the disconnect-date countdown is stale, without
        waiting up to 24h for the next scheduled run.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaidConsentRefreshResult" }
  /plaid/run-malformed-token-sweep:
    post:
      operationId: runPlaidMalformedTokenSweep
      tags: [plaid]
      summary: |
        (#397, #550) Owner-only manual trigger for the daily Plaid
        malformed-access-token health check. Same code path the 03:02
        UTC cron runs unattended; exposed so an operator who just
        investigated a spike alert can re-run the sweep from the app
        and see the refreshed `{ scanned, flagged, flaggedItems }`
        summary plus the re-evaluated alert outcome inline, instead of
        waiting for tomorrow morning's cron tick.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaidMalformedTokenSweepResult" }
  /plaid/cleanup-non-prod:
    post:
      operationId: cleanupNonProdPlaidItems
      tags: [plaid]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer }

