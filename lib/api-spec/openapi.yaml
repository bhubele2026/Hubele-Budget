    AiConversation:
      type: object
      additionalProperties: false
      required: [id, title, createdAt, lastMessageAt]
      properties:
        id: { type: string }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }

    AiConversationList:
      type: object
      additionalProperties: false
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: "#/components/schemas/AiConversation" }

    AiMessage:
      type: object
      additionalProperties: false
      required: [id, role, content, runId, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant, tool] }
        content:
          type: object
          additionalProperties: true
          description: "user / assistant: `{ text }` (assistant also `grounded`, `demo`, `tools`); tool: `{ name }` only."
        runId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    AiConversationDetail:
      type: object
      additionalProperties: false
      required: [conversation, messages]
      properties:
        conversation: { $ref: "#/components/schemas/AiConversation" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/AiMessage" }

    AiChatRequest:
      type: object
      additionalProperties: false
      required: [conversationId, text]
      properties:
        conversationId: { type: string }
        text: { type: string, minLength: 1, maxLength: 2000 }
        userAskedToChange:
          type: boolean
          default: false
          description: True only when the person's own action asked Ask to file the charge (a button), never inferred from text.

    AiChatEvent:
      type: object
      additionalProperties: false
      description: >-
        One server-sent event. `token` carries `text`; `tool` carries `name`
        and `status`; `done` carries `runId`, `messageId`, the final `text`
        (it replaces the streamed tokens), `grounded` and `demo`; `error`
        carries `code`, `message`, `retryable` (and `runId` once a run exists).
      required: [type]
      properties:
        type: { type: string, enum: [token, tool, done, error] }
        text: { type: string }
        name: { type: string }
        status: { type: string, enum: [running, done, error] }
        runId: { type: string }
        messageId: { type: string }
        grounded: { type: boolean }
        demo: { type: boolean }
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }

    AgentProposal:
      type: object
      additionalProperties: false
      required: [id, kind, status, payload, rationale, runId, decidedBy, decidedAt, appliedActionId, expiresAt, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [set_category, weekly_limit, budget_line, extra_debt_payment, bill_amount] }
        status: { type: string, enum: [proposed, approved, rejected, applied, expired] }
        payload:
          type: object
          additionalProperties: true
          description: "`target`, `before`, `after`, `label` (figures read by code), plus `txnId` / `categoryId` for a category proposal."
        rationale: { type: string }
        runId: { type: string }
        decidedBy: { type: ["string", "null"] }
        decidedAt: { type: ["string", "null"], format: date-time }
        appliedActionId: { type: ["string", "null"] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    AgentProposalList:
      type: object
      additionalProperties: false
      required: [proposals]
      properties:
        proposals:
          type: array
          items: { $ref: "#/components/schemas/AgentProposal" }

    MemoryItem:
      type: object
      additionalProperties: false
      required: [id, scope, key, value, source, createdByKind, memberUserId, updatedAt]
      properties:
        id: { type: string }
        scope: { type: string, enum: [categorization, spending, debt, general] }
        key: { type: string }
        value:
          type: object
          additionalProperties: true
          description: "`{ text }`; an agent note also carries `kind` (preference | decision)."
        source: { type: string, enum: [user_stated, inferred, agent_proposed] }
        createdByKind: { type: string, enum: [user, agent] }
        memberUserId: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }

    MemoryList:
      type: object
      additionalProperties: false
      required: [memories]
      properties:
        memories:
          type: array
          items: { $ref: "#/components/schemas/MemoryItem" }

    PutMemoryBody:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: string, minLength: 1, maxLength: 300 }
        mine: { type: boolean, default: false, description: "Keep it for the signed-in member only." }

    WishlistItem:
      type: object
      additionalProperties: false
      required: [id, title, amount, url, categoryId, targetDate, requestedBy, requestedAt, waitingUntil, waitingDaysLeft, decision, decidedAt]
      properties:
        id: { type: string }
        title: { type: string }
        amount: { type: ["number", "null"] }
        url: { type: ["string", "null"] }
        categoryId: { type: ["string", "null"] }
        targetDate: { type: ["string", "null"] }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        waitingUntil: { type: string }
        waitingDaysLeft: { type: integer, description: "0 once the waiting period is over." }
        decision: { type: string, enum: [pending, approved, declined, bought] }
        decidedAt: { type: ["string", "null"], format: date-time }

    WishlistList:
      type: object
      additionalProperties: false
      required: [items, waitDays]
      properties:
        waitDays: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/WishlistItem" }

    CreateWishlistItemBody:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        amount: { type: number, minimum: 0, maximum: 1000000 }
        url: { type: string, maxLength: 500 }
        categoryId: { type: string }
        targetDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }

    UpdateWishlistItemBody:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        amount: { type: ["number", "null"], minimum: 0, maximum: 1000000 }
        url: { type: ["string", "null"], maxLength: 500 }
        targetDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        decision: { type: string, enum: [pending, approved, declined, bought] }

    AiBudget:
      type: object
      additionalProperties: false
      required: [monthlyCapUsd, hardCapUsd, dailyCaps, pausedUntil]
      properties:
        monthlyCapUsd: { type: number }
        hardCapUsd: { type: number }
        dailyCaps:
          type: object
          additionalProperties: { type: integer }
        pausedUntil: { type: ["string", "null"], format: date-time }

    UpdateAiBudgetBody:
      type: object
      additionalProperties: false
      properties:
        monthlyCapUsd: { type: number, minimum: 0, maximum: 1000 }
        hardCapUsd: { type: number, minimum: 0, maximum: 1000 }
        pausedUntil: { type: ["string", "null"], format: date-time }

    AiUsageSummary:
      type: object
      additionalProperties: false
      required: [month, byTask, budget, monthToDateUsd, recentRuns]
      properties:
        month: { type: string, description: "UTC month, YYYY-MM" }
        monthToDateUsd: { type: number }
        calls: { type: integer }
        failures: { type: integer }
        blocked: { type: integer }
        cacheHitRatio: { type: ["number", "null"] }
        byTask:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [task, costUsd, calls, failures]
            properties:
              task: { type: string }
              costUsd: { type: number }
              calls: { type: integer }
              failures: { type: integer }
        budget: { $ref: "#/components/schemas/AiBudget" }
        recentRuns:
          type: array
          items: { $ref: "#/components/schemas/AgentRun" }

    Goal:
      type: object
      additionalProperties: false
      required: [id, name, kind, status, targetAmount, manualCurrentAmount, plaidAccountId, monthlyContribution, targetDate, reservedInChecking, priority, currentAmount, currentSource, percent, remaining, monthsToTargetLow, monthsToTargetHigh, requiredMonthly, onTrack, reserveHeld, cashBuffer, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [savings, buffer, sinking, debt_payoff] }
        status: { type: string, enum: [active, paused, reached, archived] }
        targetAmount: { type: ["string", "null"] }
        manualCurrentAmount: { type: string, description: The amount the household typed; for a goal reserved in checking, the money held back }
        plaidAccountId: { type: ["string", "null"], description: The savings account that backs the goal (never checking) }
        monthlyContribution: { type: string }
        targetDate: { type: ["string", "null"] }
        reservedInChecking: { type: boolean }
        priority: { type: integer }
        currentAmount: { type: ["string", "null"], description: "The backing account's balance, or the typed amount; null when the account's balance is not known yet" }
        currentSource: { type: string, enum: [manual, account] }
        percent: { type: ["integer", "null"], description: Whole percent of the target, rounded down (0-100) }
        remaining: { type: ["string", "null"] }
        monthsToTargetLow: { type: ["integer", "null"], description: "At the contribution rate, between low and high months; null when the rate never reaches it" }
        monthsToTargetHigh: { type: ["integer", "null"] }
        requiredMonthly: { type: ["string", "null"], description: "remaining ÷ months left to the target date, rounded up; the whole remaining once the date has come" }
        onTrack: { type: ["boolean", "null"], description: "false when the required pace is more than 1.2 × the contribution; null when it cannot be judged" }
        reserveHeld: { type: string, description: "What this goal holds back from available: its typed amount when active, reserved in checking and not backed by an account; else 0.00" }
        cashBuffer: { type: ["string", "null"], description: "For a buffer goal, the forecast's cash buffer shown beside its target (the goal never changes it); null for other kinds" }
        createdAt: { type: string }
        updatedAt: { type: string }

    GoalList:
      type: object
      additionalProperties: false
      required: [goals, reservesHeld, goalsMonthly, cashBuffer]
      properties:
        goals:
          type: array
          items: { $ref: "#/components/schemas/Goal" }
        reservesHeld: { type: string, description: "Σ reserveHeld: the money position's reservesHeld" }
        goalsMonthly: { type: string, description: "Σ the active goals' monthly contributions: the weekly-limit derivation's goals line" }
        cashBuffer: { type: string }

    GoalCreate:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, enum: [savings, buffer, sinking, debt_payoff] }
        targetAmount: { type: ["string", "null"], pattern: '^\d{1,8}(\.\d{1,2})?$' }
        manualCurrentAmount: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$' }
        plaidAccountId: { type: ["string", "null"] }
        monthlyContribution: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$' }
        targetDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        reservedInChecking: { type: boolean }
        priority: { type: integer, minimum: 0, maximum: 1000 }

    GoalUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, enum: [savings, buffer, sinking, debt_payoff] }
        status: { type: string, enum: [active, paused, reached, archived] }
        targetAmount: { type: ["string", "null"], pattern: '^\d{1,8}(\.\d{1,2})?$' }
        manualCurrentAmount: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$' }
        plaidAccountId: { type: ["string", "null"] }
        monthlyContribution: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$' }
        targetDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        reservedInChecking: { type: boolean }
        priority: { type: integer, minimum: 0, maximum: 1000 }

    GoalDeleteResult:
      type: object
      additionalProperties: false
      required: [id, outcome]
      properties:
        id: { type: string }
        outcome: { type: string, enum: [deleted, archived] }
