        kind:
          type: string
          enum: [bill_increase, category_acceleration, shortfall_before_income, duplicate_charge, goal_behind, limit_near, bank_stale]
        severity: { type: string, enum: [info, watch, high] }
        confidence: { type: string, enum: [estimate, confirmed] }
        payload:
          type: object
          additionalProperties: true
          description: Ids (refs) and numbers (figures) only — never a merchant string.
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        resolvedAt: { type: ["string", "null"], format: date-time }
        dismissedAt: { type: ["string", "null"], format: date-time }

    AgentFindingList:
      type: object
      additionalProperties: false
      required: [findings]
      properties:
        findings:
          type: array
          items: { $ref: "#/components/schemas/AgentFinding" }

    AgentRun:
      type: object
      additionalProperties: false
      required: [id, kind, trigger, status, startedAt, finishedAt, summary, inputTokens, outputTokens, costUsd]
      properties:
        id: { type: string }
        kind: { type: string, enum: [chat, categorize, monitor, recap, receipt, sms_question] }
        trigger: { type: string, enum: [user, txn_arrived, schedule, sms, retry] }
        status: { type: string, enum: [running, succeeded, failed, refused, budget_exceeded] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        summary: { type: ["string", "null"], description: Counts and refs only, at most 300 characters }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        costUsd: { type: ["number", "null"] }

    AgentRunList:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/AgentRun" }

    AgentAction:
      type: object
