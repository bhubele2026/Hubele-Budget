        causes the response to fall back to the live derivation again.
      parameters:
        - in: path
          name: monthStart
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinBudgetMonthInput" }
      responses:
