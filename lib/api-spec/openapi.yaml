        cashBuffer: { type: string }
    BankSnapshot:
      type: object
      required: [balance, at, source]
      properties:
        balance: { type: string }
        at: { type: string }
        source: { type: string, enum: [manual, plaid] }
        accountId: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        mask: { type: ["string", "null"] }
    PlaidCheckingAccount:
      type: object
      required: [id, accountId]
      properties:
        id: { type: string }
        accountId: { type: string }
        name: { type: ["string", "null"] }
        mask: { type: ["string", "null"] }
        subtype: { type: ["string", "null"] }
        institutionName: { type: ["string", "null"] }
    CashSignal:
      type: object
      required: [bankToday, lowestProjected, lowestDate, cashBuffer, status, maxSafeExtra, account]
      properties:
        bankToday: { type: string }
        lowestProjected: { type: string }
        lowestDate: { type: ["string", "null"] }
        cashBuffer: { type: string }
        status: { type: string, enum: [ready, tight, not_yet, no_data] }
        maxSafeExtra: { type: string }
        snapshotAt: { type: ["string", "null"] }
        snapshotSource: { type: ["string", "null"] }
        account: { $ref: "#/components/schemas/CashSignalAccount" }
        horizonDays: { type: integer }
        fromDate: { type: string }
        toDate: { type: string }
        startingBalance: { type: string }
        endingBalance: { type: string }
        endingDate: { type: ["string", "null"] }
        projectedIncome: { type: string }
        projectedExpenses: { type: string }
        acceptedImpact: { type: string }
        daily:
          type: array
          items:
            type: object
            required: [date, balance]
            properties:
              date: { type: string }
              balance: { type: string }
        events:
          type: array
          items:
            type: object
            required: [date, label, amount]
            properties:
              date: { type: string }
              label: { type: string }
              amount: { type: string }
              itemId: { type: string }
              originalDate:
                type: string
                description: |
                  The date the plan was due (after any reschedule), before
                  any drag. When `originalDate !== date`, the curve moved
                  the event (see `assumption`). Used by the chart tooltip to
                  distinguish dragged plans from bills naturally due that
                  day. ⚠️ Not the resolution key for a moved bill: actions
                  send `occurrenceDate`.
              assumption:
                type: ["string", "null"]
                description: |
                  (PR6) Why the plan is not on its due date, or null.
                  `overdue_assumed_unpaid`: due in the last 14 days,
                  unresolved and not confidently paid by a bank row, so it
                  lands on the next business day. `due_today_not_posted`:
                  due today, lands on the next business day (day 0 equals
                  the bank). `overdue_remainder_assumed_unpaid` (PR6 review):
                  overdue, a bank row paid part of it, and the unpaid
                  remainder lands on the next business day.
                  (PR-B2) `dragged_past_due` is retired: weekly-cadence
                  expenses follow the overdue rule like any bill.
                  `pre_window_on_first_day`: no snapshot, due before the
                  window, placed on its first day.
                  `remainder_assumed_unpaid` (decision 13, round 4): due after
                  today, a tier-1/2 pair paid part of it (`offCurve` stays
                  false for an underpayment), and only the unpaid remainder
                  lands — on the plan's OWN date, never dragged to a business
                  day like the overdue sibling above.
              occurrenceKey:
                type: string
                description: (PR6) `<itemId>|<occurrenceDate>` — the resolution key; joins `matches[].planKey`.
              occurrenceDate:
                type: string
                description: (PR6) The occurrence's own date (before any reschedule), which resolutions are keyed on.
        hookAmountIgnored:
          type: array
          description: |
            (PR-B2, decision 7) The everyday hooks in force: the Weekly / Monthly
            Spend items whose occurrences the forecast replaces with the card
            payoff (the period's card charges plus what is left of the
            allowance while the period is open). `storedAmount` is the item's
            own amount, which the forecast ignores — banner data for the UI.
            Present only when the household has a hook.
          items:
            type: object
            required: [itemId, cadence, storedAmount]
            properties:
              itemId: { type: string }
              cadence: { type: string, enum: [weekly, monthly] }
              storedAmount: { type: string }
        overdueOutsideForecast:
          type: array
          description: |
            (PR6) Unresolved expenses due more than 14 days ago that no bank
            row confidently paid. Not on the curve, and never dropped
            silently. Bounded by the forecast's expansion (the first of last
            month) and by the item's start. Sorted by due date.
          items:
            $ref: "#/components/schemas/CashSignalListedPlan"
        incomeNotArrived:
          type: array
          description: |
            (PR6, `income_not_arrived`) Unresolved income due before today with
            no deposit paired to it (any confidence, not ambiguous). Not on the
            curve: a paycheck that has not landed never raises it. Bounded by
            the first of last month. Sorted by due date.
          items:
            $ref: "#/components/schemas/CashSignalListedPlan"
        overdueAssumedPaid:
          type: array
          description: |
            (PR6 review) Overdue expenses the forecast treats as PAID because
            of a bank row: a non-ambiguous pair of any confidence
            (`matches`-style; older occurrences pair for this list only), or,
            for a debt's minimum, a payment of at least the minimum that either
            names the card (`card_payment`) or is tagged to that debt
            (`debt_tag`). Off the curve except `unpaidRemainder`, which drags while
            the plan is at most 14 days overdue. Listed so an unrelated row
            that hid an unpaid bill is never silent. Sorted by due date.
          items:
            $ref: "#/components/schemas/CashSignalAssumedPaidPlan"
        matches:
          type: array
          description: |
            (PR5) Plans a bank row probably paid, as suggestions for the user
            to confirm ("matched"/"partial") or reject ("not_match"). The bank
            row always counts. Amounts are signed; `difference` is |txn| − |plan|
            (positive = paid more than planned). `confidence` is "high",
            "medium" or "low".
            (Decision 13) `tier` is what the pair proves: 1 explicit (a
            checking row tagged to the plan's debt); 2 obligation evidence (not
            ambiguous, a checking-cash row that is not a logged debt payment,
            paying at most the plan + max($25, 10%), and either strong evidence
            paying at least the plan − max($25, 10%) — the plan's own category
            when no other active item of its direction carries it, or a
            description the user confirmed for this item before — or name
            evidence paying at least the plan − max($1, 1%): its full name when
            no other active item's full name is in the row, some of its name
            within 5 days, or some of its name anywhere in the window when no
            other active item shares a name word with the row); 3 a suggestion
            only. `offCurve` is true for a tier 1 or 2 pair paying at least the
            plan − max($1, 1%): only those plans are off the forecast curve
            before they are due. Once due, a tier 1 or 2 pair pays the bill and
            only an unpaid remainder over $1 stays on the curve; a tier 3 pair
            pays nothing and every other plan still counts.
          items:
            type: object
            required: [planKey, planItemId, planDate, txnId, planAmount, txnAmount, difference, dayDelta, confidence, ambiguous, tier, offCurve]
            properties:
              planKey: { type: string }
              planItemId: { type: string }
              planDate: { type: string }
              txnId: { type: string }
              planAmount: { type: string }
              txnAmount: { type: string }
              difference: { type: string }
              dayDelta: { type: integer }
              confidence: { type: string }
              ambiguous: { type: boolean }
              tier: { type: integer, enum: [1, 2, 3] }
              offCurve: { type: boolean }
              remainderAmount:
                type: string
                description: |
                  (Decision 13) Present only when the forecast counts the plan
                  paid by this row (an overdue tier 1 or 2 pair, also listed in
                  `overdueAssumedPaid`): the amount still assumed unpaid, signed
                  like the plan ("0.00" when paid in full). Only that remainder
                  stays on the curve.
    CashSignalAccount:
      type: object
      description: |
        (Decision 16, PR-K round 2) The bank account this signal's figures roll
        forward on, as `resolveSnapshotAccount` resolved it: the stored pointer,
        else the snapshot's mask, else the household's sole checking account,
        else its sole depository account. A screen that names the account reads
        this, so its label and its numbers come from one response. `name`,
        `mask` and `subtype` are the resolved Plaid account's own; all null when
        `via` is `unresolved`, where the balance stays at the raw snapshot.
      required: [name, mask, subtype, via]
      properties:
        name: { type: ["string", "null"] }
        mask: { type: ["string", "null"] }
        subtype: { type: ["string", "null"], description: "Plaid subtype, e.g. checking or savings." }
        via:
          type: string
          enum: ["pointer", "snapshot mask", "sole checking", "sole depository", "unresolved"]
    CashSignalAssumedPaidPlan:
      type: object
      description: (PR6 review) An overdue plan occurrence the forecast treats as paid by a bank row.
      required: [planKey, itemId, occurrenceDate, dueDate, label, daysOverdue, planAmount, txnId, txnAmount, confidence, unpaidRemainder]
      properties:
        planKey: { type: string, description: "`<itemId>|<occurrenceDate>` — the resolution key." }
        itemId: { type: string }
        occurrenceDate: { type: string }
        dueDate: { type: string, description: The date it was due (after any reschedule). }
        label: { type: string }
        daysOverdue: { type: integer }
        planAmount: { type: string, description: Signed like the plan. }
        txnId: { type: string }
        txnAmount: { type: string, description: Signed like the row. }
        confidence: { type: string, description: '"high", "medium" or "low" (the pair''s), "card_payment", or "debt_tag" (a row the user tagged to the debt).' }
        unpaidRemainder: { type: string, description: Signed; "0.00" when the row covered it (within $1). On the curve only while at most 14 days overdue. }
    CashSignalListedPlan:
      type: object
      description: (PR6) An unresolved plan occurrence kept off the forecast curve.
      required: [planKey, itemId, occurrenceDate, dueDate, amount, label, daysOverdue]
      properties:
        planKey: { type: string, description: "`<itemId>|<occurrenceDate>` — the resolution key; joins `matches[].planKey`." }
        itemId: { type: string }
        occurrenceDate: { type: string, description: The date resolutions are keyed on (before any reschedule). }
        dueDate: { type: string, description: The date it was due (after any reschedule). }
        amount: { type: string, description: Signed; negative is money out. A partial lists its remainder. }
        label: { type: string }
        daysOverdue: { type: integer, description: Whole days from dueDate to today. }
    SpendingFacts:
      type: object
      required:
        [
          range,
          householdSpend,
          realSpend,
          realIncome,
          unplanned,
          uncategorized,
          excluded,
          byCategory,
          byMerchant,
          dailyBuckets,
          dailyNet,
          dayOfWeek,
          monthlyTrends,
          reimbursable,
        ]
      properties:
        range:
          type: object
          required: [start, end, daysCovered, trackingStart, floorApplied]
          properties:
            start: { type: string }
            end: { type: string }
            daysCovered: { type: integer }
            trackingStart: { type: string }
            floorApplied: { type: boolean }
        householdSpend:
          type: object
          description: >-
            Every purchase on any account, categorized or not — realSpend plus
            uncategorized — through the one spending rule (spendingFilter.ts
            classifyOutflow). Transfers, debt payments, card payments,
            reimbursable charges, excluded categories and income are out. The
            spine's spentWeek and spentMonth.
          required: [total, transactionCount]
          properties:
            total: { type: number }
            transactionCount: { type: integer }
        unplanned:
          type: object
          description: Purchases explicitly marked UN, categorized or not, through the same rule as householdSpend (so never a transfer, debt payment, card payment or reimbursable charge). Details are the largest 20 purchases; total covers the whole window.
          required: [total, transactionCount, transactions]
          properties:
            total: { type: number }
            transactionCount: { type: integer }
            transactions:
              type: array
              items:
                type: object
                required: [id, date, description, amount]
                properties:
                  id: { type: string }
                  date: { type: string }
                  description: { type: string }
                  amount: { type: number }
        realSpend:
          type: object
          description: The categorized part of householdSpend; the basis of byCategory, byMerchant, dailyBuckets, dailyNet, dayOfWeek and monthlyTrends.
          required: [total, transactionCount]
          properties:
            total: { type: number }
            transactionCount: { type: integer }
        realIncome:
          type: object
          description: >-
            The mirror of realSpend — money arriving from outside the household,
            through the same filter that decides real spending. Transfers
            between the household's own accounts, reimbursements, debt-payment
            counterparts and card refunds are all excluded, so this is what was
            EARNED in the range rather than everything that landed in an
            account.
          required: [total, transactionCount]
          properties:
            total: { type: number }
            transactionCount: { type: integer }
        uncategorized:
          type: object
          required: [total, transactionCount, sampleMerchants]
          properties:
            total: { type: number }
            transactionCount: { type: integer }
            sampleMerchants:
              type: array
              items:
                type: object
                required: [name, total, count]
                properties:
                  name: { type: string }
                  total: { type: number }
                  count: { type: integer }
        excluded:
          type: object
          required:
            [transfersTotal, debtPaymentsTotal, reimbursementTotal, ignoreTotal, cardPayments, reimbursable, replacedPending]
          properties:
            transfersTotal: { type: number }
            debtPaymentsTotal: { type: number }
            reimbursementTotal: { type: number }
            ignoreTotal: { type: number }
            cardPayments: { type: number, description: Payments to a credit card from another account — flagged, Plaid-classified or matched by description. Recognized in totals only; no row is re-tagged. }
            reimbursable: { type: number, description: Charges flagged reimbursable. }
            replacedPending: { type: number, description: "Pending outflows a posted row replaced when the sync never linked them (pairPendingWithPosted, PR4c). The charge counts once, on its posted row; this is the pending half left out. No row is deleted or re-tagged." }
        byCategory:
          type: array
          items:
            type: object
            required: [categoryId, name, total, txnCount, pctOfRealSpend]
            properties:
              categoryId: { type: string }
              name: { type: string }
              total: { type: number }
              txnCount: { type: integer }
              pctOfRealSpend: { type: number }
        byMerchant:
          type: array
          items:
            type: object
            required: [name, total, count, sampleCategoryName, sampleCategoryId]
            properties:
              name: { type: string }
              total: { type: number }
              count: { type: integer }
              sampleCategoryName: { type: ["string", "null"] }
              sampleCategoryId: { type: ["string", "null"] }
        dailyBuckets:
          type: array
          items:
            type: object
            required: [date, total, count]
            properties:
              date: { type: string }
              total: { type: number }
              count: { type: integer }
        dailyNet:
          type: array
          description: >-
            One entry per day the range covers, in date order — realIncome minus
            real spend for that day. The cash-flow shape, computed on the same
            filtered rows as every other figure here.
          items:
            type: object
            required: [date, net]
            properties:
              date: { type: string }
              net: { type: number }
        dayOfWeek:
          type: array
          items:
            type: object
            required: [dow, label, avgPerDay, total, topMerchants]
            properties:
              dow: { type: integer }
              label: { type: string }
              avgPerDay: { type: number }
              total: { type: number }
              topMerchants:
                type: array
                items:
                  type: object
                  required: [name, total]
                  properties:
                    name: { type: string }
                    total: { type: number }
        monthlyTrends:
          type: array
          items:
            type: object
            required: [month, total, byTopCategory]
            properties:
              month: { type: string }
              total: { type: number }
              byTopCategory:
                type: array
                items:
                  type: object
                  required: [name, total]
                  properties:
                    name: { type: string }
                    total: { type: number }
        reimbursable:
          type: object
          required: [personalTotal, outstandingReimbursableTotal]
          properties:
            personalTotal: { type: number }
            outstandingReimbursableTotal: { type: number }

    BudgetLineFact:
      type: object
      required: [categoryId, name, class, planned, actual, pct, status]
      properties:
        categoryId: { type: string }
        name: { type: string }
        class: { type: string, enum: [income, debt, bill, flex] }
        planned: { type: number }
        actual: { type: number }
        pct: { type: number }
        status: { type: string, enum: [good, watch, miss] }

    FlexLineFact:
      type: object
      required:
        [categoryId, name, class, planned, actual, pct, status, unbudgeted]
      properties:
        categoryId: { type: string }
        name: { type: string }
        class: { type: string, enum: [income, debt, bill, flex] }
        planned: { type: number }
        actual: { type: number }
        pct: { type: number }
        status: { type: string, enum: [good, watch, miss] }
        unbudgeted: { type: boolean }

    BudgetClassSection:
      type: object
      required: [paidCount, totalCount, lines]
      properties:
        paidCount: { type: integer }
        totalCount: { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/BudgetLineFact" }

    BudgetFlexSection:
      type: object
      required:
        [
          paidCount,
          totalCount,
          lines,
          plannedTotal,
          actualTotal,
          pacePlanToDate,
          paceStatus,
          projectedMonthEnd,
          projectedVsPlan,
          burndown,
        ]
      properties:
        paidCount: { type: integer }
        totalCount: { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/FlexLineFact" }
        plannedTotal: { type: number }
        actualTotal: { type: number }
        pacePlanToDate: { type: number }
        paceStatus: { type: string, enum: [under, on_track, over] }
        projectedMonthEnd: { type: number }
        projectedVsPlan: { type: number }
        burndown:
          type: array
          items:
            type: object
            required: [day, date, plannedCumulative, actualCumulative]
            properties:
              day: { type: integer }
              date: { type: string }
              plannedCumulative: { type: number }
              actualCumulative: { type: ["number", "null"] }

    BudgetStreakCell:
      type: object
      required: [status, pct]
      properties:
        status: { type: string, enum: [good, watch, miss] }
        pct: { type: number }

    BudgetStreakRow:
      type: object
      required:
        [categoryId, name, class, currentStreakGood, longestStreakGood, cells]
      properties:
        categoryId: { type: string }
        name: { type: string }
        class: { type: string, enum: [income, debt, bill, flex] }
        currentStreakGood: { type: integer }
        longestStreakGood: { type: integer }
        cells:
          type: array
          items:
            oneOf:
              - { $ref: "#/components/schemas/BudgetStreakCell" }
              - { type: "null" }

    BudgetFacts:
      type: object
      required: [range, income, bills, debts, flex, streak]
      properties:
        range:
          type: object
          required:
            [
              monthStart,
              monthEnd,
              daysInMonth,
              daysElapsed,
              monthHasPassed,
              monthLabel,
              monthsBack,
            ]
          properties:
            monthStart: { type: string }
            monthEnd: { type: string }
            daysInMonth: { type: integer }
            daysElapsed: { type: integer }
            monthHasPassed: { type: boolean }
            monthLabel: { type: string }
            monthsBack: { type: integer }
        income: { $ref: "#/components/schemas/BudgetClassSection" }
        bills: { $ref: "#/components/schemas/BudgetClassSection" }
        debts: { $ref: "#/components/schemas/BudgetClassSection" }
        flex: { $ref: "#/components/schemas/BudgetFlexSection" }
        streak:
          type: object
          required: [monthKeys, rows]
          properties:
            monthKeys:
              type: array
              items: { type: string }
            rows:
              type: array
              items: { $ref: "#/components/schemas/BudgetStreakRow" }

    BehaviorFacts:
      type: object
      required:
        [
          range,
          daysSinceLast,
          streaks,
          funFacts,
          hourlySpendingClock,
          dayOfWeekSpend,
          hallOfFame,
        ]
      properties:
        range:
          type: object
          required: [start, end, daysCovered, trackingStart, floorApplied]
          properties:
            start: { type: string }
            end: { type: string }
            daysCovered: { type: integer }
            trackingStart: { type: string }
            floorApplied: { type: boolean }
        daysSinceLast:
          type: object
          required:
            [dining, amazon, coffee, gasStation, groceries, onlineShopping]
          properties:
            dining: { $ref: "#/components/schemas/DaysSinceEntry" }
            amazon: { $ref: "#/components/schemas/DaysSinceEntry" }
            coffee: { $ref: "#/components/schemas/DaysSinceEntry" }
            gasStation: { $ref: "#/components/schemas/DaysSinceEntry" }
            groceries: { $ref: "#/components/schemas/DaysSinceEntry" }
            onlineShopping: { $ref: "#/components/schemas/DaysSinceEntry" }
        streaks:
          type: object
          required: [noDining, coffeeFree]
          properties:
            noDining: { $ref: "#/components/schemas/StreakEntry" }
            coffeeFree: { $ref: "#/components/schemas/StreakEntry" }
        funFacts:
          type: object
          required:
            [
              biggestSplurge,
              mostVisitedMerchant,
              quietestDay,
              mostExpensiveDay,
              impulseBuyCount,
              subscriptionsCount,
              nextPaycheckCountdown,
            ]
          properties:
            biggestSplurge:
              oneOf:
                - { $ref: "#/components/schemas/TxnRef" }
                - type: "null"
            mostVisitedMerchant:
              oneOf:
                - type: object
                  required: [name, count, total, sampleCategoryName]
                  properties:
                    name: { type: string }
                    count: { type: integer }
                    total: { type: number }
                    sampleCategoryName: { type: ["string", "null"] }
                - type: "null"
            quietestDay:
              oneOf:
                - { $ref: "#/components/schemas/DaySpend" }
                - type: "null"
            mostExpensiveDay:
              oneOf:
                - { $ref: "#/components/schemas/DaySpend" }
                - type: "null"
            impulseBuyCount:
              type: object
              required: [count, total, exampleMerchants]
              properties:
                count: { type: integer }
                total: { type: number }
                exampleMerchants:
                  type: array
                  items: { type: string }
            subscriptionsCount:
              type: object
              required: [count, monthlyTotal, topThree]
              properties:
                count: { type: integer }
                monthlyTotal: { type: number }
                topThree:
                  type: array
                  items:
                    type: object
                    required: [name, amount, frequency]
                    properties:
                      name: { type: string }
                      amount: { type: number }
                      frequency: { type: string }
            nextPaycheckCountdown:
              oneOf:
                - type: object
                  required: [days, paycheckLabel, expectedAmount, expectedDate]
                  properties:
                    days: { type: integer }
                    paycheckLabel: { type: string }
                    expectedAmount: { type: number }
                    expectedDate: { type: string }
                - type: "null"
        hourlySpendingClock:
          type: array
          items:
            type: object
            required: [hour, total, count]
            properties:
              hour: { type: integer }
              total: { type: number }
              count: { type: integer }
        dayOfWeekSpend:
          type: array
          items:
            type: object
            required: [dow, label, total, count, avgPerDay]
            properties:
              dow: { type: integer }
              label: { type: string }
              total: { type: number }
              count: { type: integer }
              avgPerDay: { type: number }
        hallOfFame:
          type: object
          required: [biggestExpense, biggestIncome]
          properties:
            biggestExpense:
              oneOf:
                - { $ref: "#/components/schemas/TxnRef" }
                - type: "null"
            biggestIncome:
              oneOf:
                - { $ref: "#/components/schemas/TxnRef" }
                - type: "null"

    DaysSinceEntry:
      oneOf:
        - type: object
          required: [days, lastDate, lastMerchant, lastAmount]
          properties:
            days: { type: integer }
            lastDate: { type: string }
            lastMerchant: { type: string }
            lastAmount: { type: number }
        - type: "null"

    StreakEntry:
      type: object
      required: [currentDays, longestDays, longestEndDate]
      properties:
        currentDays: { type: integer }
        longestDays: { type: integer }
        longestEndDate: { type: string }

    TxnRef:
      type: object
      required: [amount, date, merchant, categoryName]
      properties:
        amount: { type: number }
        date: { type: string }
        merchant: { type: string }
        categoryName: { type: ["string", "null"] }

    DaySpend:
      type: object
      required: [date, total, dayOfWeek]
      properties:
        date: { type: string }
        total: { type: number }
        dayOfWeek: { type: string }

    AvalancheSchedule:
      type: object
      required:
        [
          proposedPayments,
          totalProposed,
          lowestPostScheduleBalance,
          lowestPostScheduleDate,
          currentAvalancheTarget,
          cashBuffer,
          bankBalance,
          scheduleThroughDate,
        ]
      properties:
        proposedPayments:
          type: array
          items:
            type: object
            required:
              [
                date,
                amount,
                rationale,
                confidence,
                paycheckAnchor,
                lowestBetweenThisAndNextPaycheck,
                headroom,
              ]
            properties:
              date: { type: string }
              amount: { type: number }
              rationale: { type: string }
              confidence: { type: string, enum: [high, medium, low] }
              paycheckAnchor: { type: string }
              lowestBetweenThisAndNextPaycheck: { type: number }
              headroom: { type: number }
        totalProposed: { type: number }
        lowestPostScheduleBalance: { type: number }
        lowestPostScheduleDate: { type: ["string", "null"] }
        currentAvalancheTarget:
          oneOf:
            - type: object
              required: [debtName, apr, balance]
              properties:
                debtName: { type: string }
                apr: { type: number }
                balance: { type: number }
            - type: "null"
        cashBuffer: { type: number }
        bankBalance: { type: number }
        scheduleThroughDate: { type: ["string", "null"] }
    ForecastBundle:
      type: object
      required: [events, transactions, resolutions, closedMonths, settings, fromDate, toDate, plaidCheckingAccounts]
      properties:
        fromDate: { type: string }
        toDate: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/ForecastEvent" }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        resolutions:
          type: array
          items: { $ref: "#/components/schemas/ForecastResolution" }
        closedMonths:
          type: array
          items: { type: string }
        settings: { $ref: "#/components/schemas/ForecastSettings" }
        bankSnapshot:
          oneOf:
            - $ref: "#/components/schemas/BankSnapshot"
            - type: "null"
        cashSignal:
          oneOf:
            - $ref: "#/components/schemas/CashSignal"
            - type: "null"
        plaidCheckingAccounts:
          type: array
          items: { $ref: "#/components/schemas/PlaidCheckingAccount" }
        checkingAccountExternalId:
          description: >-
            Plaid account_id the forecast treats as the bank account, resolved
            the same way the balance roll-forward resolves it. Null when no
            account can be identified uniquely.
          type: ["string", "null"]
        today:
          description: >-
            The calendar date (YYYY-MM-DD) the server judged "already happened"
            against when it built this bundle, the curve and the review badge.
            The page uses it so its inbox agrees with the badge.
          type: string
        monthSnapshots:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MonthSnapshot"
        accountSnapshots:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AccountSnapshot"
    MonthSnapshot:
      type: object
      required: [balance, at]
      properties:
        balance: { type: string }
        at: { type: string }
        gap: { type: ["string", "null"] }
        forecastEnd: { type: ["string", "null"] }
        bankEnd: { type: ["string", "null"] }
        pending: { type: ["integer", "null"] }
        reconciled: { type: ["boolean", "null"] }
        closedAt: { type: ["string", "null"] }
    SetBankSnapshotInput:
      type: object
      properties:
        balance: { type: ["string", "null"] }
        plaidAccountId: { type: ["string", "null"] }
    RefreshBankInput:
      type: object
      properties:
        plaidAccountId: { type: ["string", "null"] }
    DedupeTransactionsReport:
      type: object
      required: [groupsScanned, duplicatesRemoved, resolutionsRepointed, accountsScanned]
      properties:
        groupsScanned: { type: integer }
        duplicatesRemoved: { type: integer }
        resolutionsRepointed: { type: integer }
        accountsScanned: { type: integer }
    DuplicateTransactionCount:
      type: object
      required: [duplicateCount]
      properties:
        duplicateCount: { type: integer }
    AccountSnapshot:
      type: object
      required: [balance, at, source]
      properties:
        balance: { type: string }
        at: { type: string }
        source: { type: string, enum: [manual, plaid] }
        name: { type: ["string", "null"] }
        mask: { type: ["string", "null"] }

    AmexAnchor:
      type: object
      required: [amexEndingBalance, asOf, source]
      properties:
        amexEndingBalance: { type: ["number", "null"] }
        asOf:
          type: string
          description: >-
            An ISO instant, except for source "computed", which sends the latest
            Amex transaction's calendar day as a bare YYYY-MM-DD. Read it with the
            household calendar; never pass it to `new Date()` as-is.
        source: { type: string, enum: [debt, anchor, computed, missing] }
    AmexAnchorInput:
      type: object
      required: [balance]
      properties:
        balance: { type: number }
        asOf: { type: ["string", "null"] }

    AmexWeeklyPayoffCard:
      type: object
      required:
        [
          accountId,
          plaidAccountId,
          debtId,
          name,
          brand,
          weekCharges,
          chargeCount,
          statementBalance,
          pctOfStatementThisWeek,
          topMerchant,
          cadence,
          periodLabel,
          displayName,
        ]
      properties:
        accountId: { type: string }
        plaidAccountId: { type: ["string", "null"] }
        debtId: { type: ["string", "null"] }
        name: { type: string }
        brand: { type: string, enum: [blue, silver, gold] }
        cadence: { type: string, enum: [weekly, monthly] }
        periodLabel: { type: string }
        displayName: { type: ["string", "null"] }
        weekCharges: { type: number }
        chargeCount: { type: integer }
        statementBalance: { type: number }
        pctOfStatementThisWeek: { type: number }
        topMerchant:
          oneOf:
            - type: "null"
            - type: object
              required: [name, amount]
              properties:
                name: { type: string }
                amount: { type: number }
    AmexWeeklyPayoff:
      type: object
      required:
        [weekStart, weekEnd, cards, combinedWeekCharges, combinedStatementBalance]
      properties:
        weekStart: { type: string }
        weekEnd: { type: string }
        cards:
          type: array
          items: { $ref: "#/components/schemas/AmexWeeklyPayoffCard" }
        combinedWeekCharges: { type: number }
        combinedStatementBalance: { type: number }

    DashboardBudget:
      type: object
      required: [id, bucket, periodKey, amount, isDefault]
      properties:
        id: { type: string }
        bucket: { type: string }
        periodKey: { type: string }
        amount: { type: string }
        isDefault: { type: boolean }
    DashboardBudgetInput:
      type: object
      required: [bucket, periodKey, amount]
      properties:
        bucket: { type: string }
        periodKey: { type: string }
        amount: { type: string }

    WeeklySettlement:
      type: object
      required: [id, weekStart, closedAt, closedBy]
      properties:
        id: { type: string }
        weekStart: { type: string }
        closedAt: { type: string }
        closedBy: { type: string }
    WeeklySettlementInput:
      type: object
      required: [weekStart]
      properties:
        weekStart: { type: string }

    ImportSummary:
      type: object
      required: [batchId, counts, ruleAttributions]
      properties:
        batchId: { type: string }
        counts:
          type: object
          additionalProperties:
            type: integer
        # Per-rule attribution breakdown for transactions auto-categorized by
        # the user's mapping_rules during this import. Sorted by count
        # descending. Used by the Settings page to render a summary toast like
        # "Auto-categorized 12 transactions: 5 via 'STARBUCKS', 4 via
        # 'AMAZON', …" with a "View" link to the touched rules on the Mapping
        # Rules page so users can spot stale rules mis-routing chunks of the
        # workbook. Excludes rows whose Target column hard-coded the category
        # and rows where a manual override was preserved.
        ruleAttributions:
          type: array
          items: { $ref: "#/components/schemas/RuleAttribution" }

    RuleAttribution:
      type: object
      required: [ruleId, pattern, count]
      properties:
        ruleId: { type: string }
        pattern: { type: string }
        count: { type: integer }

    PlaidLinkToken:
      type: object
      required: [linkToken, expiration]
      properties:
        linkToken: { type: string }
        expiration: { type: string }
    PlaidUpdateLinkTokenInput:
      type: object
      required: [itemId]
      properties:
        itemId:
          type: string
          description: |
            Internal Plaid item row id (UUID) of the item that needs
            re-authentication. Used to look up the stored access_token and
            create a Plaid Link token in update mode.
    PlaidExchangeInput:
      type: object
      required: [publicToken]
      properties:
        publicToken: { type: string }
        institutionId: { type: ["string", "null"] }
        institutionName: { type: ["string", "null"] }
    PlaidAccount:
      type: object
      required: [id, accountId]
      properties:
        id: { type: string }
        accountId: { type: string }
        name: { type: ["string", "null"] }
        officialName: { type: ["string", "null"] }
        mask: { type: ["string", "null"] }
        type: { type: ["string", "null"] }
        subtype: { type: ["string", "null"] }
        # (#361) First-sync dedupe gate. `importCutoffDate` is the
        # inclusive YYYY-MM-DD upper bound on dates Plaid is allowed
        # to insert during the very first /transactions/sync against
        # this account: rows on/before it are skipped (assumed to
        # overlap manual / imported history the user already has) and
        # rows within ±7 days first try to merge with an unattached
        # manual row at the same amount/date. Auto-detected at link
        # time from existing manual rows; user-overridable via PATCH
        # /plaid/accounts/{id}/import-cutoff while
        # `firstSyncCompletedAt` is still null. Null when no overlap
        # is detected (no gate — same as the legacy behavior).
        importCutoffDate: { type: ["string", "null"] }
        # (#361) Stamped at the end of the first successful
        # /transactions/sync for this account. Until set, the cutoff
        # gate above is active. After it is set, the gate is
        # permanently disabled (subsequent cursor-based syncs behave
        # exactly as today). The Settings date picker hides itself
        # once this timestamp is non-null because the override is no
        # longer accepted.
        firstSyncCompletedAt: { type: ["string", "null"] }
    PlaidItemDetail:
      type: object
      required: [id, itemId, institutionSlug, accounts]
      properties:
        id: { type: string }
        itemId: { type: string }
        institutionId: { type: ["string", "null"] }
        institutionName: { type: ["string", "null"] }
        institutionSlug: { type: string }
        lastSyncedAt: { type: ["string", "null"] }
        lastSyncError: { type: ["string", "null"] }
        lastSyncErrorCode:
          type: ["string", "null"]
          description: |
            Plaid's structured `error_code` from the most recent failed
            sync (e.g. ITEM_LOGIN_REQUIRED, INVALID_CREDENTIALS,
            PENDING_EXPIRATION). Null when sync is healthy or when the
            previous failure had no structured code. Used by the UI to
            decide when to surface the "Reconnect" button next to the
            sync chip.
        # True when Plaid most recently returned PRODUCT_NOT_READY for this
        # item — the bank is still staging its historical batch. The Settings
        # page renders a neutral "Still preparing" badge so the user can tell
        # which institution is in the warm-up window vs. genuinely healthy.
        # Cleared on the next successful sync.
        stillPreparing: { type: boolean }
        # ISO timestamp of when this item first entered the still-preparing
        # state (i.e. when Plaid first returned PRODUCT_NOT_READY for it).
        # The Settings page uses this to render "Preparing for 12m / 3h" so
        # the user can tell a freshly linked bank from one that's stalled.
        # Null whenever stillPreparing is false.
        stillPreparingSince: { type: ["string", "null"] }
        # (#238) Plaid's `consent_expiration_time` cutoff for this item —
        # the date after which the bank link is auto-disconnected unless
        # the user re-consents. Captured at exchange time and refreshed
        # when sync hits PENDING_EXPIRATION / PENDING_DISCONNECT so the
        # value tracks Plaid's latest reported cutoff. Powers the dated
        # subline copy on the page-top reconnect banner, the
        # DebtReauthBanner, and the Settings "Needs reconnect" tooltip
        # ("Chase will disconnect on May 21 — reconnect now to keep it
        # linked."). Null when Plaid does not report a cutoff for this
        # item (most non-OAuth institutions).
        consentExpirationAt: { type: ["string", "null"] }
        # (#258) Wall-clock timestamp of when we last successfully
        # verified `consentExpirationAt` against Plaid (any path: link
        # exchange, sync's PENDING_EXPIRATION refresh, or the daily
        # cron). Updated on every successful /item/get call regardless
        # of whether the cutoff value actually changed, so users and
        # support can answer "is the disconnect countdown the user is
        # seeing fresh?" without diffing logs. Null until the first
        # successful refresh (e.g. for items linked before this column
        # existed).
        consentExpirationLastRefreshedAt: { type: ["string", "null"] }
        # (#265) Latest /item/get failure message captured during the
        # consent-refresh path (manual "Refresh disconnect dates"
        # button, on-sync PENDING_EXPIRATION refresh, or daily cron).
        # Cleared on the next successful refresh. Settings renders
        # this inline under the per-item "Disconnect date checked …"
        # line, styled like the existing lastSyncError block, so a
        # user who walks away after running the refresh can still
        # see *why* this bank's check failed without having to
        # re-trigger it. Distinct from `lastSyncError` so a healthy
        # /transactions/sync does not erase the consent-refresh
        # failure (and vice versa). Null on healthy items.
        consentExpirationLastRefreshError: { type: ["string", "null"] }
        # Plaid `error_code` (e.g. ITEM_LOGIN_REQUIRED) for the
        # consent-refresh failure above, when available. Lets the
        # frontend correlate the inline message with reauth flows.
        consentExpirationLastRefreshErrorCode: { type: ["string", "null"] }
        # (#274) The value of `consentExpirationAt` at the moment the
        # user dismissed the dashboard "consent expiring soon" banner.
        # The dashboard hides this item while the live cutoff still
        # matches; re-consenting (cutoff rolls forward) or a brand-new
        # item entering the window re-shows the alert. Null until the
        # user dismisses the banner for the first time.
        consentWarningDismissedForCutoff: { type: ["string", "null"] }
        # (#408) Categorical bucket derived from `lastSyncErrorCode` — one
        # of: reauth | rate_limit | institution_down | transient | unknown.
        # Null when sync is healthy. Lets clients render reconnect copy
        # without re-deriving the kind from the raw code.
        errorKind: { type: ["string", "null"] }
        # (#408) Newest occurredOn (YYYY-MM-DD) for any Plaid-sourced
        # row (or merged manual row carrying a plaid_account_id) on
        # any account belonging to this item. Drives the post-link
        # "No new transactions since <date>" copy after a relink heal
        # that backfills zero rows. Null when no rows exist yet.
        lastBankTxOn: { type: ["string", "null"] }
        # (#725) ISO timestamp of when the server short-circuited live
        # /transactions/refresh calls for this item after Plaid returned
        # INVALID_PRODUCT(transactions_refresh). When non-null, the
        # Settings bank tile surfaces a "Re-enable refresh" link the
        # user can click to clear the stamp without waiting for the
        # 7-day auto-retry — used after Plaid approves a previously
        # missing add-on. Cleared automatically on the next successful
        # /transactions/refresh call (self-heal), or by an explicit
        # POST /plaid/items/{id}/clear-refresh-disabled.
        refreshProductDisabledAt: { type: ["string", "null"] }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/PlaidAccount" }
    PlaidSyncInput:
      type: object
      properties:
        itemId: { type: ["string", "null"] }
        # When true, forces a billable `/transactions/refresh` before the
        # free cursor sync so a just-happened pending charge lands
        # immediately. Omitted / false = cheap cursor-only sync (the
        # default for the ordinary Sync button). Only set by the explicit
        # "Force refresh" button and the link/reconnect/re-enable flows.
        force: { type: boolean }
    PlaidSyncResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [itemId, added, modified, removed, autoCategorized, ruleAttributions]
            properties:
              itemId: { type: string }
              # (#357) Row id (`plaid_items.id`) of this item — needed
              # by the client when it dispatches the global
              # "plaid:reconnect" event so the listener can call
              # /plaid/link-token/update with the row id (the external
              # `itemId` above is Plaid's identifier and is NOT what
              # update-mode routes accept).
              plaidItemRowId: { type: ["string", "null"] }
              institutionName: { type: ["string", "null"] }
              added: { type: integer }
              modified: { type: integer }
              removed: { type: integer }
              autoCategorized: { type: integer }
              # Per-rule attribution breakdown for *newly added* rows that
              # the auto-categorize pipeline routed via one of the user's
              # mapping_rules. Sorted by count descending. Drives the
              # "Auto-categorized N new transactions: 5 via 'STARBUCKS', …"
              # summary toast with a "View" link to the touched rules on
              # the Mapping Rules page. `modified` rows are excluded so the
              # toast never inflates when Plaid replays metadata changes
              # for already-categorized historical rows.
              ruleAttributions:
                type: array
                items: { $ref: "#/components/schemas/RuleAttribution" }
              error: { type: ["string", "null"] }
              # True when Plaid responded with PRODUCT_NOT_READY (i.e. it is
              # still staging the historical batch for a freshly linked
              # item). The frontend treats this as a transient, non-error
              # state and does NOT show a destructive toast or persist a
              # red error chip.
              stillPreparing: { type: boolean }
              # (#403) Min / max occurredOn (YYYY-MM-DD) across the rows
              # actually inserted by this sync. Null when nothing was
              # inserted. The post-link "Ready — N added" panel uses
              # this to show "Imported N transactions from Mar 5 –
              # Apr 28" so the user can immediately tell whether the
              # window includes their current month or only historical
              # rows (in which case the panel surfaces a "still
              # importing recent activity" hint instead of a silent
              # success).
              importedDateRange:
                type: ["object", "null"]
                required: [min, max]
                properties:
                  min: { type: string }
                  max: { type: string }
              # (#357) Structured Plaid failure metadata, populated only on
              # error. Lets the frontend toast / inline header banner say
              # "<Institution>: <plain-English reason>" + a Reconnect CTA
              # without ever leaking raw axios "Request failed with status
              # code 400" strings, and lets support correlate user reports
              # back to Plaid's request_id without grepping logs.
              plaidErrorCode: { type: ["string", "null"] }
              plaidErrorMessage: { type: ["string", "null"] }
              # Plaid's `display_message` — when present, this is the
              # user-facing string Plaid itself recommends rendering.
              plaidDisplayMessage: { type: ["string", "null"] }
              # Plaid's `request_id` — quoted in support tickets so we
              # can ask Plaid "what happened on this exact call?".
              requestId: { type: ["string", "null"] }
              # HTTP status returned by Plaid (e.g. 400, 429, 500).
              httpStatus: { type: ["integer", "null"] }
              # Categorical bucket the frontend uses to pick a CTA:
              #   reauth, rate_limit, institution_down, transient, unknown.
              kind:
                type: ["string", "null"]
                enum:
                  - reauth
                  - rate_limit
                  - institution_down
                  - transient
                  - unknown
                  - null
              # (#402) Most recent occurredOn (YYYY-MM-DD) across rows
              # this run actually touched (added ∪ modified). The
              # post-link progress panel uses this to deep-link "View
              # imported transactions" straight to the month with the
              # freshly-imported rows for the just-linked item, instead
              # of falling back to a global most-recent-transaction
              # lookup that can point at an unrelated newer charge from
              # another bank. Null when this run touched no rows or on
              # the failure / still-preparing branches.
              lastOccurredOn: { type: ["string", "null"] }
              # (#723) Set when the `/transactions/refresh` call for this
              # item was skipped or rejected because the Plaid client is
              # not authorized for the `transactions_refresh` add-on
              # (Plaid returns INVALID_PRODUCT). The frontend swaps the
              # misleading "your bank is still preparing the initial
              # batch" toast for honest copy explaining that real-time
              # refresh isn't enabled on this Plaid plan, so Plaid's
              # ~6 h scheduled poll is the only source of new pending
              # data. Null when the refresh path either ran cleanly or
              # wasn't attempted on this sync.
              refreshDisabledReason: { type: ["string", "null"] }
              # (#723) ISO-8601 timestamp of the previous successful
              # sync for this item (i.e. when Plaid last refreshed the
              # data the user is currently looking at). Lets the honest
              # refresh-disabled toast anchor staleness — "Data is
              # current as of 4h ago" — so the user understands why
              # clicking Sync again right now won't surface fresh
              # pending charges. Null on the very first sync.
              lastSyncedAt: { type: ["string", "null"] }
              # (#728) Top-N descriptions of rows this sync actually
              # inserted (sourced from Plaid's `added` array only,
              # capped server-side at 5). The post-sync toast renders
              # a few names ("Added 3: VENMO, KROGER, +1 more")
              # instead of a bare "Added 3" so the user can recognize
              # what landed at a glance. Omitted (or empty) when this
              # item added nothing.
              addedDescriptions:
                type: array
                items: { type: string }
              # (2026-08-25) Bank reconciliation. Present only when a manual
              # Sync found that our ledger does NOT explain the balance the
              # bank reports — rows missing, duplicated or reversed. The app
              # used to just show the smaller number; a deposit that Plaid's
              # cursor skipped left every screen $169.90 light for four days
              # with nothing on screen to explain it. Null/absent means the
              # two sides tie, which is the normal case.
              balanceDrift:
                type: ["object", "null"]
                required: [bank, ledger, unexplained]
                properties:
                  bank: { type: string, description: "Plaid's live available balance for the checking account" }
                  ledger: { type: string, description: "The prior anchor rolled forward through every row we hold" }
                  unexplained: { type: string, description: "bank − ledger; positive when the bank holds money our rows cannot account for" }
    PlaidConsentRefreshItem:
      type: object
      required:
        - itemRowId
        - itemId
        - changed
      properties:
        # Server-side row id for the Plaid item (matches PlaidItemDetail.id).
        # Lets the client correlate per-item entries back to the Settings row.
        itemRowId: { type: string }
        # Plaid's `item_id` — included for parity with the manual-trigger
        # response so callers can log/debug without re-fetching.
        itemId: { type: string }
        institutionName: { type: ["string", "null"] }
        # Latest cutoff Plaid reports for this item, ISO timestamp. Null
        # when Plaid does not surface a cutoff (most non-OAuth banks).
        consentExpirationAt: { type: ["string", "null"] }
        # Wall-clock timestamp of when this manual refresh completed
        # successfully (i.e. the value just written into
        # `consent_expiration_last_refreshed_at`). Null when the refresh
        # failed before /item/get returned, so the UI can tell "Plaid
        # said nothing changed" apart from "we never reached Plaid".
        consentExpirationLastRefreshedAt: { type: ["string", "null"] }
        # True when the cutoff value actually moved on this run. The
        # toast counts these as "cutoff updated".
        changed: { type: boolean }
        # Per-item failure message (populated from Plaid's error body).
        # Null on success. The toast surfaces failed items with their
        # institution name so the user knows which bank to reconnect.
        error: { type: ["string", "null"] }
    PlaidConsentRefreshResult:
      type: object
      required: [scanned, updated, failed, items]
      properties:
        scanned: { type: integer }
        updated: { type: integer }
        failed: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaidConsentRefreshItem" }
    FlaggedMalformedItem:
      type: object
      required: [itemRowId, itemId, institutionName]
      properties:
        # Internal `plaid_items.id` of the flagged row — useful for
        # cross-referencing the per-item activity expander.
        itemRowId: { type: string }
        # External Plaid `item_id` Plaid uses across products / webhooks.
        itemId: { type: string }
        # Human-friendly bank name; null when Plaid never returned one.
        institutionName: { type: ["string", "null"] }
    PlaidMalformedTokenSweepAlert:
      type: object
      required: [channel, reason, recipient, error]
      properties:
        # `email` when an alert was actually dispatched, `log` for the
        # dev/log fallback, `skipped` when the spike threshold or dedup
        # window suppressed it.
        channel:
          type: string
          enum: [email, log, skipped]
        # Human-readable reason when channel === "skipped"; null when
        # an alert was actually dispatched.
        reason: { type: ["string", "null"] }
        # Resolved operator email when known; null when not configured
        # or when the dispatcher could not determine a recipient.
        recipient: { type: ["string", "null"] }
        # Set when a transport error happened on dispatch; the sweep
        # itself still ran successfully.
        error: { type: ["string", "null"] }
    PlaidMalformedTokenSweepResult:
      type: object
      required: [scanned, flagged, flaggedItems, alert]
      properties:
        # How many Plaid item rows the sweep examined.
        scanned: { type: integer }
        # How many of the scanned rows had a malformed access_token.
        flagged: { type: integer }
        flaggedItems:
          type: array
          items: { $ref: "#/components/schemas/FlaggedMalformedItem" }
        # Outcome of the spike-alert re-evaluation. Null when the
        # evaluator threw — the sweep still ran successfully and the
        # counts above are authoritative.
        alert:
          oneOf:
            - { $ref: "#/components/schemas/PlaidMalformedTokenSweepAlert" }
            - type: "null"
    PlaidPendingCleanupItem:
      type: object
      required: [description, amount, occurredOn, plaidTransactionId]
      properties:
        description: { type: ["string", "null"] }
        amount: { type: string }
        occurredOn: { type: string }
        plaidTransactionId: { type: string }
    PlaidPendingCleanupDetails:
      type: object
      required:
        [
          accountName,
          plaidAccountId,
          count,
          totalAmount,
          minOccurredOn,
          maxOccurredOn,
          items,
        ]
      properties:
        accountName: { type: ["string", "null"] }
        plaidAccountId: { type: string }
        count: { type: integer }
        totalAmount: { type: string }
        minOccurredOn: { type: string }
        maxOccurredOn: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaidPendingCleanupItem" }
    PlaidSyncAttempt:
      type: object
      required: [id, attemptedAt, kind, success]
      properties:
        id: { type: string }
        # ISO timestamp of when the attempt completed (success or fail).
        attemptedAt: { type: string }
        # Which Plaid product call this row records:
        #   * "transactions"    — /transactions/sync
        #   * "balance"         — /accounts/balance/get (bank snapshot refresh)
        #   * "liabilities"     — /liabilities/get / /accounts/get fallback
        #   * "pending_cleanup" — (#733) audit row for the vanished-pending
        #                         sweep (#732). Always success=true with
        #                         cleanupDetails populated; only written
        #                         when one or more rows were actually
        #                         deleted, never on empty sweeps.
        kind:
          type: string
          enum: [transactions, balance, liabilities, pending_cleanup]
        success: { type: boolean }
        # Plaid's structured `error_code` when success=false; null on
        # success or when Plaid did not return one.
        errorCode: { type: ["string", "null"] }
        # Human-readable message — Plaid's `error_message` when present,
        # otherwise the underlying error string. Null on success.
        # (#733) For kind="pending_cleanup" this carries the quiet
        # summary line ("Cleared 2 dropped pending charges from Amex
        # Gold — totaling $42.18 (2026-05-15 – 2026-05-16).") even
        # though success=true.
        errorMessage: { type: ["string", "null"] }
        # (#357) Enriched per-attempt failure metadata so Settings →
        # Recent activity can render exactly the same structured Plaid
        # failure that the live sync toast renders, including a
        # Reconnect CTA on reauth rows. All optional, populated only
        # for failure rows that came from extractPlaidError().
        plaidDisplayMessage: { type: ["string", "null"] }
        requestId: { type: ["string", "null"] }
        httpStatus: { type: ["integer", "null"] }
        errorKind:
          type: ["string", "null"]
          enum: [reauth, rate_limit, institution_down, transient, unknown, null]
        # (#733) Per-deletion detail blob for kind="pending_cleanup"
        # rows. Null for every other kind. Powers the "View details"
        # expander on the Recent activity row so a power user can see
        # exactly which pre-auths Plaid dropped this sync.
        cleanupDetails:
          oneOf:
            - { $ref: "#/components/schemas/PlaidPendingCleanupDetails" }
            - type: "null"
    PlaidSyncAttemptsResult:
      type: object
      required: [attempts]
      properties:
        attempts:
          type: array
          items: { $ref: "#/components/schemas/PlaidSyncAttempt" }
    PlaidEnvironmentInfo:
      type: object
      required: [env, configured, nonProdItemCount, nonProdItems]
      properties:
        env:
          type: ["string", "null"]
          enum: [sandbox, development, production, null]
        configured: { type: boolean }
        configError: { type: ["string", "null"] }
        nonProdItemCount: { type: integer }
        nonProdItems:
          type: array
          items:
            type: object
            required: [id, env]
            properties:
              id: { type: string }
              institutionName: { type: ["string", "null"] }
              env: { type: ["string", "null"] }

    PutMerchantAliasInput:
      type: object
      additionalProperties: false
      required: [description, alias]
      properties:
        description:
          type: string
          minLength: 1
          description: |
            (#888) The raw bank description of the transaction being renamed.
            The server derives the stable signature from this — the client
            never sends a signature so the two can't drift.
        alias:
          type: string
          minLength: 1
          description: The friendly merchant name to display for this signature.

    PutMerchantAliasResult:
      type: object
      additionalProperties: false
      required: [signature, alias, affectedCount]
      properties:
        signature:
          type: string
          description: The signature the alias was keyed on.
        alias:
          type: string
          description: The (trimmed) alias that was stored.
        affectedCount:
          type: integer
          description: |
            How many existing transactions share this signature (i.e. how many
            row headlines this rename now affects). Future matching rows are
            also covered but not counted here.

    DeleteMerchantAliasResult:
      type: object
      additionalProperties: false
      required: [signature, deleted]
      properties:
        signature:
          type: string
        deleted:
          type: boolean

    AgentFinding:
      type: object
      additionalProperties: false
      required: [id, kind, severity, confidence, payload, firstSeen, lastSeen, resolvedAt, dismissedAt]
      properties:
