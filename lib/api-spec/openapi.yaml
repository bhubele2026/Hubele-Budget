      operationId: getDebtPlan
      tags: [debt-plan]
      summary: The debt plan — strategies, debt-free range, milestones, planned vs confirmed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebtPlan" }
  /debt-plan/reconcile:
    post:
      operationId: reconcileDebtPlan
      tags: [debt-plan]
      summary: (Owner) Re-run the liability ledger and claim confirmation passes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebtPlanReconcileResult" }
  /debt-plan/snapshot:
    post:
      operationId: snapshotDebtPlan
      tags: [debt-plan]
      summary: (Owner) Write the day's debt progress snapshot and reached milestones
      parameters:
        - in: query
          name: date
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebtPlanSnapshotResult" }
  /metrics:
    get:
      operationId: getMetrics
      tags: [metrics]
      summary: The household's daily progress metrics over a range of days
      description: >-
        Rows of the nightly `household_metrics_daily` snapshot, oldest first,
        for `from`..`to` inclusive (default: the last 30 days ending today;
        at most 93 days). `latest` is the newest row on or before `to`, even
        when it is older than `from`. Read-only: nothing is computed on this
        request.
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string }
        - in: query
          name: to
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsResponse" }
        "400":
          description: Bad range (not YYYY-MM-DD, from after to, or more than 93 days)
  /metrics/recompute:
    post:
      operationId: recomputeMetrics
      tags: [metrics]
      summary: (Owner) Run the nightly snapshot for one day now
      description: >-
        Writes the day's debt progress snapshots, reached milestones and metrics
        row. `date` defaults to today and may not be in the future. A past day
        is rebuilt from the stored snapshots; its point-in-time fields are kept.
      parameters:
        - in: query
          name: date
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsRecomputeResult" }
  /spine:
    get:
      operationId: getSpine
      tags: [spine]
      summary: One shared snapshot of the household's core numbers (the spine)
      description: >-
        Every figure the app's headline surfaces show, read once at one instant
        so no two tiles can quote different moments. Each field is produced by
        the same function the owning page's endpoint calls — bank/forecast from
        computeCashSignal, spend from buildSpendingFacts, bills from
        buildBillsSummary, payoff from @workspace/avalanche-core, review count
        from computeReviewCount, position from buildMoneyPosition (as GET
        /money/position) — and an integration test asserts each one
        equals the owning endpoint's value to the cent. The debt field carries a
        PERCENTAGE ONLY; this response never contains a balance or an amount
        owed, because it is what the landing page paints.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Spine" }

  /money/position:
    get:
      operationId: getMoneyPosition
      tags: [money]
      summary: How much is safe to spend now, until payday and this week (the money position)
      description: >-
        computePosition (avalanche-core) over one read of the household: the
        forecast curve computeCashSignal builds (the spine's own horizon of 90
        days), the current Sunday–Saturday week classified by classifyMovement,
        the weekly cap from allowance_plans and the bank's freshness. The spine's
        `position` is the same call; an integration test asserts they agree to
        the cent. Never carries credit, a limit, a debt balance or an amount owed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyPosition" }

  /money/afford:
    post:
      operationId: evaluateAfford
      tags: [money]
      summary: Can we afford this? One purchase against the money position, before and after
      description: >-
        evaluateAfford (avalanche-core) over one read of the household — the same
        read GET /money/position makes, plus the debt plan's debts and settings
        and this month's category plans. The purchase is one more outflow on the
        same curve: the curve is re-walked, the position re-computed (a purchase
        this week counts against this week's cap) and the debt-free range re-run
        with that month's extra cut when what is left until payday falls under it.
        A $0 purchase reproduces the baseline to the cent, and a purchase never
        shows a higher figure than the baseline. Stateless; nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluateAffordBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AffordResult" }
        "400": { description: "Invalid purchase, or a date past the forecast window" }
        "404": { description: The category or member is not in this household }

  /allowance-plans:
    get:
      operationId: listAllowancePlans
      tags: [money]
      summary: The household's allowance plans and the suggested weekly cap with its working
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowancePlans" }

  /allowance-plans/{id}:
    put:
      operationId: updateAllowancePlan
      tags: [money]
      summary: Set a plan's amount (household owner only; writes source "owner")
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowancePlanUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowancePlan" }
        "400":
          description: Invalid amount or date
        "403":
          description: Only the household owner sets a plan
        "404":
          description: No such plan in this household
        "409":
          description: Another plan for the same member and period already starts on that date

  /agent/findings:
    get:
      operationId: listAgentFindings
      tags: [agent]
      summary: What the proactive monitor noticed (open by default), newest first
      description: >-
        (AI-3) Findings are written by deterministic detectors over the money
        position, the bills, the budget and the recent rows — no model call. The
        payload carries ids (refs) and numbers (figures), never a merchant name.
        `open` = not resolved and not dismissed.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, all], default: open }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentFindingList" }

  /agent/findings/{id}/dismiss:
    post:
      operationId: dismissAgentFinding
      tags: [agent]
      summary: Dismiss a finding (it stays in the ledger, out of the open list)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentFinding" }
        "404":
          description: No such finding in this household

  /agent/findings/{id}/resolve:
    post:
      operationId: resolveAgentFinding
      tags: [agent]
      summary: Mark a finding resolved (it will not re-fire for 7 days unless it gets more severe)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentFinding" }
        "404":
          description: No such finding in this household

  /agent/monitor/run:
    post:
      operationId: runAgentMonitor
      tags: [agent]
      summary: Run the monitor for this household now (owner only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMonitorRunResult" }
        "403":
          description: Only the household owner runs the monitor

  /agent/runs:
    get:
      operationId: listAgentRuns
      tags: [agent]
      summary: The agent's recent runs, newest first
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 30, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunList" }

  /agent/actions:
    get:
      operationId: listAgentActions
      tags: [agent]
      summary: The Activity trail — what the agent did, newest first
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentActionList" }

  /agent/actions/{id}/undo:
    post:
      operationId: undoAgentAction
      tags: [agent]
      summary: Undo a reversible agent action
      description: >-
        Only reversible action types can be undone. `set_category` (the
        categorizer's model pass) undoes the decision it recorded and stamps the
        action.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Undone; the updated action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentAction" }
        "404":
          description: No such action in this household
        "409":
          description: The action is not reversible, or was already undone
        "501":
          description: A reversible action type whose undo has not shipped yet

  /categorization/run:
    post:
      operationId: runCategorization
      tags: [categorization]
      summary: |
        Owner only. Run the deterministic categorization stages over the
        household's rows dated on/after `since` (default: the last 90 days).
        Idempotent: a second run with nothing changed records nothing.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunCategorizationInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorizationRunResult" }
        "403": { description: Owner only }

  /categorization/review:
    get:
      operationId: listCategorizationReview
      tags: [categorization]
      summary: Open decisions (provisional or queued), oldest first.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueue" }

  /categorization/review/{decisionId}/accept:
    post:
      operationId: acceptCategorizationDecision
      tags: [categorization]
      parameters:
        - { in: path, name: decisionId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResolution" }
        "404": { description: Not found }
        "409": { description: Already resolved }

  /categorization/review/{decisionId}/skip:
    post:
      operationId: skipCategorizationDecision
      tags: [categorization]
      parameters:
        - { in: path, name: decisionId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResolution" }
        "404": { description: Not found }
        "409": { description: Already resolved }

  /categorization/review/{decisionId}/correct:
    post:
      operationId: correctCategorizationDecision
      tags: [categorization]
      summary: |
        File the row by hand (locked), learn merchant memory, and return the
        retroactive candidates. Never applies them.
      parameters:
        - { in: path, name: decisionId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectDecisionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResolution" }
        "400": { description: Unknown category }
        "404": { description: Not found }
        "409": { description: Already resolved }

  /category-decisions:
    get:
      operationId: listCategoryDecisions
      tags: [categorization]
      summary: |
        (PR-A2) How one charge was filed: its decisions, newest first, at most
        20. A charge outside the household answers 404.
      parameters:
        - { in: query, name: transactionId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: { $ref: "#/components/schemas/CategoryDecision" }
        "400": { description: Invalid query }
        "404": { description: Not found }

  /category-decisions/{id}/undo:
    post:
      operationId: undoCategoryDecision
      tags: [categorization]
      summary: |
        Restore the decision's previous category, clear provisional, stamp
        undone_at and disable the memory it created.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UndoDecisionResult" }
        "400": { description: Nothing to undo }
        "404": { description: Not found }
        "409": { description: The row is locked or changed since }

  /learned-rules:
    get:
      operationId: listLearnedRules
      tags: [categorization]
      summary: Merchant memory, with its evidence counts.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearnedRule" }

  /learned-rules/{id}:
    patch:
      operationId: updateLearnedRule
      tags: [categorization]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLearnedRuleInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnedRule" }
        "400": { description: Invalid }
        "404": { description: Not found }
        "409": { description: A rule with that scope already exists }
    delete:
      operationId: deleteLearnedRule
      tags: [categorization]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }

  /learned-rules/{id}/apply-retroactively:
    post:
      operationId: applyLearnedRuleRetroactively
      tags: [categorization]
      summary: |
        Explicit request: file every unlocked row of this merchant (within the
        rule's scope) into its category. Each write is a `user` decision.
        (PR-A2) With `dryRun=true` nothing is written: the answer is how many
        rows would move and up to five of them. The server also reads
        `{ "dryRun": true }` in the JSON body; the typed client sends the query
        parameter, which keeps existing callers of the mutation unchanged.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: dryRun, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyRetroactivelyResult" }
        "404": { description: Not found }

  /transactions/{id}/splits:
    get:
      operationId: getTransactionSplits
      tags: [categorization]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionSplits" }
        "404": { description: Not found }
    post:
      operationId: replaceTransactionSplits
      tags: [categorization]
      summary: |
        Replace-all. The parts must add up to the charge's amount to the cent;
        the charge keeps its own category and becomes locked.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceTransactionSplitsInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionSplits" }
        "400": { description: Invalid split }
        "404": { description: Not found }
    delete:
      operationId: deleteTransactionSplits
      tags: [categorization]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }

  # ── (AI-2) Ask: conversations, chat (SSE), proposals, memory, wish list, AI usage ──
  /ai/conversations:
    post:
      operationId: createAiConversation
      tags: [ai]
      summary: Start a conversation with Ask
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiConversation" }
    get:
      operationId: listAiConversations
      tags: [ai]
      summary: The signed-in person's conversations, newest first
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiConversationList" }

  /ai/conversations/{id}:
    get:
      operationId: getAiConversation
      tags: [ai]
      summary: One conversation with its messages (the polling fallback after a dropped stream)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiConversationDetail" }
        "404": { description: No such conversation for this person }

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai, ai-stream]
      summary: Ask a question; the answer streams back as server-sent events
      description: >-
        (AI-2) `text/event-stream`. Each frame is `event: <type>` and
        `data: <AiChatEvent as JSON>`; a `: ping` comment arrives every 15
        seconds. The model reads through tools and may propose changes; it never
        applies one. After `done` (or a dropped stream) read the stored answer
        from `GET /ai/conversations/{id}`. Tagged `ai-stream`: generated for
        the zod package only — the web client reads the stream itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiChatRequest" }
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/AiChatEvent" }
            # The payload of one frame, so the zod package carries a validator for it.
            application/json:
              schema: { $ref: "#/components/schemas/AiChatEvent" }
        "400": { description: Invalid request }
        "404": { description: No such conversation for this person }
        "409": { description: This conversation is already answering }
        "429": { description: Too many requests (30 a minute per person) }

  /agent/proposals:
    get:
      operationId: listAgentProposals
      tags: [agent]
      summary: Changes Ask proposed, newest first (open by default)
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [proposed, approved, rejected, applied, expired, all], default: proposed }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProposalList" }

  /agent/proposals/{id}/approve:
    post:
      operationId: approveAgentProposal
      tags: [agent]
      summary: Approve a proposal and apply it through the app's own writer
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProposal" }
        "403": { description: Only the household owner sets the weekly limit }
        "404": { description: No such proposal in this household }
        "409": { description: "Not open (decided or expired), or its target changed" }

  /agent/proposals/{id}/reject:
    post:
      operationId: rejectAgentProposal
      tags: [agent]
      summary: Reject a proposal
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProposal" }
        "404": { description: No such proposal in this household }
        "409": { description: Not open }

  /memory:
    get:
      operationId: listMemory
      tags: [memory]
      summary: What the household (or Ask, visibly) keeps in memory
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryList" }

  /memory/{scope}/{key}:
    put:
      operationId: putMemory
      tags: [memory]
      summary: State a preference or decision (replaces what the key held)
      parameters:
        - { in: path, name: scope, required: true, schema: { type: string, enum: [categorization, spending, debt, general] } }
        - { in: path, name: key, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutMemoryBody" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryItem" }
        "400": { description: Invalid key or value }
        "409": { description: The household's memory is full }

  /memory/{id}:
    delete:
      operationId: deleteMemory
      tags: [memory]
      summary: Forget one memory (it leaves every list and every prompt)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204": { description: Forgotten }
        "404": { description: No such memory in this household }

  /wishlist:
    get:
      operationId: listWishlist
      tags: [wishlist]
      summary: The wish list, with each item's waiting period
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistList" }
    post:
      operationId: createWishlistItem
      tags: [wishlist]
      summary: Add something to the wish list (starts a waiting period)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWishlistItemBody" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistItem" }
        "400": { description: Invalid item }

  /wishlist/{id}:
    patch:
      operationId: updateWishlistItem
      tags: [wishlist]
      summary: Edit an item or decide it (a yes waits out the waiting period)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWishlistItemBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistItem" }
        "400": { description: Invalid edit }
        "404": { description: No such item in this household }
        "409": { description: Still in the waiting period }

  /wishlist/{id}/evaluate:
    post:
      operationId: evaluateWishlistItem
      tags: [wishlist]
      summary: Evaluate one wish-list item now, as if bought today, and store the answer
      description: >-
        The nightly wishlist.evaluate job's work for one item: evaluateAfford with
        the item's amount (and category) today, stored in the item's
        last_evaluation.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Evaluated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistEvaluationResult" }
        "400": { description: The item has no amount to evaluate }
        "404": { description: No such item in this household }

  /ai/usage/summary:
    get:
      operationId: getAiUsageSummary
      tags: [ai]
      summary: This month's AI cost, calls, caps and the latest runs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiUsageSummary" }

  /ai/budget:
    put:
      operationId: updateAiBudget
      tags: [ai]
      summary: Owner sets the monthly caps and the pause
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAiBudgetBody" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiBudget" }
        "400": { description: Invalid caps }
        "403": { description: Only the household owner sets the budget }

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: The household's goals with progress, the money they hold back in checking, and the cash buffer beside them
      description: >-
        (PR-C) A goal's current amount is the backing savings account's balance when
        an account backs it (null until that balance is known), else the amount the
        household typed. monthsToTargetLow/High are a range at the contribution
        rate, never a date promise. Archived goals are left out unless
        include=archived. A buffer goal's target sits beside the cash buffer; it
        never changes it. Read-only.
      parameters:
        - in: query
          name: include
          schema: { type: string, enum: [archived] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalList" }
    post:
      operationId: createGoal
      tags: [goals]
      summary: Add a goal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalCreate" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { description: "Invalid goal, date or backing account" }

  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Edit a goal
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { description: "Invalid edit, date or backing account" }
        "404": { description: No such goal in this household }
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Remove a goal (archived, not deleted, when it holds money back in checking)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted or archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalDeleteResult" }
        "404": { description: No such goal in this household }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status, version, jobs, ai, sms]
      properties:
        status: { type: string }
        version: { type: string }
        jobs: { $ref: "#/components/schemas/HealthJobs" }
        ai: { $ref: "#/components/schemas/HealthAi" }
        sms: { $ref: "#/components/schemas/HealthSms" }

    HealthJobs:
      type: object
      required: [mode, started, failedLast24h, dlq]
      properties:
        mode: { type: string, enum: ["on", "off"] }
        started: { type: boolean }
        failedLast24h:
          type: ["integer", "null"]
          description: Jobs that failed for good in the last 24 hours; null when unreadable.
        dlq:
          type: ["integer", "null"]
          description: Jobs waiting in dead-letter queues; null when unreadable.

    HealthAi:
      type: object
      required: [enabled, configured, provider]
      properties:
        enabled: { type: boolean }
        configured: { type: boolean }
        provider: { type: string, enum: [anthropic, fake] }

    HealthSms:
      type: object
      required: [provider, configured, mode]
      properties:
        provider: { type: string, enum: [twilio, console, fake] }
        configured: { type: boolean, description: True only when the provider can really send (console is never configured). }
        mode:
          type: string
          enum: [live, preview]
          description: live only when Twilio is the provider and every credential is present; console and fake are preview.

    RecapError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }

    RecapSettings:
      type: object
      required:
        - enabled
        - sendTimeLocal
        - timezone
        - phoneLast4
        - verified
        - pausedUntil
        - skipWeekends
        - extraAlerts
        - consentedAt
        - optedOutAt
        - consentText
        - consentTextVersion
        - delivery
      properties:
        enabled: { type: boolean }
        delivery: { $ref: "#/components/schemas/RecapDeliveryState" }
        sendTimeLocal: { type: string, description: "HH:MM, 24-hour, in `timezone`" }
        timezone: { type: string, description: IANA zone }
        phoneLast4: { type: ["string", "null"] }
        verified: { type: boolean }
        pausedUntil: { type: ["string", "null"], description: ISO-8601 instant }
        skipWeekends: { type: boolean }
        extraAlerts: { type: boolean }
        consentedAt: { type: ["string", "null"], description: ISO-8601 instant }
        optedOutAt: { type: ["string", "null"], description: ISO-8601 instant }
        consentText: { type: string, description: The exact sentence the member agrees to }
        consentTextVersion: { type: string }

    RecapDeliveryState:
      type: object
      required: [mode, providerConfigured, phoneVerified, scheduled, sendTimeLocal, timezone, lastDelivery]
      properties:
        mode: { type: string, enum: [live, preview], description: preview = texts are written to the server log and never sent }
        providerConfigured: { type: boolean }
        phoneVerified: { type: boolean }
        scheduled: { type: boolean, description: enabled, verified, not opted out and not paused }
        sendTimeLocal: { type: string }
        timezone: { type: string }
        lastDelivery:
          oneOf:
            - type: object
              required: [status, provider, at]
              properties:
                status: { type: string, enum: [queued, sent, delivered, undelivered, failed, previewed], description: previewed = a console row, never sent }
                provider: { type: string, enum: [twilio, console, fake] }
                at: { type: string }
            - type: "null"

    RecapSettingsInput:
      type: object
      properties:
        enabled: { type: boolean }
        sendTimeLocal: { type: string }
        timezone: { type: string }
        skipWeekends: { type: boolean }
        extraAlerts: { type: boolean }

    RecapVerifyStartInput:
      type: object
      required: [phoneE164, consent]
      properties:
        phoneE164: { type: string, description: A US mobile number; any common format is normalised to E.164 }
        consent: { type: boolean, description: Must be true }

    RecapVerifyStartResult:
      type: object
      required: [sent, expiresAt]
      properties:
        sent: { type: boolean }
        expiresAt: { type: string }
        devCode:
          type: string
          description: Present only outside production when no real provider is configured.

    RecapVerifyConfirmInput:
      type: object
      required: [code]
      properties:
        code: { type: string }

    RecapTestSendResult:
      type: object
      required: [status, mode, deliveryId]
      properties:
        status: { type: string, enum: [sent, previewed], description: previewed = no text was sent }
        mode: { type: string, enum: [live, preview] }
        deliveryId: { type: ["string", "null"] }
        text: { type: ["string", "null"], description: The text that would have been sent; present in preview. }

    RecapPauseInput:
      type: object
      required: [until]
      properties:
        until: { type: ["string", "null"], description: ISO-8601 instant, or null to resume }

    RecapDeliveryItem:
      type: object
      required: [id, kind, forDate, status, provider, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [scheduled, test, verification, alert, reply] }
        forDate: { type: ["string", "null"] }
        status: { type: string, enum: [queued, sent, delivered, undelivered, failed, previewed] }
        provider: { type: string, enum: [twilio, console, fake] }
        createdAt: { type: string }

    RecapPreviewInput:
      type: object
      properties:
        forDate: { type: string, description: "YYYY-MM-DD; defaults to today in the member's time zone" }

    RecapPreview:
      type: object
      required: [model, template, facts]
      properties:
        model:
          oneOf:
            - type: object
              required: [text, source, demo]
              properties:
                text: { type: string }
                source: { type: string, enum: [model] }
                demo: { type: boolean, description: True when the demo provider wrote it (no model ran) }
            - type: "null"
        template:
          type: object
          required: [text]
          properties:
            text: { type: string }
        facts:
          type: object
          additionalProperties: true
          description: The deterministic facts both drafts were written from (money in dollars)

    RecapHistoryItem:
      type: object
      required: [id, forDate, text, source, status, generatedAt, delivery]
      properties:
        id: { type: string }
        forDate: { type: string }
        text: { type: string }
        source: { type: string, enum: [model, template] }
        status: { type: string, enum: [drafted, sent, failed, skipped, previewed] }
        generatedAt: { type: string }
        delivery:
          oneOf:
            - type: object
              required: [status, provider, createdAt]
              properties:
                status: { type: string, enum: [queued, sent, delivered, undelivered, failed, previewed] }
                provider: { type: string, enum: [twilio, console, fake] }
                createdAt: { type: string }
            - type: "null"

    RecapGenerateNowInput:
      type: object
      properties:
        forDate: { type: string }
        userId: { type: string, description: A member of the owner's household; defaults to the caller }
        replace: { type: boolean, description: Replace a recap that has not been sent }

    RecapGenerateNowResult:
      type: object
      required: [created, recap]
      properties:
        created: { type: boolean }
        recap: { $ref: "#/components/schemas/RecapHistoryItem" }

    OpsJobQueueCount:
      type: object
      required: [queue, state, count]
      properties:
        queue: { type: string }
        state: { type: string }
        count: { type: integer }

    OpsJobFailure:
      type: object
      required: [id, queue, error, retryCount, createdOn, startedOn, completedOn]
      properties:
        id: { type: string }
        queue: { type: string }
        error:
          type: ["string", "null"]
          description: The error message the handler failed with (no stack), at most 500 characters.
        retryCount: { type: integer }
        createdOn: { type: string, format: date-time }
        startedOn: { type: ["string", "null"], format: date-time }
        completedOn: { type: ["string", "null"], format: date-time }

    OpsJobsReport:
      type: object
      required: [mode, started, schema, counts, failures]
      properties:
        mode: { type: string, enum: ["on", "off"] }
        started: { type: boolean }
        schema: { type: string }
        counts:
          type: array
          items: { $ref: "#/components/schemas/OpsJobQueueCount" }
        failures:
          type: array
          items: { $ref: "#/components/schemas/OpsJobFailure" }

    OpsJobRetryResult:
      type: object
      required: [id, queue, retried]
      properties:
        id: { type: string }
        queue: { type: string }
        retried: { type: boolean }

    BadgeCount:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    SpineNextMilestone:
      type: object
      required: [label, estimatedMonth]
      properties:
        label: { type: string }
        estimatedMonth: { type: string, description: YYYY-MM — a month, never a date }
    DebtPlanStrategySummary:
      type: object
      required: [monthsToFreedom, debtFreeMonth, totalInterest, firstKill]
      properties:
        monthsToFreedom: { type: ["integer", "null"] }
        debtFreeMonth: { type: ["string", "null"], description: YYYY-MM }
        totalInterest: { type: ["number", "null"] }
        firstKill:
          oneOf:
            - type: object
              required: [debtId, month]
              properties:
                debtId: { type: string }
                month: { type: string }
            - type: "null"
    DebtPlanAssumption:
      type: object
      required: [key, text]
      properties:
        key: { type: string }
        text: { type: string }
    DebtPlanMilestone:
      type: object
      required: [key, kind, label, debtId, monthIndex, estimatedMonth]
      properties:
        key: { type: string }
        kind: { type: string, enum: [debt_paid_off, first_card_zero, percent_paid] }
        label: { type: string }
        debtId: { type: ["string", "null"] }
        monthIndex: { type: integer }
        estimatedMonth: { type: string }
    DebtPlan:
      type: object
      description: >-
        (PR-D) The debt plan. Months and ranges only — never one exact payoff
        date. ⚠️ `comparison.detail` is the only part that carries a balance
        (per debt, for the Plan › Debt page); every other key is held to the
        no-balance law by spineParity.integration.test.ts.
      required:
        [asOf, strategy, extraMonthly, comparison, range, milestones, planned60d, confirmedMtd, paidDownGenuineMtd, assumptions]
      properties:
        asOf: { type: string }
        strategy: { type: string, enum: [avalanche, snowball] }
        extraMonthly: { type: number, description: avalanche_settings.manual_extra — the extra the forecast plans }
        comparison:
          type: object
          required: [avalanche, snowball, delta, killMonths, detail]
          properties:
            avalanche: { $ref: "#/components/schemas/DebtPlanStrategySummary" }
            snowball: { $ref: "#/components/schemas/DebtPlanStrategySummary" }
            delta:
              type: object
              required: [months, interest]
              properties:
                months: { type: ["integer", "null"], description: Snowball minus avalanche }
                interest: { type: ["number", "null"], description: Snowball minus avalanche }
            killMonths:
              type: array
              items:
                type: object
                required: [debtId, avalanche, snowball]
                properties:
                  debtId: { type: string }
                  avalanche: { type: ["string", "null"] }
                  snowball: { type: ["string", "null"] }
            detail:
              type: object
              required: [debts]
              properties:
                debts:
                  type: array
                  items:
                    type: object
                    required: [debtId, name, apr, balance, minPayment, minPaymentSource]
                    properties:
                      debtId: { type: string }
                      name: { type: string }
                      apr: { type: number }
                      balance: { type: number }
                      minPayment: { type: number }
                      minPaymentSource: { type: ["string", "null"] }
        range:
          type: object
          required: [earliestMonth, latestMonth, interestLow, interestHigh, runs, assumptions, newChargesPerMonth]
          properties:
            earliestMonth: { type: ["string", "null"] }
            latestMonth: { type: ["string", "null"], description: null = open-ended (a run never finishes) }
            interestLow: { type: ["number", "null"] }
            interestHigh: { type: ["number", "null"] }
            newChargesPerMonth: { type: number, description: Measured — charges on the plan's debts over the last 90 days ÷ 3 }
            runs:
              type: array
              items:
                type: object
                required: [key, debtFreeMonth, totalInterest]
                properties:
                  key: { type: string, enum: [base, half_extra, new_charges] }
                  debtFreeMonth: { type: ["string", "null"] }
                  totalInterest: { type: ["number", "null"] }
            assumptions:
              type: array
              items: { $ref: "#/components/schemas/DebtPlanAssumption" }
        milestones:
          type: object
          required: [achieved, next, upcoming]
          properties:
            achieved:
              type: array
              items:
                type: object
                required: [key, label, debtId, achievedOn]
                properties:
                  key: { type: string }
                  label: { type: string }
                  debtId: { type: ["string", "null"] }
                  achievedOn: { type: string }
            next:
              oneOf:
                - type: object
                  required: [key, label, estimatedMonth]
                  properties:
                    key: { type: string }
                    label: { type: string }
                    estimatedMonth: { type: string }
                - type: "null"
            upcoming:
              type: array
              items: { $ref: "#/components/schemas/DebtPlanMilestone" }
        planned60d:
          type: array
          description: Debt minimums and the Avalanche extra still on the cash curve in the next 60 days
          items:
            type: object
            required: [date, itemId, debtId, label, amount]
            properties:
              date: { type: string }
              itemId: { type: string }
              debtId: { type: ["string", "null"] }
              label: { type: string }
              amount: { type: number }
        confirmedMtd: { type: number, description: Debt payments a bank row confirms, this household month }
        paidDownGenuineMtd: { type: number, description: confirmedMtd less transfer pairs }
        assumptions:
          type: array
          items: { $ref: "#/components/schemas/DebtPlanAssumption" }
    DebtPlanReconcileResult:
      type: object
      required: [ledgerEventsWritten, ledgerEventsCleared, claimsConfirmed, claimsReverted]
      properties:
        ledgerEventsWritten: { type: integer }
        ledgerEventsCleared: { type: integer }
        claimsConfirmed: { type: integer }
        claimsReverted: { type: integer }
    DebtPlanSnapshotResult:
      type: object
      required: [asOf, snapshotsWritten, milestonesInserted]
      properties:
        asOf: { type: string }
        snapshotsWritten: { type: integer }
        milestonesInserted: { type: array, items: { type: string } }
    DailyMetrics:
      type: object
      description: >-
        Definitions: lib/avalanche-core/src/metrics.ts and
        docs/reviews/2026-10-08-pre-metrics.md. Point-in-time fields are null on
        a past day that has no stored observation.
      required:
        - totalDebtEffective
        - debtPaidDownGenuineMtd
        - interestChargedMtd
        - newChargesMtd
        - discretionaryWtd
        - discretionaryMtd
        - weeklyCap
        - withinPlan
        - confirmedPaymentsMtd
        - milestonesReached
        - uncategorizedCount
        - reviewQueueSize
        - dataCompleteness
      properties:
        totalDebtEffective: { type: ["number", "null"] }
        debtPaidDownGenuineMtd: { type: number }
        interestChargedMtd: { type: number }
        newChargesMtd: { type: number }
        discretionaryWtd: { type: ["number", "null"] }
        discretionaryMtd: { type: ["number", "null"] }
        weeklyCap: { type: ["number", "null"] }
        withinPlan: { type: ["string", "null"], enum: [over, tight, yes, null] }
        confirmedPaymentsMtd: { type: number }
        milestonesReached: { type: integer }
        uncategorizedCount: { type: ["integer", "null"] }
        reviewQueueSize: { type: ["integer", "null"] }
        dataCompleteness:
          type: object
          required: [stale, staleReason, accountsSilentDays]
          properties:
            stale: { type: ["boolean", "null"] }
            staleReason: { type: ["string", "null"] }
            accountsSilentDays: { type: ["integer", "null"] }
    MetricsDay:
      type: object
      required: [asOf, version, computedAt, metrics]
      properties:
        asOf: { type: string }
        version: { type: integer }
        computedAt: { type: string }
        metrics: { $ref: "#/components/schemas/DailyMetrics" }
    MetricsResponse:
      type: object
      required: [from, to, rows, latest]
      properties:
        from: { type: string }
        to: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/MetricsDay" }
        latest:
          anyOf:
            - { $ref: "#/components/schemas/MetricsDay" }
            - { type: "null" }
    MetricsRecomputeResult:
      type: object
      required: [asOf, snapshotsWritten, milestonesInserted, metricsWritten]
      properties:
        asOf: { type: string }
        snapshotsWritten: { type: integer }
        milestonesInserted: { type: array, items: { type: string } }
        metricsWritten: { type: boolean }
    SpineNextBill:
      type: object
      required: [name, amount, dueDate]
      properties:
        name: { type: string }
        amount: { type: string }
        dueDate: { type: string }

    BankFreshness:
      type: object
      description: >-
        Whether the bank balance can be trusted right now, decided on the server by
        computeBankFreshness(). Served as the spine's bank fields and as `freshness` on
        /forecast/bank-balance-explain.
      required: [source, lastContactAt, lastFailureAt, stale, staleReason]
      properties:
        source: { type: ["string", "null"], enum: [plaid, manual, null], description: Where the snapshot came from; null when there is no snapshot }
        lastContactAt: { type: ["string", "null"], description: Last successful sync of the Plaid item behind the snapshot account }
        lastFailureAt: { type: ["string", "null"], description: Newest failed transactions or balance refresh not yet followed by a success of the same kind (PRODUCT_NOT_READY is not a failure) }
        stale: { type: boolean }
        staleReason:
          type: ["string", "null"]
          enum: [refresh_failed, old, manual_old, null]
          description: >-
            refresh_failed when the feed behind the snapshot account failed and has not recovered, or
            needs a reconnect (immediate, for either source). old when a Plaid balance's feed has been
            quiet for 48 hours, with no balance re-read and no successful sync. manual_old for a typed-in
            balance older than 7 days. Null when not stale.

    BankBalanceExplain:
      type: object
      description: >-
        Why the bank balance reads what it reads: the anchor, the account behind it, whether the next
        Sync re-reads it, what the ledger adds on top, and whether the balance is stale.
      required: [asOf, displayed, freshness, snapshot, account, nextSync, items, accounts, ledger]
      properties:
        asOf: { type: string }
        displayed:
          type: object
          required: [bankToday]
          properties:
            bankToday: { type: string, description: computeCashSignal().bankToday — what every screen shows }
        freshness: { $ref: "#/components/schemas/BankFreshness" }
        snapshot:
          type: object
          required: [balance, at, source, storedAccountId, name, mask]
          properties:
            balance: { type: ["string", "null"] }
            at: { type: ["string", "null"] }
            source: { type: ["string", "null"] }
            storedAccountId: { type: ["string", "null"] }
            name: { type: ["string", "null"] }
            mask: { type: ["string", "null"] }
        account:
          type: object
          required: [resolvedExternalId, resolvedRowId, via, name, mask, belongsToItem]
          properties:
            resolvedExternalId: { type: ["string", "null"] }
            resolvedRowId: { type: ["string", "null"] }
            via: { type: string, enum: [pointer, "snapshot mask", "sole checking", "sole depository", unresolved] }
            name: { type: ["string", "null"] }
            mask: { type: ["string", "null"] }
            belongsToItem: { type: ["string", "null"] }
        nextSync:
          type: object
          required: [willRefreshBalance, whyNot]
          properties:
            willRefreshBalance: { type: boolean }
            whyNot: { type: ["string", "null"] }
        items:
          type: array
          items:
            type: object
            required: [itemRowId, institutionName, lastSyncedAt, lastSyncError, lastSyncErrorCode, ownsSnapshotAccount]
            properties:
              itemRowId: { type: string }
              institutionName: { type: ["string", "null"] }
              lastSyncedAt: { type: ["string", "null"] }
              lastSyncError: { type: ["string", "null"] }
              lastSyncErrorCode: { type: ["string", "null"] }
              ownsSnapshotAccount: { type: boolean }
        accounts:
          type: array
          items:
            type: object
            required: [externalId, name, mask, type, subtype, isSnapshotAccount]
            properties:
              externalId: { type: string }
              name: { type: ["string", "null"] }
              mask: { type: ["string", "null"] }
              type: { type: ["string", "null"] }
              subtype: { type: ["string", "null"] }
              isSnapshotAccount: { type: boolean }
        ledger:
          type: object
          required: [anchorDay, sinceAnchor, recentRows]
          properties:
            anchorDay: { type: ["string", "null"] }
            sinceAnchor:
              description: >-
                What the bank balance adds on top of the snapshot, by the ledger's own rule
                (PR4e): rows the snapshot already held, rows off the account and the pending
                half of a replaced pair add nothing; manual rows on the account count.
                When the snapshot has a balance and both are read at the same moment,
                snapshot.balance + net equals displayed.bankToday to the cent; a row landing
                between the two reads, or a household midnight between them, can break that.
                rowCount is the rows that count, dated through today, including a posted row
                that adds 0.00. Null when the snapshot has no read time.
              oneOf:
                - type: object
                  required: [rowCount, net]
                  properties:
                    rowCount: { type: integer }
                    net: { type: string }
                - type: "null"
            recentRows:
              type: array
              items:
                type: object
                required: [date, description, amount, pending]
                properties:
                  date: { type: string }
                  description: { type: string }
                  amount: { type: string }
                  pending: { type: boolean }

    Spine:
      type: object
      required:
        [asOf, bank, spentMonth, spentWeek, nextBill, billsDueCount, forecast, debt, reviewCount, position]
      properties:
        asOf: { type: string, description: ISO timestamp the snapshot was read }
        bank:
          type: object
          required: [balance, asOfDate, source, lastContactAt, lastFailureAt, stale, staleReason]
          properties:
            balance: { type: string, description: computeCashSignal().bankToday — snapshot rolled forward through the ledger }
            asOfDate: { type: ["string", "null"], description: computeCashSignal().snapshotAt — when the bank snapshot was taken }
            source: { type: ["string", "null"], enum: [plaid, manual, null], description: computeBankFreshness().source — see BankFreshness }
            lastContactAt: { type: ["string", "null"], description: computeBankFreshness().lastContactAt }
            lastFailureAt: { type: ["string", "null"], description: computeBankFreshness().lastFailureAt }
            stale: { type: boolean, description: computeBankFreshness().stale }
            staleReason: { type: ["string", "null"], enum: [refresh_failed, old, manual_old, null], description: computeBankFreshness().staleReason }
        spentMonth: { type: number, description: buildSpendingFacts(monthStart..today).householdSpend.total }
        spentWeek: { type: number, description: buildSpendingFacts(weekStart..weekEnd).householdSpend.total }
        nextBill:
          oneOf:
            - $ref: "#/components/schemas/SpineNextBill"
            - type: "null"
          description: Earliest upcoming bill or debt minimum on/after today; null when nothing is scheduled
        billsDueCount: { type: integer, description: Upcoming bills + debt minimums still landing inside the current month }
        forecast:
          type: object
          required: [lowPoint, lowPointDate, runwayDays, cashBuffer, status]
          properties:
            lowPoint: { type: string, description: computeCashSignal().lowestProjected over the 90-day horizon }
            lowPointDate: { type: ["string", "null"] }
            runwayDays: { type: ["integer", "null"], description: Days until the projection first goes negative; null when it never does }
            cashBuffer: { type: string, description: computeCashSignal().cashBuffer — the household's own floor rather than a computed figure }
            status:
              type: string
              enum: [ready, tight, not_yet, no_data]
              description: >-
                computeCashSignal().status. Carried here so a surface that shows
                the cash-buffer verdict beside the low point reads BOTH from the
                same instant — quoting the word from one request and the number
                from another is how a tile comes to say "Ready" over a low point
                that is under the floor.
        debt:
          type: object
          required: [payoffPct, nextMilestone, paidDownMtd]
          properties:
            payoffPct:
              type: ["number", "null"]
              description: >-
                Percent of anchored debt paid off, 0–100. ⚠️ PERCENT ONLY — no
                balance or amount owed may ever be added to this object; the
                landing page renders it and the standing rule is that the front
                door never shows what is owed. null = no debt carries an anchor.
            nextMilestone:
              oneOf:
                - $ref: "#/components/schemas/SpineNextMilestone"
                - type: "null"
              description: >-
                (PR-D) computeDebtHeadline() — the next milestone the plan
                passes; equals GET /debt-plan .milestones.next. null when none.
            paidDownMtd:
              type: number
              description: >-
                (PR-D) computeDebtHeadline() — genuine confirmed debt payments
                this household month (transfer pairs excluded). An amount PAID,
                never a balance; equals GET /debt-plan .paidDownGenuineMtd.
        reviewCount: { type: integer, description: computeReviewCount() — unmatched forecast-flagged bank txns this month }
        position: { $ref: "#/components/schemas/SpinePosition" }

    SpinePosition:
      type: object
      description: >-
        (PR-B1) The headline of the money position — the same buildMoneyPosition
        call GET /money/position makes, field for field. Never credit, a limit,
        a debt balance or an amount owed.
      required: [safeToSpendNow, remainingWeek, availableUntilPayday, paydayDate, horizonKind, withinPlan, confidence, degraded]
      properties:
        safeToSpendNow: { type: ["string", "null"], description: MoneyPosition.safeToSpendNow }
        remainingWeek: { type: ["string", "null"], description: MoneyPosition.remainingWeek }
        availableUntilPayday: { type: ["string", "null"], description: MoneyPosition.availableUntilPayday }
        paydayDate: { type: ["string", "null"], description: MoneyPosition.paydayDate }
        horizonKind: { type: string, enum: [payday, week_end], description: MoneyPosition.horizon.kind }
        withinPlan: { type: ["string", "null"], enum: [over, tight, "yes", null], description: MoneyPosition.withinPlan }
        confidence: { type: string, enum: [firm, estimated] }
        degraded: { type: boolean, description: The bank data is stale; every figure is from the last good snapshot }

    MoneyPositionEstimate:
      type: object
      required: [itemId, label, amount, date]
      properties:
        itemId: { type: string }
        label: { type: string }
        amount: { type: string, description: Signed like the plan (negative is money out) }
        date: { type: string }

    EvaluateAffordBody:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: { type: number, exclusiveMinimum: 0, maximum: 100000, description: "Dollars." }
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", description: "Today when omitted; a past date is counted today." }
        categoryId: { type: string }
        member: { type: string, maxLength: 200, description: "The member making the purchase (the shared weekly cap is used)." }

    AffordFigures:
      type: object
      additionalProperties: false
      required: [safeToSpendNow, remainingWeek, availableUntilPayday, lowest, lowestDate, debtFreeEarliest, debtFreeLatest, totalInterestLow]
      properties:
        safeToSpendNow: { type: ["string", "null"] }
        remainingWeek: { type: ["string", "null"] }
        availableUntilPayday: { type: ["string", "null"] }
        lowest: { type: string, description: "The curve's lowest end-of-day balance over its window." }
        lowestDate: { type: ["string", "null"] }
        debtFreeEarliest: { type: ["string", "null"], description: "YYYY-MM." }
        debtFreeLatest: { type: ["string", "null"], description: "YYYY-MM; null when open-ended." }
        totalInterestLow: { type: ["string", "null"] }

    AffordDelta:
      type: object
      additionalProperties: false
      required: [safeToSpendNow, remainingWeek, availableUntilPayday, lowest, lowestDate, debtFreeEarliest, debtFreeLatest, totalInterestLow]
      properties:
        safeToSpendNow: { type: ["string", "null"] }
        remainingWeek: { type: ["string", "null"] }
        availableUntilPayday: { type: ["string", "null"] }
        lowest: { type: string }
        lowestDate: { type: ["string", "null"], description: "The proposed lowest day when the purchase moved it." }
        debtFreeEarliest: { type: ["integer", "null"], description: "Months later." }
        debtFreeLatest: { type: ["integer", "null"], description: "Months later." }
        totalInterestLow: { type: ["string", "null"] }

    AffordCategoryEffect:
      type: object
      additionalProperties: false
      required: [categoryId, remainingBefore, remainingAfter]
      properties:
        categoryId: { type: string }
        remainingBefore: { type: ["string", "null"] }
        remainingAfter: { type: ["string", "null"] }

    AffordDebtEffect:
      type: object
      additionalProperties: false
      required: [affected, cut, cutMonth, debtFreeMonthShift, interestDelta]
      properties:
        affected: { type: boolean }
        cut: { type: string }
        cutMonth: { type: ["string", "null"] }
        debtFreeMonthShift: { type: ["integer", "null"] }
        interestDelta: { type: ["string", "null"] }

    AffordResult:
      type: object
      additionalProperties: false
      required: [amount, dateISO, baseline, proposed, delta, category, debt, verdict, assumptions]
      properties:
        amount: { type: string }
        dateISO: { type: string }
        baseline: { $ref: "#/components/schemas/AffordFigures" }
        proposed: { $ref: "#/components/schemas/AffordFigures" }
        delta: { $ref: "#/components/schemas/AffordDelta" }
        category:
          oneOf:
            - { $ref: "#/components/schemas/AffordCategoryEffect" }
            - { type: "null" }
        debt: { $ref: "#/components/schemas/AffordDebtEffect" }
        verdict: { type: string, enum: [fits, tight, breaks_buffer, breaks_zero] }
        assumptions: { type: array, items: { type: string } }

    WishlistEvaluation:
      type: object
      additionalProperties: false
      required: [evaluatedAt, verdict, safeToSpendNowAfter, availableUntilPaydayAfter]
      properties:
        evaluatedAt: { type: string, format: date-time }
        verdict: { type: string, enum: [fits, tight, breaks_buffer, breaks_zero] }
        safeToSpendNowAfter: { type: ["string", "null"] }
        availableUntilPaydayAfter: { type: ["string", "null"] }

    WishlistEvaluationResult:
      type: object
      additionalProperties: false
      required: [itemId, lastEvaluation]
      properties:
        itemId: { type: string }
        lastEvaluation: { $ref: "#/components/schemas/WishlistEvaluation" }

    MoneyPosition:
      type: object
      description: >-
        (PR-B1) computePosition's answer. Money is a two-decimal string. Payday is
        the first income plan on the forecast curve after today, within 45 days,
        of at least 25% of the largest active income plan; the window runs from
        today through payday, and on payday the bills count before the paycheck
        (that day reads its balance less every income plan dated payday).
        Without a payday the window runs through this week's Saturday.
        availableUntilPayday = max(0, lowest end-of-day balance in the window −
        cash buffer − reserves held), null —
        never a false zero — with no bank data or no curve. remainingWeek =
        weekCap − spentWeekDiscretionary (weekly-allowance spend plus spend not
        yet filed). safeToSpendNow = max(0, min(remainingWeek,
        availableUntilPayday)).
      required:
        [todayISO, status, paydayDate, payday, horizon, lowestUntilPayday, lowestUntilPaydayDate, committedUntilPayday,
         cashBuffer, reservesHeld, availableUntilPayday, weekStart, weekEnd, weekCap, spentWeekDiscretionary,
         needsClassificationWeek, unplannedWeek, monthlyWeek, remainingWeek, paceAllowedToday, withinPlan,
         safeToSpendNow, confidence, estimates, assumptions, degraded, degradedReason]
      properties:
        todayISO: { type: string }
        status: { type: string, enum: [ready, tight, not_yet, no_data], description: computeCashSignal().status }
        paydayDate: { type: ["string", "null"] }
        payday:
          oneOf:
            - type: object
              required: [itemId, label, amount]
              properties:
                itemId: { type: string }
                label: { type: string }
                amount: { type: string }
            - type: "null"
        horizon:
          type: object
          required: [kind, endDate, lastDay]
          properties:
            kind: { type: string, enum: [payday, week_end] }
            endDate: { type: string, description: "The payday, or this week's Saturday" }
            lastDay: { type: string, description: "The last day the cash figures count (payday itself, before its paycheck; or the Saturday)" }
        lowestUntilPayday: { type: ["string", "null"] }
        lowestUntilPaydayDate: { type: ["string", "null"] }
        committedUntilPayday: { type: string, description: "Sum of the planned outflows landing in the window, payday's own bills included" }
        cashBuffer: { type: string }
        reservesHeld: { type: string, description: "Money the active goals hold back in checking (reserved in checking, not backed by an account)" }
        availableUntilPayday: { type: ["string", "null"] }
        weekStart: { type: string }
        weekEnd: { type: string }
        weekCap: { type: ["string", "null"], description: "This week's cap from allowance_plans (or the week's override); null when none is set, and a $0 week is none" }
        spentWeekDiscretionary: { type: string }
        needsClassificationWeek: { type: string, description: The part of spentWeekDiscretionary not yet filed — it counts against the cap until it is }
        unplannedWeek: { type: string }
        monthlyWeek: { type: string }
        remainingWeek: { type: ["string", "null"] }
        paceAllowedToday: { type: ["string", "null"], description: weekCap × days elapsed (today included) ÷ 7 }
        withinPlan: { type: ["string", "null"], enum: [over, tight, "yes", null] }
        safeToSpendNow: { type: ["string", "null"] }
        confidence: { type: string, enum: [firm, estimated] }
        estimates:
          type: array
          items: { $ref: "#/components/schemas/MoneyPositionEstimate" }
        assumptions:
          type: array
          items: { type: string }
        degraded: { type: boolean }
        degradedReason: { type: ["string", "null"], enum: [refresh_failed, old, manual_old, null] }

    AllowancePlan:
      type: object
      required: [id, memberUserId, period, amount, effectiveFrom, source, derivation, createdAt]
      properties:
        id: { type: string }
        memberUserId: { type: ["string", "null"], description: Null for the household's shared pool }
        period: { type: string, enum: [weekly, monthly] }
        amount: { type: string }
        effectiveFrom: { type: string }
        source: { type: string, enum: [owner, derived] }
        derivation: { description: The suggestion's working when the owner accepted it; null for a typed amount }
        createdAt: { type: string }

    AllowancePlanUpdate:
      type: object
      required: [amount]
      additionalProperties: false
      properties:
        amount: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$', description: "Dollars, at most two decimals" }
        effectiveFrom: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }

    WeeklyLimitDerivation:
      type: object
      required: [takeHomeMonthly, committedMonthly, debtMinimumsMonthly, extraMonthly, goalsMonthly, discretionaryMonthly]
      properties:
        takeHomeMonthly: { type: string }
        committedMonthly: { type: string, description: "Active bills and subscriptions, less the Weekly/Monthly Spend funding items and debt-linked bills" }
        debtMinimumsMonthly: { type: string }
        extraMonthly: { type: string, description: The Avalanche extra payment }
        goalsMonthly: { type: string }
        discretionaryMonthly: { type: string }

    AllowancePlans:
      type: object
      required: [plans, suggested]
      properties:
        plans:
          type: array
          items: { $ref: "#/components/schemas/AllowancePlan" }
        suggested:
          type: object
          required: [weekly, derivation]
          description: A suggestion only — nothing writes it; the owner sets the cap.
          properties:
            weekly: { type: string, description: "Discretionary per week, rounded down to whole $5" }
            derivation: { $ref: "#/components/schemas/WeeklyLimitDerivation" }

    VersionInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: |
            Per-deploy build identifier (APP_BUILD_ID env, falling back
            to the git short hash, then a shared "dev" sentinel when
            neither is available). Compared against the identifier baked
            into the loaded web bundle to detect a new deploy.

    Transaction:
      type: object
      required: [id, occurredOn, description, amount, forecastFlag, weeklyAllowance, monthlyAllowance, unplannedAllowance, reimbursable, reimbursed, reviewed, isTransfer, isTransferUserOverridden, isExternalCardPayment, pending, source]
      properties:
        id: { type: string }
        occurredOn: { type: string }
        occurredAt: { type: ["string", "null"] }
        description: { type: string }
        amount: { type: string }
        account: { type: ["string", "null"] }
        categoryId: { type: ["string", "null"] }
        forecastFlag: { type: boolean }
        weeklyAllowance: { type: boolean }
        weeklyBucket: { type: ["string", "null"], enum: [groceries, dining, alcohol, entertainment, misc, null] }
        monthlyAllowance: { type: boolean }
        unplannedAllowance: { type: boolean }
        reimbursable: { type: boolean }
        reimbursed: { type: boolean }
        reviewed:
          type: boolean
          description: |
            Whether the user has marked this transaction as done on the
            Amex page. Reviewed rows render greyed out so the eye skips
            over them and focuses on what's left to handle. Defaults to
            false; toggled explicitly by the user (never auto-set on
            categorize).
        isTransfer: { type: boolean }
        isTransferUserOverridden:
          type: boolean
          description: |
            True when the user has explicitly toggled `isTransfer` on this
            row (cleared the auto-flag from the row's "Transfer" pill, picked
            a real category on a transfer row, or flipped the toggle in the
            Edit dialog). The Plaid sync / XLSX import re-categorize
            paths honor this and skip the description/PFC
            transfer heuristic so future syncs of the same row don't
            silently re-flag it as a transfer. Server-managed: writes to
            this field are not accepted via the input schema — toggling
            `isTransfer` in PATCH /transactions/:id sets it automatically.
        categoryLockedByUser:
          type: boolean
          readOnly: true
          description: |
            (PR-0) True when a person chose this row's category by hand:
            PATCH /transactions/:id or bulk-update with a categoryId,
            recategorize-by-pattern, or a create whose body named the
            category (never a mapping rule's auto-fill). Clearing the
            category (categoryId null, uncategorize-by-ids) clears it. The
            automatic categorizer never moves a locked row and Plaid sync
            never writes it. Server-managed and read-only: the input schemas
            do not accept it.
        isExternalCardPayment:
          type: boolean
          description: |
            (#632 follow-up) User-set per-row flag marking a card payment
            as going to a card that is NOT in our debt avalanche (e.g. a
            spouse's external card). Excluded from avalanche actuals so
            it never inflates "extra" debt-payoff capacity. Defaults to
            false; toggled explicitly via the "Not in avalanche" chip on
            the Amex page.
        sentToReviewAt:
          type: ["string", "null"]
          description: |
            (#762 — Phase B) ISO8601 timestamp the user clicked "Send
            to Review" on this row, or null when the row has never been
            promoted into the Review workflow. The Chase / Amex
            source-of-truth views ignore this column entirely; only the
            Review pipeline on /forecast filters on it. Drives the "✓
            in review" badge and per-row affordance on the Chase page.
        notes: { type: ["string", "null"] }
        source: { type: string }
        member: { type: ["string", "null"] }
        owedBy: { type: ["string", "null"] }
        plaidTransactionId: { type: ["string", "null"] }
        plaidAccountId: { type: ["string", "null"] }
        debtId: { type: ["string", "null"] }
        pfcDetailed:
          type: ["string", "null"]
          description: >-
            Plaid personal_finance_category.detailed, persisted on sync (#636);
            null for manual and imported rows. Read by the one spending rule
            (classifyOutflow, rule 8), which the web shares.
        pending:
          type: boolean
          description: |
            (#728) True when Plaid reported this transaction as pending
            on the most recent /transactions/sync. Replaces the legacy
            `notes='[pending]'` string marker the sync used to write.
            Drives the Transactions page "Pending" section (pending
            rows pinned above the dated day-groups) and the "Pending"
            badge on each row. Flips back to false on the
            pending→posted lifecycle when Plaid surfaces the posted
            twin as a `modified` row.
        matchedRuleId:
          type: ["string", "null"]
          description: |
            Id of the mapping rule that auto-categorize would currently
            attribute for this row, or null when no rule matches (e.g. the
            category was set manually). Computed server-side per list
            response — not persisted on the row — so editing a rule's
            pattern reflects on every existing transaction without a
            backfill. Powers the "matched by rule X · jump to it" affordance
            on the Transactions and Amex pages.
        displayName:
          type: string
          description: |
            (#868) Clean, human-readable merchant label derived from the
            raw bank `description` on read. (#888) Precedence: a household
            merchant alias keyed on `merchantSignature` wins; otherwise the
            deterministic `cleanMerchant()` label (ACH noise, ORIG CO / WEB
            ID fields, and processor prefixes stripped). Used as the row
            headline so the raw description can be demoted to a muted
            sub-line. Computed server-side per list response — never
            persisted; the stored `description` is untouched.
        merchantSignature:
          type: string
          description: |
            (#888) Stable, normalized merchant key derived from the raw
            `description`. Rows that differ only by volatile trailing IDs /
            trace numbers / dates share a signature, so one rename applies to
            all of them. Used by the rename popover to set/clear an alias and
            to count how many rows a rename will affect. Empty string when no
            stable signature can be derived. Computed server-side per list
            response — never persisted.
        paymentState:
          type: ["string", "null"]
          enum: [claimed, confirmed, null]
          description: |
            (PR-D) A payment logged in the app (POST /debts/{id}/payments) is
            a claim: "claimed" when written, "confirmed" once a bank row pairs
            with it. Null on every other row.
        confirmedByTxnId:
          type: ["string", "null"]
          description: (PR-D) The bank row that confirmed this claim.
    LedgerRow:
      allOf:
        - $ref: "#/components/schemas/Transaction"
        - type: object
          required: [runningBalance, balanceAmount, countsInBalance, balanceReason, replacedPendingId, heldAhead, afterToday, stalePending, splitCount, categoryProvisional]
          properties:
            splitCount:
              type: integer
              description: (PR-A2) How many parts the charge is split into; 0 when it is not split.
            categoryProvisional:
              type: boolean
              description: |
                (PR-A2) The category was set by the automatic categorizer with
                middling confidence and awaits a person's yes. A hand pick clears it.
            runningBalance:
              type: ["string", "null"]
              description: |
                (PR13) The account balance straight after this row, on the
                register of all the account's rows. Null without a bank
                snapshot, and for a row dated after today.
            balanceAmount:
              type: ["string", "null"]
              description: |
                What this row moves the register by: its amount, or 0.00 when it
                does not count. `totals` sum these. (PR14) Null on an account
                other than the snapshot's, which has no register; there
                `countsInBalance` still says whether the row counts in the totals.
            countsInBalance:
              type: boolean
              description: Whether this row moves the balance at all.
            balanceReason:
              type: string
              description: |
                counted (moves the balance by its amount); superseded (a pending
                row its posted row replaced); duplicate (a second row with the
                same Plaid transaction id); not_bank (a mask-twin row, which the
                bank balance does not read); claim_confirmed (PR-D: a payment
                logged in the app that a bank row confirmed — the bank row is
                the payment).
            replacedPendingId:
              type: ["string", "null"]
              description: For a posted row that replaced a pending row, that pending row's id.
            heldAhead:
              type: boolean
              description: |
                Dated after the snapshot day but already inside the snapshot
                balance. The days between the snapshot and this row's date read
                higher than the bank showed, by this row.
            afterToday:
              type: boolean
              description: Dated after the household's today. Such a row has no running balance.
            stalePending:
              type: boolean
              description: |
                Still pending and dated more than 14 days before the household's
                today. A label only: the row moves the balance as balanceReason
                says. A leftover pending row its posted row could not replace
                counts beside that posted row.
    LedgerAnchor:
      type: object
      required: [today, todayBalance, snapshotBalance, snapshotAt, snapshotDay]
      properties:
        today:
          type: string
          description: The household's today (America/Chicago), YYYY-MM-DD.
        todayBalance:
          type: ["string", "null"]
          description: |
            The balance at the end of `today`: the spine's `bank.balance`, from
            the same computation. Null without a bank snapshot.
        snapshotBalance: { type: ["string", "null"] }
        snapshotAt: { type: ["string", "null"] }
        snapshotDay: { type: ["string", "null"] }
    LedgerAccountScope:
      type: object
      required: [via, plaidAccountIds]
      properties:
        via:
          type: string
          description: |
            How the snapshot's account was found: pointer, snapshot mask, sole
            checking, sole depository, or unresolved.
        plaidAccountIds:
          type: array
          items: { type: string }
          description: |
            The Plaid account ids on the ledger (the resolved account and its
            mask twins). Manual rows are on the ledger as well.
    LedgerTotals:
      type: object
      description: |
        Over every row matching the filters other than `reviewed`, rows dated
        after today included, summing each row's `balanceAmount`: a row that
        does not count adds nothing.
      required: [count, moneyIn, moneyOut, net]
      properties:
        count:
          type: integer
          description: Matching rows, including rows that do not count.
        moneyIn: { type: string }
        moneyOut: { type: string }
        net: { type: string }
    LedgerReviewCounts:
      type: object
      required: [reviewed, unreviewed]
      properties:
        reviewed: { type: integer }
        unreviewed: { type: integer }
    LedgerPage:
      type: object
      required: [rows, nextCursor, limit, matchingCount, totals, review, balanceStart, balanceEnd, balanceToday, balanceUnavailableReason, anchor, account]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/LedgerRow" }
        nextCursor: { type: ["string", "null"] }
        limit: { type: integer }
        matchingCount:
          type: integer
          description: Rows matching every filter, `reviewed` included.
        totals:
          $ref: "#/components/schemas/LedgerTotals"
        review:
          $ref: "#/components/schemas/LedgerReviewCounts"
        balanceStart:
          type: ["string", "null"]
          description: |
            The balance at the end of the day before `from`, or before the
            account's first row when `from` is absent. Null without a bank
            snapshot, or when that day is after today.
        balanceEnd:
          type: ["string", "null"]
          description: |
            The balance at the end of `to`, which defaults to today. Null without
            a bank snapshot, or when `to` is after today.
        balanceToday:
          type: ["string", "null"]
          description: |
            The balance at the end of today: the spine's `bank.balance`. Null
            without a bank snapshot.
        balanceUnavailableReason:
          type: ["string", "null"]
          description: |
            (PR14) Why every balance in this response is null, or null when they
            are given: "no_snapshot" (no bank snapshot time) or
            "not_snapshot_account" (an account other than the snapshot's; no
            balance is computed for it).
        anchor:
          $ref: "#/components/schemas/LedgerAnchor"
        account:
          $ref: "#/components/schemas/LedgerAccountScope"
    TransactionBalances:
      type: object
      required: [balances, balanceUnavailableReason, anchor, account]
      properties:
        balances:
          type: array
          items:
            type: object
            required: [date, balance]
            properties:
              date: { type: string }
              balance: { type: ["string", "null"] }
        balanceUnavailableReason:
          type: ["string", "null"]
          description: As on LedgerPage.
        anchor:
          $ref: "#/components/schemas/LedgerAnchor"
        account:
          $ref: "#/components/schemas/LedgerAccountScope"
    LedgerFilter:
      type: object
      properties:
        account: { type: string, maxLength: 64 }
        from: { type: string, maxLength: 10 }
        to: { type: string, maxLength: 10 }
        search: { type: string, maxLength: 200 }
        reviewed: { type: boolean }
        pending: { type: boolean }
        uncategorized: { type: boolean }
        categoryId: { type: string, maxLength: 64 }
        source: { type: string, maxLength: 100 }
        member: { type: string, maxLength: 100 }
    BulkReviewMatchingInput:
      type: object
      required: [filter, reviewed, expectedCount]
      properties:
        filter:
          $ref: "#/components/schemas/LedgerFilter"
        reviewed: { type: boolean }
        expectedCount:
          type: integer
          minimum: 0
          description: The `matchingCount` the client showed for this filter.
    BulkReviewMatchingResult:
      type: object
      required: [matched, updated, updatedIds]
      properties:
        matched: { type: integer }
        updated: { type: integer }
        updatedIds:
          type: array
          items: { type: string }
    CreateTransactionInput:
      type: object
      required: [occurredOn, description, amount]
      properties:
        occurredOn: { type: string }
        occurredAt: { type: ["string", "null"] }
        description: { type: string, minLength: 1 }
        amount: { type: string }
        account: { type: ["string", "null"] }
        categoryId: { type: ["string", "null"] }
        forecastFlag: { type: boolean }
        weeklyAllowance: { type: boolean }
        weeklyBucket: { type: ["string", "null"], enum: [groceries, dining, alcohol, entertainment, misc, null] }
        monthlyAllowance: { type: boolean }
        unplannedAllowance: { type: boolean }
        reimbursable: { type: boolean }
        reimbursed: { type: boolean }
        reviewed: { type: boolean }
        isTransfer: { type: boolean }
        isExternalCardPayment: { type: boolean }
        notes: { type: ["string", "null"] }
        source: { type: string }
        member: { type: ["string", "null"] }
        owedBy: { type: ["string", "null"] }
        debtId: { type: ["string", "null"] }
    TransactionInput:
      type: object
      properties:
        occurredOn: { type: string }
        occurredAt: { type: ["string", "null"] }
        description: { type: string, minLength: 1 }
        amount: { type: string }
        account: { type: ["string", "null"] }
        categoryId: { type: ["string", "null"] }
        forecastFlag: { type: boolean }
        weeklyAllowance: { type: boolean }
        weeklyBucket: { type: ["string", "null"], enum: [groceries, dining, alcohol, entertainment, misc, null] }
        monthlyAllowance: { type: boolean }
        unplannedAllowance: { type: boolean }
        reimbursable: { type: boolean }
        reimbursed: { type: boolean }
        reviewed: { type: boolean }
        isTransfer: { type: boolean }
        isExternalCardPayment: { type: boolean }
        notes: { type: ["string", "null"] }
        source: { type: string }
        member: { type: ["string", "null"] }
        owedBy: { type: ["string", "null"] }
        debtId: { type: ["string", "null"] }
        rememberPattern:
          type: ["string", "null"]
          description: |
            When set together with `categoryId`, the server upserts a
            mapping_rule (matchType=contains, priority=100) so that future
            transactions with this description fragment auto-categorize the
            same way. Used by the "Categorize + remember" affordance on the
            Transactions and Amex pages.

    RepointedRule:
      type: object
      required: [ruleId, pattern, matchType, fromCategoryId, toCategoryId, candidateCount, sampleTransactions]
      description: |
        Reported by PATCH /transactions/:id when the auto-learn flow
        repoints an existing mapping rule onto a new category. `candidateCount`
        is the number of older transactions that match this rule's pattern
        and currently sit in the rule's old category, i.e. the count that
        would be flipped if the user accepts the "apply to past transactions
        too" prompt and POSTs to /transactions/recategorize-by-pattern with
        these fields. `sampleTransactions` is a small preview (most-recent
        first, capped at 10) so the client can render a "Show matches" list
        before the user confirms the bulk re-categorize.
      properties:
        ruleId: { type: string }
        pattern: { type: string }
        matchType: { type: string, enum: [contains, exact, starts_with] }
        fromCategoryId: { type: string }
        toCategoryId: { type: string }
        candidateCount: { type: integer }
        sampleTransactions:
          type: array
          description: |
            First ~10 affected transactions, ordered most-recent first.
            Each entry is a thin slice (id, description, occurredOn, amount)
            sufficient for the toast's "Show matches" preview dialog.
          items: { $ref: "#/components/schemas/RepointedRuleSample" }

    RepointedRuleSample:
      type: object
      required: [id, description, occurredOn, amount]
      properties:
        id: { type: string }
        description: { type: string }
        occurredOn: { type: string }
        amount: { type: string }
        matchedRuleId:
          type: ["string", "null"]
          description: |
            Id of the mapping rule that auto-categorize would currently
            attribute for this sample row in its *present* category, or
            null when no rule matches. Computed server-side identically
            to the GET /transactions annotation so the "Show matches"
            preview dialog can render the same MatchedRuleChip
            (deep-link to /mapping-rules?focus=<id> or "manually
            categorized" hint) as every other transaction-list surface.

    RuleAction:
      type: object
      required: [kind]
      description: |
        Summary of what the auto-learn flow did to the user's mapping
        rules in response to this PATCH. Surfaced as a small toast/note
        so the user understands why future similar charges will (or
        won't) auto-categorize. The repoint case is also reported in
        more detail via `repointedRules` (which drives the "apply to
        past transactions too" prompt). For the `created` /
        `created_priority_bump` cases, the action also carries the
        match metadata + candidate count needed to drive the same
        "apply to past charges?" prompt against older *uncategorized*
        rows that match the freshly created rule.
      properties:
        kind:
          type: string
          enum:
            - created
            - created_priority_bump
            - skipped_generic
            - repointed
            - none
          description: |
            * `created` — a new specific mapping rule was added for the
              derived pattern.
            * `created_priority_bump` — a new specific rule was added
              and given a priority above an existing generic rule that
              also matches; both rules are kept and the specific one
              wins on future similar charges.
            * `skipped_generic` — the auto-derived pattern would have
              clobbered an existing generic rule, so no rule was
              created. The generic rule is unchanged.
            * `repointed` — at least one existing matching specific
              rule was repointed onto the new category; no new rule was
              created (the repoint covers it).
            * `none` — nothing interesting happened (e.g. transfer,
              same-category no-op, or no derivable pattern).
        pattern:
          type: ["string", "null"]
          description: |
            Pattern for the new or repointed rule. Set for `created`,
            `created_priority_bump`, `skipped_generic`, and `repointed`.
        genericPattern:
          type: ["string", "null"]
          description: |
            For `created_priority_bump` and `skipped_generic` — the
            existing generic (1-token) pattern that already matches
            this description and was deliberately left alone.
        ruleId:
          type: ["string", "null"]
          description: |
            Id of the rule the auto-learn flow created or repointed.
            Set for `created`, `created_priority_bump`, and `repointed`
            so the client can offer an Undo affordance from the toast
            (DELETE the just-created rule, or PATCH the repointed rule
            back to its previous category). Null for `skipped_generic`
            and `none`.
        previousCategoryId:
          type: ["string", "null"]
          description: |
            For `repointed` — the rule's previous categoryId before
            this PATCH moved it onto the user's chosen category. Used
            by the client's Undo affordance to restore the rule's
            original aim. Null for the other kinds.
        matchType:
          type: ["string", "null"]
          enum: [contains, exact, starts_with, null]
          description: |
            Match type of the freshly created rule. Set for `created`
            and `created_priority_bump`. The client passes this
            through to /transactions/recategorize-by-pattern when the
            user accepts the "apply to past charges?" prompt.
        toCategoryId:
          type: ["string", "null"]
          description: |
            The category the freshly created rule points at. Set for
            `created` and `created_priority_bump`. Used as the
            `toCategoryId` for the bulk recategorize call when the
            user accepts the "apply to past charges?" prompt.
        candidateCount:
          type: ["integer", "null"]
          description: |
            For `created` and `created_priority_bump` — the count of
            older *uncategorized* transactions that match the freshly
            created rule's pattern (excluding the row that triggered
            the auto-learn). This is what would be flipped onto
            `toCategoryId` if the user accepts the "apply to past
            charges?" prompt and POSTs to
            /transactions/recategorize-by-pattern with
            `fromCategoryId: null`. Manually-categorized older rows
            are deliberately excluded so explicit user intent is
            preserved.

    UpdateTransactionResponse:
      allOf:
        - $ref: "#/components/schemas/Transaction"
        - type: object
          required: [repointedRules, ruleAction]
          properties:
            repointedRules:
              type: array
              items: { $ref: "#/components/schemas/RepointedRule" }
              description: |
                Empty unless this PATCH triggered the auto-learn flow to
                repoint one or more existing mapping rules onto a new
                category. The client surfaces this as a "apply to past
                transactions too" prompt.
            ruleAction:
              $ref: "#/components/schemas/RuleAction"
            retroactiveCandidates:
              description: |
                (PR-A) When this PATCH set a category: unlocked rows of the same
                merchant it would also fit. Reported, never applied.
              oneOf:
                - { $ref: "#/components/schemas/RetroactiveCandidates" }
                - { type: "null" }
            decisionId:
              type: string
              description: |
                (PR-A2) The `user` decision written for this hand filing, for
                POST /category-decisions/{id}/undo. Absent when the body named
                no `categoryId`.
            learnedRuleId:
              type: string
              description: |
                (PR-A2) The learned rule (merchant memory) this choice created,
                re-pointed or confirmed, for POST /learned-rules/{id}/apply-retroactively.
                Absent when no category was set, or the category teaches nothing
                (Uncategorized, Transfer, Ignore, or a clear).

    CreateTransactionResponse:
      allOf:
        - $ref: "#/components/schemas/Transaction"
        - type: object
          required: [autoCategorizedRuleId]
          properties:
            autoCategorizedRuleId:
              type: ["string", "null"]
              description: |
                Id of the mapping rule that auto-attributed this row's
                `categoryId` during POST /transactions. Set only when the
                client OMITTED `categoryId` from the body AND the
                auto-categorize pipeline matched a rule. Null when the
                client passed an explicit categoryId, when no rule
                matched, or when the description was empty. The Add-
                Transaction client uses this to surface a small
                "matched by rule X" confirmation toast that links to the
                Mapping Rules page and offers an Undo affordance to
                clear the auto-picked category from the new row (without
                deleting the row itself).

    RecategorizeByPatternInput:
      type: object
      required: [pattern, matchType, fromCategoryId, toCategoryId]
      properties:
        pattern: { type: string, minLength: 1 }
        matchType: { type: string, enum: [contains, exact, starts_with] }
        fromCategoryId:
          type: ["string", "null"]
          description: |
            Only transactions currently in this category are touched.
            Transactions manually re-categorized to a different category
            are skipped to preserve explicit user intent. Pass `null`
            to target rows that are currently *uncategorized* — used
            by the "apply to past charges?" prompt that fires after
            the auto-learn flow creates a brand-new specific rule
            (the candidates are older uncategorized rows that match
            the new pattern; manually categorized rows are
            preserved).
        toCategoryId: { type: string }
        ids:
          type: array
          maxItems: 1000
          description: |
            Optional whitelist of transaction ids to scope the bulk
            update to. When provided, the server only flips rows whose
            id is in this list AND whose categoryId still equals
            `fromCategoryId`. Used by the client's "Undo" affordance to
            revert exactly the rows that the original bulk touched,
            skipping any the user has since re-edited. Capped at 1000
            ids per request — a longer list is rejected with a 400 to
            prevent a hand-crafted payload from stalling the API; in
            practice the array is bounded by what currently matches
            the pattern, well below this cap.
          items: { type: string }
        ruleId:
          type: string
          description: |
            Optional id of the mapping rule whose previous re-point
            should be reversed alongside the transaction flip. When
            provided, the server also updates that rule's categoryId
            to `toCategoryId` (after verifying ownership). The "Undo"
            affordance passes the original rule id with `from`/`to`
            swapped so future matching transactions stop snapping
            onto the user's accidental category pick.
        lockedIds:
          type: array
          maxItems: 1000
          description: |
            (PR-0) Undo only. The `lockedIds` the original call returned:
            the rows it moved that a person had already locked. When
            present, each row this call moves is locked only if its id is
            in the list, so an Undo restores every row's
            `categoryLockedByUser` exactly. When absent, every moved row is
            locked (a person re-filed it).
          items: { type: string }

    RecategorizeByPatternResult:
      type: object
      required: [updated, affectedMonths, affectedIds]
      properties:
        updated:
          type: integer
          description: Number of transactions whose categoryId was flipped.
        affectedMonths:
          type: array
          description: |
            Distinct YYYY-MM-01 month-start strings spanning the updated
            transactions. Clients invalidate the corresponding budget month
            queries so per-line actuals refresh.
          items: { type: string }
        affectedIds:
          type: array
          description: |
            Ids of the transactions whose categoryId was flipped. The
            client passes these back into the same endpoint with `from`
            and `to` swapped (and `ids` set) to implement one-click
            "Undo" of a bulk recategorization.
          items: { type: string }
        lockedIds:
          type: array
          description: |
            (PR-0) The subset of `affectedIds` whose category a person had
            locked BEFORE this call moved them. The Undo passes it back as
            the request's `lockedIds` to restore each row's lock.
          items: { type: string }

    UncategorizeByIdsInput:
      type: object
      required: [ids, fromCategoryId]
      properties:
        ids:
          type: array
          maxItems: 1000
          description: |
            Whitelist of transaction ids whose categoryId should be cleared.
            Only rows owned by the requesting user are touched. An
            explicitly-empty list is a no-op so callers can pass through a
            degenerate Undo payload (e.g. a bulk that flipped 0 rows)
            without affecting unrelated data. Capped at 1000 ids per
            request — a longer list is rejected with a 400 to prevent
            a runaway "Undo" from stalling the API; the Add-flow's bulk
            undo passes back exactly the ids it just touched, so the
            practical ceiling is whatever pattern matched, well below
            this cap.
          items: { type: string }
        fromCategoryId:
          type: ["string", "null"]
          description: |
            Guard category — only rows whose categoryId still equals this
            value are flipped to null. Pass the category id the rows were
            moved into by the original bulk so any rows the user has since
            re-edited (away from that category) are preserved. Pass `null`
            to allow flipping rows that are already uncategorized — that's
            still a no-op for those rows but keeps the same surface
            reusable for future "from anywhere" callers.

    UncategorizeByIdsResult:
      type: object
      required: [updated, affectedMonths, affectedIds]
      properties:
        updated:
          type: integer
          description: Number of transactions whose categoryId was cleared.
        affectedMonths:
          type: array
          description: |
            Distinct YYYY-MM-01 month-start strings spanning the cleared
            transactions. Clients invalidate the corresponding budget month
            queries so per-line actuals refresh.
          items: { type: string }
        affectedIds:
          type: array
          description: |
            Ids of the transactions whose categoryId was actually cleared.
            Mirrors RecategorizeByPatternResult.affectedIds so the toast
            can report a precise count to the user.
          items: { type: string }

    BulkUpdateTransactionsInput:
      type: object
      required: [ids, patch]
      properties:
        ids:
          type: array
          maxItems: 1000
          description: |
            Whitelist of transaction ids to apply `patch` to. Only rows
            owned by the requesting user are touched; ids that don't
            resolve are reported back individually in `results` with
            `ok: false`. Capped at 1000 ids per request — a longer list
            is rejected with a 400 to prevent a hand-crafted payload
            from stalling the API; the bulk action bar today is sized
            well below this cap (a single account-page month rarely
            exceeds a few hundred rows).
          items: { type: string }
        patch:
          $ref: "#/components/schemas/TransactionInput"

    BulkUpdateTransactionsResult:
      type: object
      required: [updated, results, affectedMonths]
      properties:
        updated:
          type: integer
          description: Number of rows actually written (sum of ok-true results).
        results:
          type: array
          description: |
            One entry per input id, in the same order. `ok: true` for
            rows that were updated; `ok: false` with a short `error`
            string for rows that don't belong to the user or otherwise
            couldn't be written. Mirrors the per-id success/failure
            shape the previous client-side fan-out used so the existing
            "Updated 12, 1 failed" toast keeps working.
          items: { $ref: "#/components/schemas/BulkUpdateTransactionResult" }
        affectedMonths:
          type: array
          description: |
            Distinct YYYY-MM-01 month-start strings spanning the
            updated rows. Clients invalidate the corresponding budget
            month queries so per-line actuals refresh.
          items: { type: string }
        decisionIds:
          type: array
          description: |
            (PR-A2) The `user` decisions written when the patch set or cleared
            categories, one per updated row. Empty otherwise.
          items: { type: string }

    BulkUpdateTransactionResult:
      type: object
      required: [id, ok]
      properties:
        id: { type: string }
        ok: { type: boolean }
        error:
          type: ["string", "null"]
          description: Short reason when `ok` is false (e.g. "not found").

    SendTransactionsToReviewInput:
      type: object
      required: [transactionIds]
      properties:
        transactionIds:
          type: array
          maxItems: 200
          description: |
            Transaction ids to promote into (or revoke from) the
            Review workflow. Capped at 200 per request; a longer list
            is rejected with a 400 to keep the surface predictable —
            the bulk affordance on the Chase page is sized far below
            this cap. Ids outside the caller's household are silently
            ignored (they fall out of the household-scoped UPDATE
            filter, so the response's `updated` count reflects only
            rows actually touched).
          items: { type: string }

    SendTransactionsToReviewResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          description: |
            Number of transactions whose `sent_to_review_at` actually
            changed. Rows already in the desired state (sent vs. not
            sent) are silently skipped so a re-issue is safe and the
            5-second Undo affordance on the success toast can fire
            without double-counting.

    BulkSetForecastFlagInput:
      type: object
      required: [ids, forecastFlag]
      properties:
        ids:
          type: array
          description: |
            Transaction ids to flip. Only rows owned by the requesting
            user whose current `forecast_flag` differs from the target
            value are touched — rows already at the target value are
            silently skipped so a re-issue (e.g. one-click "Undo") is
            safe even when the user has since toggled some rows back
            by hand.
          items: { type: string }
        forecastFlag:
          type: boolean
          description: |
            Target value for `forecast_flag`. When `false` the server
            also drops any forecast_resolutions pointing at the
            affected rows (mirroring the per-row PATCH cleanup) so the
            Forecast inbox/bucket stays consistent.

    BulkSetForecastFlagResult:
      type: object
      required: [updated, affectedIds]
      properties:
        updated:
          type: integer
          description: Number of transactions whose forecast_flag was flipped.
        affectedIds:
          type: array
          description: |
            Ids of the transactions whose forecast_flag was actually
            flipped. The client passes these back to the same endpoint
            with `forecastFlag` inverted to implement one-click "Undo"
            of a bulk Send-to-Forecast / Remove-from-Forecast — rows
            the user has since re-toggled by hand are naturally
            skipped because their current value already matches the
            new target.
          items: { type: string }

    Debt:
      type: object
      required: [id, name, balance, apr, minPayment, payment, status, sortOrder, balanceSource, aprSource, minPaymentSource]
      properties:
        id: { type: string }
        name: { type: string }
        balance: { type: string }
        originalBalance: { type: ["string", "null"] }
        apr: { type: string }
        minPayment: { type: string }
        payment: { type: string }
        type: { type: ["string", "null"] }
        status: { type: string }
        sortOrder: { type: integer }
        dueDay: { type: ["integer", "null"] }
        statementDay: { type: ["integer", "null"] }
        notes: { type: ["string", "null"] }
        lastBalanceUpdate: { type: ["string", "null"] }
        plaidAccountId: { type: ["string", "null"] }
        plaidLastSyncedAt: { type: ["string", "null"] }
        plaidLastSyncError:
          type: ["string", "null"]
          description: |
            Latest sync error from the parent Plaid item, surfaced on debts
            so users see when balance/APR/min-payment values may be stale
            because Plaid refresh is failing (e.g. ITEM_LOGIN_REQUIRED).
            null when sync is healthy or the debt isn't Plaid-linked.
        plaidLastSyncErrorCode:
          type: ["string", "null"]
          description: |
            Structured `error_code` from the parent Plaid item's last failed
            sync (e.g. ITEM_LOGIN_REQUIRED, PENDING_EXPIRATION). Mirrors the
            value on the parent PlaidItem so the Debts / Avalanche UI can
            decide when to render an inline "Reconnect" affordance on the
            row. null when sync is healthy or the debt isn't Plaid-linked.
        plaidConsentExpirationAt:
          type: ["string", "null"]
          description: |
            (#238) ISO timestamp mirroring the parent Plaid item's
            `consent_expiration_time` — the cutoff after which the bank
            will be auto-disconnected unless the user re-consents. Powers
            the dated PENDING_EXPIRATION / PENDING_DISCONNECT subline copy
            on the DebtReauthBanner ("Chase will disconnect on May 21 —
            reconnect now to keep it linked."). Null when the debt isn't
            Plaid-linked or Plaid never reported a cutoff for the item.
        plaidConsentExpirationLastRefreshError:
          type: ["string", "null"]
          description: |
            (#320) Mirrors the parent Plaid item's
            `consentExpirationLastRefreshError` — the latest /item/get
            failure captured during the consent-refresh path (manual
            "Refresh disconnect dates" button, on-sync PENDING_EXPIRATION
            refresh, or daily cron). Surfaced on debts so the inline
            DebtReauthBanner can warn users when the disconnect-date
            check itself has been failing ("Couldn't verify disconnect
            date: …"), not just when a sync failed. Null when the
            consent-refresh path is healthy or the debt isn't
            Plaid-linked.
        balanceSource: { type: string, enum: [plaid, manual] }
        aprSource: { type: string, enum: [plaid, manual] }
        minPaymentSource: { type: string, enum: [plaid, manual] }
        pendingPaymentTotal:
          type: ["string", "null"]
          description: |
            (#421) Sum (as a money string, e.g. "200.00") of payment-direction
            transactions tagged to this debt that the creditor has not yet
            reflected in the reported `balance`. A transaction counts as
            pending when it's tagged to the debt (auto or manual), has a
            positive (payment-direction) amount, and is dated strictly after
            the debt's last creditor-reported balance timestamp
            (`plaidLastSyncedAt` for Plaid-sourced debts; `lastBalanceUpdate`
            for manual). The Avalanche / Debts UI subtracts this from
            `balance` to render an "effective" balance and show a small
            "−$X pending" hint. Null when the debt has no pending payments.
        pendingPaymentCount:
          type: ["integer", "null"]
          description: |
            (#421) Number of tagged payment-direction transactions counted
            in `pendingPaymentTotal`. Null / 0 when there are none.
        plaidAccount:
          oneOf:
            - $ref: "#/components/schemas/DebtPlaidAccount"
            - type: "null"
    DebtPlaidAccount:
      type: object
      required: [id]
      properties:
        id: { type: string }
        itemId:
          type: ["string", "null"]
          description: |
            Internal Plaid item row id (UUID) of the parent item. Used by
            the Debts / Avalanche UI to mint an update-mode link token via
            <PlaidReconnectButton> when the item is in a re-auth state.
        name: { type: ["string", "null"] }
        mask: { type: ["string", "null"] }
        type: { type: ["string", "null"] }
        subtype: { type: ["string", "null"] }
        liabilityKind: { type: ["string", "null"] }
        institutionName: { type: ["string", "null"] }
        institutionSlug: { type: ["string", "null"] }
    DebtInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        balance: { type: string }
        apr: { type: string }
        minPayment: { type: string }
        payment: { type: string }
        type: { type: ["string", "null"] }
        status: { type: string }
        sortOrder: { type: integer }
        dueDay: { type: ["integer", "null"] }
        statementDay: { type: ["integer", "null"] }
        notes: { type: ["string", "null"] }
        lastBalanceUpdate: { type: ["string", "null"] }
    DebtBalanceHistoryEntry:
      type: object
      required: [debtId, recordedOn, balance]
      properties:
        debtId: { type: string }
        recordedOn: { type: string, description: "YYYY-MM-DD" }
        balance: { type: string }
    DebtLinkInput:
      type: object
      required: [plaidAccountId]
      properties:
        plaidAccountId: { type: string }
    PlaidLiabilityAccount:
      type: object
      required: [id, accountId]
      properties:
        id: { type: string }
        accountId: { type: string }
        itemId:
          type: string
          description: |
            Internal Plaid item row id (UUID) of the parent item. Used by
            the post-Link "Add as debts" dialog to scope the candidate
            list to just the institution that was just linked.
        name: { type: ["string", "null"] }
        officialName: { type: ["string", "null"] }
        mask: { type: ["string", "null"] }
        type: { type: ["string", "null"] }
        subtype: { type: ["string", "null"] }
        liabilityKind: { type: ["string", "null"] }
        balance: { type: ["string", "null"] }
        apr: { type: ["string", "null"] }
        minPayment: { type: ["string", "null"] }
        lastFetchedAt: { type: ["string", "null"] }
        institutionId: { type: ["string", "null"] }
        institutionName: { type: ["string", "null"] }
        institutionSlug: { type: ["string", "null"] }
        linkedDebt:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            - type: "null"
        suggestedDebt:
          oneOf:
            - $ref: "#/components/schemas/PlaidSuggestedDebt"
            - type: "null"
    PlaidSuggestedDebt:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }
        balance: { type: ["string", "null"] }
        apr: { type: ["string", "null"] }
        minPayment: { type: ["string", "null"] }
        dueDay: { type: ["integer", "null"] }
        statementDay: { type: ["integer", "null"] }
    CreateDebtFromPlaidResult:
      type: object
      required: [debt, action]
      properties:
        debt: { $ref: "#/components/schemas/Debt" }
        action: { type: string, enum: [created, linked-existing] }
    BulkCreateDebtsFromPlaidRequest:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            type: object
            required: [plaidAccountId]
            properties:
              plaidAccountId: { type: string }
              name: { type: ["string", "null"] }
    BulkCreateDebtFromPlaidResult:
      type: object
      required: [plaidAccountId, status]
      properties:
        plaidAccountId: { type: string }
        status:
          type: string
          enum:
            - created
            - linked-existing
            - already-linked
            - not-debt-like
            - not-found
            - error
        debtId: { type: ["string", "null"] }
        debtName: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
    BulkCreateDebtsFromPlaidResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BulkCreateDebtFromPlaidResult" }
    AvalancheSettings:
      type: object
      required: [strategy, extraSource, manualExtra, budgetMode]
      properties:
        strategy: { type: string, enum: [avalanche, snowball] }
        extraSource: { type: string, enum: [budget_net, budget_line, manual] }
        extraBudgetCategoryId: { type: ["string", "null"] }
        manualExtra: { type: string }
        budgetMode: { type: string, enum: [budgeted, actual] }
    AvalancheSettingsInput:
      type: object
      properties:
        strategy: { type: string, enum: [avalanche, snowball] }
        extraSource: { type: string, enum: [budget_net, budget_line, manual] }
        extraBudgetCategoryId: { type: ["string", "null"] }
        manualExtra: { type: string }
        budgetMode: { type: string, enum: [budgeted, actual] }
    AvalancheExtra:
      type: object
      required: [source, amount, monthStart]
      properties:
        source: { type: string, enum: [budget_net, budget_line, manual] }
        amount: { type: string }
        monthStart: { type: string }
        mode: { type: string, enum: [budgeted, actual] }
        availableMoney: { type: string }
        plannedAvalanchePayment: { type: string }
        plannedIncome: { type: string }
        plannedExpenses: { type: string }
        breakdown:
          type: object
          properties:
            income: { type: string }
            expenses: { type: string }
            plannedIncome: { type: string }
            plannedExpenses: { type: string }
            categoryId: { type: ["string", "null"] }
            categoryName: { type: ["string", "null"] }
            planned: { type: string }
            actual: { type: string }
    DebtPaymentInput:
      type: object
      required: [amount, occurredOn]
      properties:
        amount: { type: string }
        occurredOn: { type: string }
        account: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    DebtPaymentResult:
      type: object
      required: [debt, transaction, killed]
      properties:
        debt: { $ref: "#/components/schemas/Debt" }
        transaction: { $ref: "#/components/schemas/Transaction" }
        killed: { type: boolean }
    SyncMinimumsResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: array
          items:
            type: object
            required: [id, name, oldMin, newMin]
            properties:
              id: { type: string }
              name: { type: string }
              oldMin: { type: string }
              newMin: { type: string }

    RecurringItem:
      type: object
      required: [id, name, kind, amount, frequency, active, amountKind]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        amount: { type: string }
        frequency: { type: string }
        dayOfMonth: { type: ["integer", "null"] }
        anchorDate: { type: ["string", "null"] }
        active: { type: string }
        categoryId: { type: ["string", "null"] }
        debtId: { type: ["string", "null"] }
        amountKind:
          type: string
          enum: [fixed, estimate]
          description: (PR-B1) "estimate" when the amount is expected to vary; the money position then says its answer is estimated.
    RecurringItemMoveResult:
      type: object
      description: >-
        (One-time bill move) What an edit of a one-time bill's date, amount or
        kind did to its answers. `carried`: answers kept on the bill (a match
        still paying it, a skip, a rejection). `needsReview`: bank-row pairs
        that now wait for Confirm / Partial / Not this in Forecast Review.
        `cleared`: matches removed because Review could not show them or their
        bank row is gone, plus pending reviews dropped when the bill was edited
        while paused or stopped being one-time — the bill shows unpaid. A pause
        alone keeps a pending review and returns no summary.
      required: [carried, needsReview, cleared]
      properties:
        carried: { type: integer }
        needsReview: { type: integer }
        cleared: { type: integer }
    UpdateRecurringItemResponse:
      allOf:
        - $ref: "#/components/schemas/RecurringItem"
        - type: object
          properties:
            moveResult:
              $ref: "#/components/schemas/RecurringItemMoveResult"
    RecurringItemInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        kind: { type: string }
        amount: { type: string }
        frequency: { type: string }
        dayOfMonth: { type: ["integer", "null"] }
        anchorDate: { type: ["string", "null"] }
        active: { type: string }
        categoryId: { type: ["string", "null"] }
        debtId: { type: ["string", "null"] }
        amountKind: { type: string, enum: [fixed, estimate] }

    BillsSummaryRow:
      type: object
      required: [item, nextOccurrence, monthlyAmount, actualAmount]
      properties:
        item: { $ref: "#/components/schemas/RecurringItem" }
        nextOccurrence: { type: ["string", "null"] }
        monthlyAmount: { type: string }
        actualAmount: { type: string }
    BillsSummaryMonthly:
      type: object
      required: [income, bills, debtMin, totalOutflow, net, active, monthStart, monthEnd]
      properties:
        income: { type: string }
        bills: { type: string }
        debtMin: { type: string }
        totalOutflow: { type: string }
        net: { type: string }
        active: { type: integer }
        monthStart: { type: string }
        monthEnd: { type: string }
    BillsDebtMinRow:
      type: object
      required: [debtId, debtName, amount, minPayment, source, locked]
      properties:
        debtId: { type: string }
        debtName: { type: string }
        amount: { type: string }
        minPayment: { type: string }
        nextOccurrence: { type: ["string", "null"] }
        source: { type: string, enum: [plaid, manual] }
        locked: { type: boolean }
        linkedRecurringId: { type: ["string", "null"] }
        dueDay: { type: ["integer", "null"] }
        endsThisCycle: { type: boolean }
    BillsSummary:
      type: object
      required: [income, bills, debtMins, monthly]
      properties:
        income:
          type: array
          items: { $ref: "#/components/schemas/BillsSummaryRow" }
        bills:
          type: array
          items: { $ref: "#/components/schemas/BillsSummaryRow" }
        debtMins:
          type: array
          items: { $ref: "#/components/schemas/BillsDebtMinRow" }
        monthly: { $ref: "#/components/schemas/BillsSummaryMonthly" }

    Category:
      type: object
      required: [id, name, kind, groupName, sourceKind, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        groupName: { type: string }
        sourceKind: { type: string, enum: [manual, auto_bills, auto_debts] }
        sortOrder: { type: integer }
        excludeFromBudget:
          type: boolean
          description: |
            (#474) When true, this category is omitted from every Budget
            page roll-up (planned, actual, group totals, summary) — same
            way transfers are excluded from actuals. Today only the
            system-managed "Uncategorized" category carries this flag;
            it is exposed in the categories list so the row-level
            category pickers on Transactions/Chase/Amex can offer it as
            a triage option, while the mapping-rules UI hides it (the
            API also rejects rules that target it).
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        kind: { type: string }
        groupName: { type: string }
        sourceKind: { type: string, enum: [manual, auto_bills, auto_debts] }
        sortOrder: { type: integer }
    CategoryPatchInput:
      type: object
      description: >
        Patch body for renaming and/or reordering a manual budget
        category. All fields optional; only the supplied ones are
        applied. The server rejects edits to non-manual (auto_bills /
        auto_debts) categories since those names/positions are
        regenerated from bills and debts on every rollup.
      properties:
        name: { type: string }
        sortOrder: { type: integer }

    BudgetLine:
      type: object
      required: [id, monthStart, categoryId, plannedAmount]
      properties:
        id: { type: string }
        monthStart: { type: string }
        categoryId: { type: string }
        plannedAmount: { type: string }
        note: { type: ["string", "null"] }
    BudgetLineInput:
      type: object
      required: [monthStart, categoryId, plannedAmount]
      properties:
        monthStart: { type: string }
        categoryId: { type: string }
        plannedAmount: { type: string }
        note: { type: ["string", "null"] }
    PinBudgetMonthInput:
      type: object
      required: [pinned]
      properties:
        pinned: { type: boolean }
    PinBudgetLineInput:
      type: object
      required: [monthStart, categoryId, pinned]
      properties:
        monthStart: { type: string }
        categoryId: { type: string }
        pinned: { type: boolean }
    PinResult:
      type: object
      required: [monthStart, monthPinned, linesPinned]
      properties:
        monthStart: { type: string }
        monthPinned: { type: boolean }
        linesPinned: { type: integer }
    BudgetMonthDetail:
      type: object
      required: [monthStart, monthPinned, lines, groups, summary, planBySource, allowance, replacedPendingIds, inheritedCategories]
      properties:
        monthStart: { type: string }
        note: { type: ["string", "null"] }
        monthPinned:
          type: boolean
          description: |
            True when the user has pinned this month, which causes every
            auto-pulled line with a persisted budget_lines value to use that
            stored value instead of the live Bills/Debts derivation.
        lines:
          type: array
          items: { $ref: "#/components/schemas/BudgetLineWithActual" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/BudgetGroup" }
        summary: { $ref: "#/components/schemas/BudgetSummary" }
        planBySource: { $ref: "#/components/schemas/BudgetPlanBySource" }
        allowance: { $ref: "#/components/schemas/BudgetAllowanceRollup" }
        replacedPendingIds:
          type: array
          description: |
            (PR-D) Pending rows dated in this month that a posted row replaced
            (loadSupersededPendingIds, PR4c pairing over the whole ledger). They
            count in no figure on this response - not a category actual, not
            the allowance - exactly as on Spending. Listed so the page's actuals
            drill can leave them out and still tie to its row.
          items: { type: string }
        inheritedCategories:
          type: array
          description: |
            (PR-D review H1) Posted rows dated in this month that count under a
            category they do not store: the category of the pending row they
            replaced, because the posted row arrived with none (or only the
            system Uncategorized). Read-time only; nothing is written. Listed so
            the page's actuals drill files the row where its figure counts.
          items:
            type: object
            required: [transactionId, categoryId]
            properties:
              transactionId: { type: string }
              categoryId: { type: string }
    BudgetLineWithActual:
      type: object
      required: [categoryId, categoryName, plannedAmount, actualAmount, postedAmount, pendingAmount, combinedAmount, groupName, sourceKind, sortOrder, kind, pinned, planSource]
      properties:
        id: { type: ["string", "null"] }
        categoryId: { type: string }
        categoryName: { type: string }
        plannedAmount: { type: string }
        actualAmount:
          type: string
          description: |
            Spending (income: money in) so far this month = postedAmount +
            pendingAmount. A pending purchase counts once: while pending it is
            in pendingAmount; once its posted row replaces it, only the posted
            row counts, at its final amount (owner decision 6).
        postedAmount:
          type: string
          description: "(PR-D) The part of actualAmount from posted rows."
        pendingAmount:
          type: string
          description: "(PR-D) The part of actualAmount from pending rows no posted row has replaced."
        combinedAmount:
          type: string
          description: "(PR-D) postedAmount + pendingAmount. Always equal to actualAmount."
        note: { type: ["string", "null"] }
        groupName: { type: string }
        sourceKind: { type: string, enum: [manual, auto_bills, auto_debts] }
        planSource:
          type: string
          enum: [income, bills, debts, unbacked]
          description: |
            Where this line's planned money comes from. The Budget page groups
            by this and sums only `bills` + `debts` into its plan.
              - `income`   - an income category (the paychecks).
              - `bills`    - one or more recurring items roll into this
                             category for the viewed month.
              - `debts`    - a Debt Tracker minimum, or the Avalanche payment.
              - `unbacked` - a hand-created envelope with no recurring item and
                             no debt behind it. Shown and editable, but
                             deliberately EXCLUDED from
                             planBySource.plannedTotal so the month is not
                             planned twice for money that belongs inside a bill
                             or inside the allowance.
            Bill-backing beats sourceKind: most expense bills are pointed at a
            curated envelope on the Bills page, so a bill-backed category still
            reports sourceKind "manual".
        sortOrder: { type: integer }
        kind: { type: string }
        pinned:
          type: boolean
          description: |
            True when this line's persisted planned amount is being used in
            place of the live Bills/Debts derivation. Driven by either the
            month-level pin or the per-line pin.
        sourceBreakdown:
          type: array
          description: |
            Per-source breakdown of the actuals that contribute to this
            budget line. Used to render Bank/Amex badges with counts on the
            budget page so the user can see at a glance where the spend came
            from. Transfers are excluded from these counts.
          items:
            type: object
            required: [source, count, amount]
            properties:
              source: { type: string, enum: [Bank, Amex, Other] }
              count: { type: integer }
              amount: { type: string }
        plannedSource:
          type: object
          required: [kind, bills]
          description: |
            Provenance of the Budgeted amount on this row. Drives the
            "where did this come from?" popover on the Budget page.
            `kind` is one of:
              - `bills`   — sum of one or more recurring items linked to
                            this category (income or expense). `bills`
                            lists each contributing item with its
                            per-month amount for the viewed month.
              - `pinned`  — a snapshot value the user pinned (line- or
                            month-level) that overrides the live
                            derivation.
              - `derived` — auto_debts category whose amount is the
                            current minimum-payment from the linked debt.
              - `manual`  — plain envelope: the value comes from the
                            persisted budget_lines.planned_amount that
                            the user edits inline.
          properties:
            kind:
              type: string
              enum: [bills, pinned, derived, manual]
            bills:
              type: array
              description: |
                Recurring items linked to this category and their
                expanded contribution to the viewed month. Always
                present (empty for non-bill kinds).
              items:
                type: object
                required: [id, name, amount, frequency, eventCount]
                properties:
                  id: { type: string }
                  name: { type: string }
                  amount: { type: string }
                  frequency: { type: string }
                  eventCount: { type: integer }
    BudgetGroup:
      type: object
      required: [groupName, plannedTotal, actualTotal, lines]
      properties:
        groupName: { type: string }
        plannedTotal: { type: string }
        actualTotal: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/BudgetLineWithActual" }
    BudgetSummaryPair:
      type: object
      required: [budget, actual]
      properties:
        budget: { type: string }
        actual: { type: string }
    BudgetSummary:
      type: object
      required: [income, expenses, net, percentSpent]
      properties:
        income: { $ref: "#/components/schemas/BudgetSummaryPair" }
        expenses: { $ref: "#/components/schemas/BudgetSummaryPair" }
        net: { $ref: "#/components/schemas/BudgetSummaryPair" }
        percentSpent: { $ref: "#/components/schemas/BudgetSummaryPair" }
    BudgetPlanBucket:
      type: object
      required: [planned, actual, lineCount]
      properties:
        planned: { type: string }
        actual: { type: string }
        lineCount: { type: integer }
    BudgetPlanBySource:
      type: object
      required: [income, bills, debts, unbacked, plannedTotal, actualTotal, net]
      description: |
        The month rolled up by where each dollar comes from.
        plannedTotal is bills + debts ONLY. unbacked is reported so the page can
        show it and offer to give it a source, and income is the other side of
        the ledger - neither is added to the plan.
      properties:
        income: { $ref: "#/components/schemas/BudgetPlanBucket" }
        bills: { $ref: "#/components/schemas/BudgetPlanBucket" }
        debts: { $ref: "#/components/schemas/BudgetPlanBucket" }
        unbacked: { $ref: "#/components/schemas/BudgetPlanBucket" }
        plannedTotal:
          type: string
          description: "bills.planned + debts.planned. Never includes unbacked."
        actualTotal:
          type: string
          description: "bills.actual + debts.actual."
        net:
          type: string
          description: "income.planned minus plannedTotal."
    BudgetAllowanceSubBucket:
      type: object
      required: [bucket, actual, count]
      properties:
        bucket:
          type: string
          enum: [groceries, dining, alcohol, entertainment, misc]
        actual: { type: string }
        count: { type: integer }
    BudgetAllowanceLine:
      type: object
      required: [bucket, planned, actual, posted, pending, combined, count, subBuckets]
      properties:
        bucket: { type: string, enum: [weekly, monthly, unplanned] }
        planned:
          type: string
          description: |
            The cap for the whole month. The weekly cap is stored per week and
            scaled by daysInMonth / 7. Per-week overrides in
            settings.preferences.weeklyAllowanceOverrides are NOT applied.
        actual:
          type: string
          description: |
            Filed spend so far = posted + pending. A pending row a posted row
            replaced counts nowhere (see BudgetMonthDetail.replacedPendingIds).
        posted:
          type: string
          description: "(PR-D) The part of actual from posted rows."
        pending:
          type: string
          description: "(PR-D) The part of actual from pending rows no posted row has replaced."
        combined:
          type: string
          description: "(PR-D) posted + pending. Always equal to actual."
        count: { type: integer }
        subBuckets:
          type: array
          description: |
            Weekly only - the five slices of the weekly envelope, which
            partition it rather than adding to it. Weekly spend with no slice
            chosen is folded into misc so the five always sum to the weekly
            total. Empty for monthly and unplanned.
          items: { $ref: "#/components/schemas/BudgetAllowanceSubBucket" }
    BudgetAllowanceRollup:
      type: object
      required: [lines, planned, actual, posted, pending, combined, weeksInMonth]
      description: |
        Allowance spend for the month, aggregated server-side.
        TRACKED, NOT PLANNED. This money is already in planBySource.bills as the
        recurring items that fund it, so these figures are never added to the
        plan.
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/BudgetAllowanceLine" }
        planned: { type: string }
        actual:
          type: string
          description: "posted + pending, across the three buckets."
        posted:
          type: string
          description: "(PR-D) The part of actual from posted rows."
        pending:
          type: string
          description: "(PR-D) The part of actual from pending rows no posted row has replaced."
        combined:
          type: string
          description: "(PR-D) posted + pending. Always equal to actual."
        weeksInMonth: { type: string }
    SeedDefaultBudgetResult:
      type: object
      required: [categoriesInserted, linesInserted, alreadySeeded]
      properties:
        categoriesInserted: { type: integer }
        linesInserted: { type: integer }
        mappingRulesInserted: { type: integer }
        alreadySeeded: { type: boolean }
    MappingRule:
      type: object
      required: [id, pattern, matchType, priority]
      properties:
        id: { type: string }
        pattern: { type: string }
        matchType: { type: string }
        categoryId: { type: ["string", "null"] }
        priority: { type: integer }
    CreateMappingRuleResponse:
      allOf:
        - $ref: "#/components/schemas/MappingRule"
        - type: object
          required: [ruleAction]
          properties:
            ruleAction:
              $ref: "#/components/schemas/RuleAction"
              description: |
                Mirrors the auto-learn flow's `ruleAction` shape so the
                Mapping Rules page can reuse the same client-side
                "apply to past charges?" prompt as PATCH
                /transactions/{id}.

                For a hand-created rule with a chosen category, this
                surfaces a `kind: "created"` action carrying the
                pattern, matchType, toCategoryId, and the count of
                older *uncategorized* transactions matching the new
                rule. Returns `kind: "none"` when the new rule has no
                category (nothing to flip rows onto) or when no
                uncategorized rows would match.
    MappingRuleInput:
      type: object
      required: [pattern]
      properties:
        pattern: { type: string }
        matchType: { type: string }
        categoryId: { type: ["string", "null"] }
        priority: { type: integer }

    ReorderMappingRulesInput:
      type: object
      required: [orderedIds]
      properties:
        orderedIds:
          type: array
          description: |
            Rule IDs in the desired display order, highest priority first.
            IDs not belonging to the calling user are ignored. IDs of rules
            the user owns but that are missing from this list keep their
            existing priorities and rank below the reordered set.
          items: { type: string }

    TestMappingRulesInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
          description: Transaction description fragment to test against the user's rules.

    TestMappingRulesMatch:
      type: object
      required: [rule, winner]
      properties:
        rule: { $ref: "#/components/schemas/MappingRule" }
        winner:
          type: boolean
          description: |
            True for the single rule the auto-categorize flow would pick
            (highest-priority match with a non-null categoryId).

    MappingRuleRecategorizePreviewInput:
      type: object
      required: [toCategoryId]
      properties:
        toCategoryId:
          type: string
          description: |
            The category the user is considering moving the rule to. The
            preview is computed against the rule's *current* `categoryId` as
            the `fromCategoryId`; if the rule is currently uncategorized
            (`categoryId: null`) or `toCategoryId` already matches it, the
            response reports `candidateCount: 0`.

    MappingRuleRecategorizePreview:
      type: object
      required:
        [
          ruleId,
          pattern,
          matchType,
          fromCategoryId,
          toCategoryId,
          candidateCount,
          sampleTransactions,
        ]
      description: |
        Read-only preview of the bulk-recategorize that would happen if the
        Mapping Rules edit UI saved a new `categoryId` for this rule and then
        called POST /transactions/recategorize-by-pattern with the same
        `{ pattern, matchType, fromCategoryId, toCategoryId }`. Mirrors the
        `RepointedRule` shape so the same preview Dialog can render either.
      properties:
        ruleId: { type: string }
        pattern: { type: string }
        matchType: { type: string, enum: [contains, exact, starts_with] }
        fromCategoryId:
          type: ["string", "null"]
          description: |
            The rule's current `categoryId` at preview time. `null` when the
            rule is currently uncategorized — in that case `candidateCount` is
            always `0` because the bulk-recategorize endpoint requires a
            concrete from-category to scope the update.
        toCategoryId: { type: string }
        candidateCount:
          type: integer
          description: |
            Number of transactions whose description matches the rule's
            pattern AND that currently sit in `fromCategoryId`. `0` when the
            target equals the from-category, when the rule is uncategorized,
            or when no historical rows match.
        sampleTransactions:
          type: array
          description: |
            First ~10 affected transactions, ordered most-recent first. Same
            thin slice (id, description, occurredOn, amount) used by
            `RepointedRule.sampleTransactions`.
          items: { $ref: "#/components/schemas/RepointedRuleSample" }

    MappingRulePatternRecategorizePreviewInput:
      type: object
      required: [pattern, matchType]
      description: |
        Pattern shape used by the "Add New Rule" form's inline preview.
        Carries the unsaved rule directly so the server can compute
        the candidate count + sample list against older *uncategorized*
        rows without persisting anything.

        `toCategoryId` is optional: the candidate count + samples only
        depend on `pattern` + `matchType` (the bulk recategorize always
        scopes to uncategorized rows), so the Add form can fire the
        same request as soon as the user has typed a pattern — before
        they pick a destination category — and avoid a refetch when
        the category is then chosen.
      properties:
        pattern:
          type: string
          description: |
            The literal pattern the unsaved rule would match against
            transaction descriptions.
        matchType:
          type: string
          enum: [contains, exact, starts_with]
        toCategoryId:
          type: string
          description: |
            Optional. The category the unsaved rule would assign
            matching rows to. Echoed back in the response when supplied
            so the client can confirm the preview lines up with the
            currently-picked category, but doesn't affect the count.

    MappingRulePatternRecategorizePreview:
      type: object
      required:
        [
          pattern,
          matchType,
          fromCategoryId,
          toCategoryId,
          candidateCount,
          sampleTransactions,
        ]
      description: |
        Read-only preview of the bulk-recategorize that *would* happen if the
        Mapping Rules "Add New Rule" form created a rule with the given
        `{ pattern, matchType, toCategoryId }` and then chained
        POST /transactions/recategorize-by-pattern against the older
        uncategorized rows it would match. Mirrors `MappingRuleRecategorizePreview`
        minus the `ruleId` (no rule exists yet) so the same preview banner +
        "Show matches" Dialog can render either.
      properties:
        pattern: { type: string }
        matchType: { type: string, enum: [contains, exact, starts_with] }
        fromCategoryId:
          type: ["string", "null"]
          description: |
            Always `null` for the by-pattern preview — the Add flow scopes
            its bulk recategorize to uncategorized rows only, so explicit
            user category edits aren't trampled. Surfaced as an explicit
            field for symmetry with `MappingRuleRecategorizePreview`.
        toCategoryId:
          type: ["string", "null"]
          description: |
            Echo of the request's `toCategoryId`. `null` when the caller
            previewed before picking a destination category — the
            candidate count + samples are still meaningful (they only
            depend on pattern + matchType against uncategorized rows),
            but the client should render a neutral "would match N
            uncategorized past transactions" banner instead of the
            "will move into <category>" copy.
        candidateCount:
          type: integer
          description: |
            Number of *uncategorized* transactions whose description matches
            the unsaved rule's pattern. `0` when no historical rows match.
        sampleTransactions:
          type: array
          description: |
            First ~10 affected transactions, ordered most-recent first. Same
            thin slice (id, description, occurredOn, amount) used by
            `RepointedRule.sampleTransactions`.
          items: { $ref: "#/components/schemas/RepointedRuleSample" }

    TestMappingRulesResult:
      type: object
      required: [matches, winningCategoryId]
      properties:
        matches:
          type: array
          description: |
            Every rule whose pattern matches the description, sorted by
            priority descending — same order the categorize() hot path uses.
          items: { $ref: "#/components/schemas/TestMappingRulesMatch" }
        winningCategoryId:
          type: ["string", "null"]
          description: |
            The category that auto-categorize would assign, or null when no
            matching rule has a category.

    WeeklyBucketLabels:
      type: object
      properties:
        groceries: { type: string }
        dining: { type: string }
        alcohol: { type: string }
        entertainment: { type: string }
        misc: { type: string }
    DaysSinceTracker:
      type: object
      required: [id, label, matchType, matchValue]
      properties:
        id: { type: string }
        label: { type: string }
        matchType: { type: string, enum: [category, keyword] }
        matchValue: { type: string }
    SettingsPreferences:
      type: object
      properties:
        weeklyBucketLabels: { $ref: "#/components/schemas/WeeklyBucketLabels" }
        daysSinceTrackers:
          type: array
          items: { $ref: "#/components/schemas/DaysSinceTracker" }
        weeklyAllowanceOverrides:
          type: object
          description: >-
            Per-week weekly-allowance overrides, keyed by the week's Sunday
            (ISO yyyy-mm-dd) -> planned amount string. Household-scoped so both
            partners see the same per-week edit.
          additionalProperties: { type: string }
        amexCardBrands:
          type: object
          description: >-
            Per-card Amex tier override, keyed by the external Plaid account_id
            -> "blue" | "silver" | "gold". User-assigned so the Kill Stack /
            per-card UI label each physical card correctly even when Plaid's
            card name doesn't contain the tier word. Display metadata only — does
            not change any financial math.
          additionalProperties: { type: string, enum: [blue, silver, gold] }
        amexCardCadence:
          type: object
          description: >-
            Per-card billing cadence, keyed by external Plaid account_id ->
            "weekly" | "monthly" (default weekly). A monthly card's charges
            accumulate over the calendar month and are paid at month-end; weekly
            cards reset each Sun–Sat week. Grouping metadata only — amounts are
            still the same server-computed real-charge sums, just over a
            different window.
          additionalProperties: { type: string, enum: [weekly, monthly] }
        amexCardNames:
          type: object
          description: >-
            Per-card display name, keyed by external Plaid account_id -> custom
            name (e.g. "Sky Card"). Overrides the tier label on the Kill Stack /
            per-card UI.
          additionalProperties: { type: string }
        amexExcludedTxnIds:
          type: array
          description: >-
            Transaction ids the user has marked "not mine" on an Amex card —
            reimbursements / charges paid back by someone else, not out of
            household funds. The per-card weekly/monthly payoff total
            (computeWeeklyPayoff / Kill Stack) skips these so the "to pay"
            figure reflects only what the household actually owes. Scoped to the
            payoff view; does NOT alter the debt anchor (the charge is still on
            the statement until the credit posts).
          items: { type: string }
        dismissedDetectedSubs:
          type: array
          description: >-
            Merchant names of auto-detected recurring subscriptions the user has
            dismissed from the Banking "Cancel these" / "Paying for, not in the
            budget" lists (they've already cancelled the sub in real life). The
            banking-insights UI hides these so the hit list stays actionable.
          items: { type: string }
        recurringReviewSince:
          type: string
          description: >-
            ISO yyyy-mm-dd baseline for the recurring-charge triage. Set to
            "today" the first time the review section renders. The triage only
            surfaces recurring charges first seen on/after this date, so the
            owner reviews new subscriptions going forward rather than years of
            history. Household-scoped.
        recurringChargeReview:
          type: object
          description: >-
            The owner's verdict per recurring charge in the triage, keyed by the
            normalized merchant key -> "keep" | "cancel" | "not_sub". A verdict
            removes the charge from the review queue (and, for "cancel", lists it
            in the section's cancel bucket). Household-scoped so both partners see
            the same triage state. Classification metadata only — no financial math.
          additionalProperties: { type: string, enum: [keep, cancel, not_sub] }
    UiPreferences:
      type: object
      description: Per-user (not per-household) UI preferences for the signed-in user.
      properties:
        sidebarCollapsed: { type: boolean }
        chaseHideReviewed:
          type: boolean
          description: |
            (PR14) The Chase list leaves out reviewed rows (the ledger's
            reviewed=false filter). A view setting only: no total or balance
            depends on it.
        whatsNewSeen:
          type: string
          maxLength: 32
          description: |
            (S1) The id of the last "What's new" sheet this user dismissed
            ("h2-1"). A view setting only.
        autoCategorize:
          type: boolean
          description: |
            (S1) The user's choice that H2 files new charges on its own.
            (AI-1) The categorizer's model pass reads it: false skips the model
            entirely (the deterministic stages still run). Absent means true.
        modelAutoCategorize:
          type: boolean
          description: |
            (AI-1) The owner lets the model's high-confidence answers write a
            category outright. Only counts once the household has at least 50
            model filings accepted in the last 30 days (and 9 in 10 of the ones
            judged); until then the model stays provisional. Absent means false.
