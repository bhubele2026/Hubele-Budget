openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: H2 Family Budget API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: transactions
  - name: chase-ledger
    description: (PR14) Operations only the Chase page calls; generated into @workspace/api-client-react/ledger so they stay off the landing chunk.
  - name: debts
  - name: recurring
  - name: budget
  - name: mapping
  - name: settings
  - name: import
  - name: forecast
  - name: dashboard-budgets
  - name: weekly-settlements
  - name: auth
  - name: invitations
  - name: members
  - name: spine
  - name: debt-plan
  - name: metrics
    description: (PR-E) The nightly progress metrics (one row per household per day).
  - name: ops
  - name: recap
    description: (AI-0) Owner-only operations views (job queues).
  - name: agent
    description: (AI-3) The agent's trail — what the proactive monitor noticed (findings), its runs, and the Activity list of what it did.
  - name: money
    description: (PR-B1) The money position (safe to spend until payday and this week) and the allowance plans behind its weekly cap.
  - name: categorization
  - name: ai
    description: (AI-2) Ask — conversations, the chat stream, AI usage and budget.
  - name: ai-stream
    description: (AI-2) The chat stream. Generated for the zod package only; the web client reads the event stream itself.
  - name: memory
    description: (AI-2) What the household (or Ask, visibly) keeps in memory.
  - name: wishlist
    description: (AI-2) The wish list and its waiting period.
  - name: goals
    description: (PR-C) Savings, buffer, sinking and debt-payoff goals, and the money a goal holds back in checking.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: |
        Health check. Always 200 while the process serves; job, AI and SMS
        state are reported as booleans and counts (never secrets) and never
        fail the check.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /version:
    get:
      operationId: getVersion
      tags: [health]
      summary: |
        Stable per-deploy build identifier. The web bundle bakes the
        same identifier at build time; a client poller compares the two
        and prompts the user to reload when they differ (i.e. a new
        version has been deployed). No auth — GET only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }

  /ops/jobs:
    get:
      operationId: getOpsJobs
      tags: [ops]
      summary: |
        (AI-0, owner only) Job counts per queue and state, plus the 50 most
        recent failed jobs. Read straight from the pg-boss tables, so it works
        whether or not this instance runs jobs.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpsJobsReport" }
        "403":
          description: Forbidden

  /ops/jobs/{id}/retry:
    post:
      operationId: retryOpsJob
      tags: [ops]
      summary: (AI-0, owner only) Put a failed job back in its queue.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Retried
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpsJobRetryResult" }
        "400":
          description: Not a job id
        "403":
          description: Forbidden
        "404":
          description: No such job
        "409":
          description: The job is not in a failed state
        "503":
          description: Jobs are not running on this instance

  /recap/settings:
    get:
      operationId: getRecapSettings
      tags: [recap]
      summary: |
        (AI-4b) The caller's own daily-recap text settings (created with defaults
        on first read). Never carries the full phone number: only its last four digits.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapSettings" }
    put:
      operationId: updateRecapSettings
      tags: [recap]
      summary: |
        (AI-4b) Change the caller's recap settings. Turning the recap on needs a
        verified phone number and recorded consent, and not an opt-out.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecapSettingsInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapSettings" }
        "400":
          description: Invalid setting, or the recap cannot be turned on yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }

  /recap/verify/start:
    post:
      operationId: startRecapVerification
      tags: [recap]
      summary: |
        (AI-4b) Record consent and text a 6-digit code (valid 10 minutes, at most
        3 starts per day) to the given US mobile number.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecapVerifyStartInput" }
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapVerifyStartResult" }
        "400":
          description: Invalid number, or consent not given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }
        "429":
          description: Too many starts today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }
        "502":
          description: The text could not be sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }

  /recap/verify/confirm:
    post:
      operationId: confirmRecapVerification
      tags: [recap]
      summary: (AI-4b) Confirm the 6-digit code (5 tries per code). Marks the number verified.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecapVerifyConfirmInput" }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapSettings" }
        "400":
          description: Wrong, expired or missing code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }
        "429":
          description: Too many wrong tries; start again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }

  /recap/test-send:
    post:
      operationId: sendRecapTest
      tags: [recap]
      summary: (AI-4b) Text the fixed test line to the caller's verified number (3 per day).
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapTestSendResult" }
        "400":
          description: No verified number, or opted out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }
        "429":
          description: Test limit reached for today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }
        "502":
          description: The text could not be sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }

  /recap/pause:
    post:
      operationId: pauseRecap
      tags: [recap]
      summary: (AI-4b) Pause recap texts until the given time (null or a past time resumes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecapPauseInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapSettings" }
        "400":
          description: Not a time, or more than a year away
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }

  /recap/unsubscribe:
    post:
      operationId: unsubscribeRecap
      tags: [recap]
      summary: (AI-4b) Opt out of recap texts and turn the recap off.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapSettings" }

  /recap/deliveries:
    get:
      operationId: listRecapDeliveries
      tags: [recap]
      summary: (AI-4b) The caller's most recent text deliveries (newest first, at most 30).
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecapDeliveryItem" }

  /recap/preview:
    post:
      operationId: previewRecap
      tags: [recap]
      summary: (AI-4a) Draft the morning recap for a day without storing or sending it (model draft and template).
      description: |
        Builds the facts for the caller and returns both drafts. The model draft counts against the
        household's daily `recap` call cap; it is null when AI is off, over budget, refused, or when
        its text failed validation twice. With the demo provider the model text is a labelled fixture.
        Nothing is stored and nothing is sent.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecapPreviewInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapPreview" }
        "400":
          description: Not a usable date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }

  /recap/history:
    get:
      operationId: listRecapHistory
      tags: [recap]
      summary: (AI-4a) The caller's most recent recaps, newest first (at most 30), with their delivery status.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecapHistoryItem" }

  /recap/generate-now:
    post:
      operationId: generateRecapNow
      tags: [recap]
      summary: (AI-4a) Owner only. Generate and store a member's recap for a day now (ops); does not send it.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecapGenerateNowInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapGenerateNowResult" }
        "400":
          description: Not a usable date, or not a member of this household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }
        "403":
          description: Only the household owner may do this
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }
        "409":
          description: That recap was already sent and cannot be replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecapError" }

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Dashboard summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      parameters:
        - in: query
          name: from
          schema: { type: string }
        - in: query
          name: to
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: uncategorized
          schema: { type: boolean }
        - in: query
          name: excludeTransfers
          schema: { type: boolean }
        - in: query
          name: reimbursable
          schema: { type: boolean }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: minAmount
          schema: { type: string }
        - in: query
          name: maxAmount
          schema: { type: string }
        - in: query
          name: categoryId
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }
    post:
      operationId: createTransaction
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTransactionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateTransactionResponse" }
  /transactions/{id}:
    patch:
      operationId: updateTransaction
      tags: [transactions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateTransactionResponse" }
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }

  /transactions/{id}/clear-transfer-override:
    post:
      operationId: clearTransferOverride
      tags: [transactions]
      summary: |
        Clear the `isTransferUserOverridden` flag on a single transaction so
        that the next Plaid sync (or XLSX import pass) can
        re-apply the description+PFC auto-Transfer heuristic to it. Used by
        the "Reset to auto" affordance surfaced in the row's Edit dialog
        when the user has previously toggled the Transfer flag manually.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "404":
          description: Not found

  /transactions/recategorize-by-pattern:
    post:
      operationId: recategorizeTransactionsByPattern
      tags: [transactions]
      summary: |
        Bulk re-categorize past transactions whose description matches a
        mapping rule's pattern and that currently sit in the rule's old
        category. Used by the "apply this rule to past transactions too"
        prompt that surfaces after the auto-relearn flow repoints a seed
        rule (e.g. an Amex/Cap One/Discover debt-payment rule moving from
        "Misc / Buffer" onto the user's real per-debt category).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecategorizeByPatternInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecategorizeByPatternResult" }

  /transactions/merchant-alias:
    put:
      operationId: putMerchantAlias
      tags: [transactions]
      summary: |
        (#888) Set or update a friendly merchant name (alias) for a
        transaction's stable signature. The caller passes the raw bank
        `description` (the server owns signature derivation so client and
        server can never drift) plus the desired `alias`. The alias is
        household-scoped and keyed on the signature, so it applies to every
        current AND future transaction that shares the same signature. The
        response reports how many existing transactions share the signature
        so the UI can say "applies to N transactions".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutMerchantAliasInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PutMerchantAliasResult" }
        "400":
          description: Invalid input (empty alias or no derivable signature)
    delete:
      operationId: deleteMerchantAlias
      tags: [transactions]
      summary: |
        (#888) Remove a merchant alias, resetting the row headline back to the
        deterministic bank-default name (cleanMerchant). Idempotent — deleting
        a non-existent alias succeeds as a no-op.
      parameters:
        - in: query
          name: signature
          required: true
          schema: { type: string }
          description: The merchant signature whose alias should be cleared.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteMerchantAliasResult" }

  /transactions/uncategorize-by-ids:
    post:
      operationId: uncategorizeTransactionsByIds
      tags: [transactions]
      summary: |
        Bulk clear the categoryId on a list of transactions, scoped by an
        optional `fromCategoryId` guard so manual edits made between the
        original recategorize and the Undo click are preserved. Used by the
        "Rule added · moved N past transactions" toast on the Mapping Rules
        page so the user can one-click Undo a freshly-added rule's bulk
        sweep — the existing /transactions/recategorize-by-pattern endpoint
        can't model the swap because it requires a non-null toCategoryId.
        Reusable for any future "from anywhere" bulk that needs a null
        target.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UncategorizeByIdsInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UncategorizeByIdsResult" }

  /transactions/bulk-update:
    post:
      operationId: bulkUpdateTransactions
      tags: [transactions]
      summary: |
        Apply the same patch to a list of transactions in a single
        request. Replaces the per-row PATCH /transactions/{id} fan-out
        used by the Amex / All-transactions bulk action bar (bulk
        recategorize, bulk bucket, bulk owed-by, bulk reimbursable,
        bulk reviewed) so a 500-row selection costs one round-trip
        instead of 500. The patch is the same shape as TransactionInput
        but only the fields the caller wants changed should be set —
        omitted fields are left alone. Unlike the per-row PATCH this
        endpoint does NOT trigger the auto-learn mapping-rule flow:
        bulk recategorize is an explicit user-driven action and the
        rule-learning toast is only meaningful for one-off edits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkUpdateTransactionsInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkUpdateTransactionsResult" }

  /transactions/send-to-review:
    post:
      operationId: sendTransactionsToReview
      tags: [transactions]
      summary: |
        (#762 — Phase B) Promote up to 200 transactions into the Review
        workflow by stamping `sent_to_review_at = NOW()`. The Chase /
        Amex / source-of-truth views are unaffected — only the Review
        pipeline on /forecast filters on the column. Rows already sent
        are silently skipped. Scoped to the caller's household so other
        households' ids are no-ops.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendTransactionsToReviewInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendTransactionsToReviewResult" }

  /transactions/unsend-from-review:
    post:
      operationId: unsendTransactionsFromReview
      tags: [transactions]
      summary: |
        (#762 — Phase B) Reverse a Send-to-Review by clearing
        `sent_to_review_at = NULL` on up to 200 transactions. Used by
        the 5-second "Undo" affordance on the success toast and by the
        symmetric Review-tab "unsend" flow. Same household scoping and
        batch ceiling as /transactions/send-to-review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendTransactionsToReviewInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendTransactionsToReviewResult" }

  /transactions/bulk-set-forecast-flag:
    post:
      operationId: bulkSetForecastFlag
      tags: [transactions]
      summary: |
        Bulk set the forecast_flag on a list of transactions to a target
        boolean value. Returns the ids that were actually flipped (rows
        whose flag already matched the target are skipped) so the client
        can offer a one-click Undo on the success toast that's safe even
        when the user has since toggled some of the rows back manually.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkSetForecastFlagInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkSetForecastFlagResult" }

  /transactions/ledger:
    get:
      operationId: getTransactionsLedger
      tags: [transactions, chase-ledger]
      summary: |
        (PR13) One page of the bank ledger, newest first. The server settles
        the scope: the Plaid account the snapshot resolves to, its
        same-institution mask twins, and manual rows (no Plaid account, source
        neither "amex" nor "plaid:*"), which is the rule the bank balance reads
        by. A client must not hide rows the register counts. Ordered by
        occurredOn desc, occurredAt desc (nulls last), id desc, and paged with
        an opaque keyset cursor. Each row carries what it moves the balance by
        (`balanceAmount`, `countsInBalance`, `balanceReason`), from the cash
        rule over the account's whole history. `matchingCount` counts every
        row matching the filters; `totals` and `review` cover every row
        matching the filters other than `reviewed`. `runningBalance`,
        `balanceStart`, `balanceEnd`, `balanceToday` and `anchor` never depend
        on the non-date filters or the page, and no balance is given for a day
        after today. The boolean filters take the strings "true" or "false";
        anything else is a 400.
      parameters:
        - in: query
          name: account
          description: |
            `plaid_accounts.id` of the ledger account. Optional; defaults to
            the snapshot's account. (PR14) Any Chase depository account of the
            household is accepted with its mask twins. An account that is not
            the snapshot's account (or its twin) lists its own rows, totals and
            review counts with every balance null (`balanceUnavailableReason`
            "not_snapshot_account"): no balance is computed for it, and manual
            rows are not on it. Any other account is a 400 `account_not_ledger`.
          schema: { type: string, maxLength: 64 }
        - in: query
          name: from
          description: First day, YYYY-MM-DD, inclusive.
          schema: { type: string, maxLength: 10 }
        - in: query
          name: to
          description: Last day, YYYY-MM-DD, inclusive.
          schema: { type: string, maxLength: 10 }
        - in: query
          name: search
          description: Case-insensitive match on the description or the category name.
          schema: { type: string, maxLength: 200 }
        - in: query
          name: reviewed
          description: '"true" or "false".'
          schema: { type: string, maxLength: 5 }
        - in: query
          name: pending
          description: '"true" or "false".'
          schema: { type: string, maxLength: 5 }
        - in: query
          name: uncategorized
          description: '"true" keeps only rows with no category; "false" is no filter.'
          schema: { type: string, maxLength: 5 }
        - in: query
          name: categoryId
          schema: { type: string, maxLength: 64 }
        - in: query
          name: source
          schema: { type: string, maxLength: 100 }
        - in: query
          name: member
          schema: { type: string, maxLength: 100 }
        - in: query
          name: limit
          description: Plain digits, 1 to 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          description: The `nextCursor` of the previous page.
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerPage" }
        "400":
          description: Invalid filter, limit, cursor or account, or a NUL byte in any value

  /transactions/balances:
    get:
      operationId: getTransactionsBalances
      tags: [transactions, chase-ledger]
      summary: |
        (PR13) End-of-day balances of the ledger account for up to 120 dates,
        on the same register as GET /transactions/ledger: a date's balance is
        the runningBalance after the last account row dated on or before it.
        Today's equals the bank balance on the spine. A date after today, and
        every date without a bank snapshot, has a null balance: the register
        is not a projection.
      parameters:
        - in: query
          name: account
          description: As on GET /transactions/ledger.
          schema: { type: string, maxLength: 64 }
        - in: query
          name: dates
          required: true
          description: Comma-separated YYYY-MM-DD dates, 1 to 120 of them.
          schema: { type: string, maxLength: 1400 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionBalances" }
        "400":
          description: Invalid or too many dates, or an invalid account

  /transactions/bulk-review-matching:
    post:
      operationId: bulkReviewMatchingTransactions
      tags: [transactions, chase-ledger]
      summary: |
        (PR13) Mark every ledger row matching a filter reviewed (or not) in
        one request, without the client holding the ids. The filter is the
        ledger's, `reviewed` included. `expectedCount` is the `matchingCount`
        the client showed: when a different number of rows matches now, the
        request is refused with 409 and nothing changes. More than 1,000
        matching rows is a 400. Rows already in the target state count in
        `matched` but not in `updated`. (PR14) Marking rows reviewed
        (`reviewed: true`) requires `filter.pending: false`, otherwise 400
        `pending_not_excluded`: the sync keeps a reviewed pending row when the
        bank drops it, so a bulk review must not shield pending rows.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkReviewMatchingInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkReviewMatchingResult" }
        "400":
          description: Invalid filter, more than 1,000 matching rows, or `reviewed` true without `filter.pending` false
        "409":
          description: The number of matching rows is not `expectedCount`
          content:
            application/json:
              schema:
                type: object
                required: [error, code, matchingCount]
                properties:
                  error: { type: string }
                  code: { type: string }
                  matchingCount: { type: integer }

