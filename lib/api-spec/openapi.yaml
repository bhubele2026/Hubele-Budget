          name: to
          description: Range end (YYYY-MM-DD). Defaults to today.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BehaviorFacts" }

  /reports/budget-facts:
    get:
      operationId: getReportsBudgetFacts
      tags: [reports]
      summary: Clean class-aware Budget facts for the Reports Budget tab
      description: |
        Returns deterministic, class-aware Budget facts (range, income, bills,
        debts, flex with pace/projection/burndown, and a trailing streak board)
        for the Reports Budget tab. Every line is classified into
        income/debt/bill/flex and judged on its own axis. `monthStart` is
        optional (defaults to the current month's first day; normalized to the
        first of its month and clamped to the 2026-04-01 floor). `monthsBack`
        controls the streak-board window (default 6, clamped 1..12).
      parameters:
        - in: query
          name: monthStart
          description: First day of the budget month (YYYY-MM-DD). Defaults to the current month.
          schema: { type: string }
        - in: query
          name: monthsBack
          description: Streak-board window in months (default 6, clamped 1..12).
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetFacts" }

  /forecast/closed-months:
    post:
      operationId: closeForecastMonth
      tags: [forecast]
      requestBody:
        required: true
