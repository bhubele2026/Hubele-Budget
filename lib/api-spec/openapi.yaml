      required: [id, runId, type, targetKind, targetId, outcome, reversible, undoneAt, createdAt]
      properties:
        id: { type: string }
        runId: { type: string }
        type: { type: string, enum: [set_category, remember, propose, wishlist, finding, recap] }
        targetKind: { type: string }
        targetId: { type: ["string", "null"] }
        outcome: { type: string, enum: [applied, proposed, needs_attention] }
        reversible: { type: boolean }
        undoneAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    AgentActionList:
      type: object
      additionalProperties: false
      required: [actions]
      properties:
        actions:
          type: array
          items: { $ref: "#/components/schemas/AgentAction" }

    AgentMonitorRunResult:
      type: object
      additionalProperties: false
      required: [runId, status, detected, created, autoResolved, summary]
      properties:
        runId: { type: string }
        status: { type: string, enum: [succeeded] }
        detected: { type: integer, description: Findings the detectors produced this run }
        created: { type: integer, description: Findings new this run (created or re-fired) }
        autoResolved: { type: integer, description: Open findings closed because their cause cleared }
        summary: { type: string }

    RunCategorizationInput:
      type: object
      properties:
        since: { type: string, format: date }

    CategorizationRunResult:
      type: object
      required: [decided, queued, ambiguous]
      properties:
        decided: { type: integer, description: Decisions that wrote a category (auto or provisional). }
        queued: { type: integer, description: Decisions placed in the review queue. }
        ambiguous: { type: integer, description: Rows no deterministic stage decided at 0.6 or more. }
        modelQueued: { type: integer, description: Rows handed to the model pass (a background job); 0 when AI is off. }

    ReviewFlags:
      type: object
      required: [novelMerchant, amountAnomaly, splitNeedsRebalance]
