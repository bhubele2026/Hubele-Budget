# Render deployment for H2 Budget (migrated off Replit).
#
# ONE always-on Web Service that serves both the built SPA
# (artifacts/h2budget/dist/public, served by Express — see app.ts) and the
# /api routes, plus a Render-managed Postgres.
#
# Single instance: pg-boss (Postgres-backed) runs every scheduled job in
# process — categorize, monitor, recap, metrics snapshot, prune — with
# singleton keys per job, so a second instance would only double the pollers.
# Banks sync on the owner's Sync click (POST /plaid/sync) AND on Plaid webhooks
# (POST /plaid/webhook -> the free /transactions/sync; set
# PLAID_WEBHOOK_URL=https://h2budget.onrender.com/api/plaid/webhook). The
# billable /transactions/refresh runs only behind the explicit Force confirm
# (Plaid once billed the household ~$500 for background pulls).
#
# Toolchain mirrors CI (.github/workflows/ci.yml): Node 24, pnpm 10.34.3,
# the .npmrc strict-dep-builds/verify-deps accommodations, --frozen-lockfile.
# ⚠️ Render's Node 24.21 image ships a pnpm at /usr/bin/pnpm on a READ-ONLY
# mount, so a bare `corepack enable` dies with
# "EROFS: read-only file system, unlink '/usr/bin/pnpm'" (10/08 deploy). The
# shims go into $HOME/.local/bin instead and that dir leads PATH, so every
# `pnpm` in the build — including the ones inside the root `build` script —
# is the pinned 10.34.3. `pnpm --version` prints into the deploy log as proof.
#
# Schema changes: pending lib/db/migrations/*.sql files are applied by the
# migration runner — each in its own transaction, recorded in the
# `schema_migrations` ledger, a no-op when nothing is pending — in one of two
# places:
#   1. At server boot, before listen (artifacts/api-server/src/boot.ts), unless
#      MIGRATE_ON_BOOT=false. A failing migration exits 1: the new instance
#      never passes the health check and the old build keeps serving.
#   2. `preDeployCommand` below (dist/migrate.mjs), after the build and before
#      the new build starts; a failure cancels the deploy.
# ⚠️ This service was created through the Render API, not from this
# Blueprint, and a Blueprint sync must NOT be run (it would create a second
# database). So this file is INFORMATIONAL: the preDeployCommand only runs
# once someone sets it in the dashboard (Settings → Pre-Deploy Command). Until
# then, boot migration (1) is what applies schema changes; set
# MIGRATE_ON_BOOT=false only after the dashboard command is in place. Every
# migration is additive (lib/db/migrations/README.md), so the old build keeps
# working on the new schema while the new one starts.
databases:
  - name: h2budget-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: h2budget
    runtime: node
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /api/healthz
    autoDeploy: true
    buildCommand: >-
      mkdir -p "$HOME/.local/bin" &&
      corepack enable --install-directory "$HOME/.local/bin" &&
      export PATH="$HOME/.local/bin:$PATH" &&
      corepack prepare pnpm@10.34.3 --activate &&
      pnpm --version &&
      printf '\nstrict-dep-builds=false\nverify-deps-before-run=false\n' >> .npmrc &&
      pnpm install --frozen-lockfile &&
      pnpm run build
    preDeployCommand: node artifacts/api-server/dist/migrate.mjs
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Build-time: Vite `base` (vite.config.ts throws if unset when serving).
      - key: BASE_PATH
        value: /
      - key: CI
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: h2budget-db
          property: connectionString
      - key: PLAID_ENV
        value: production
      - key: PLAID_OPTIONAL_PRODUCTS_CSV
        value: liabilities
      - key: OWNER_EMAIL
        value: h2hubele@gmail.com
      # --- set in the Render dashboard / via API (never in git) ---
      # Host-derived (set after first deploy assigns the onrender.com host):
      - key: APP_URL # https://<host>.onrender.com
        sync: false
      - key: PLAID_WEBHOOK_URL # https://<host>/api/plaid/webhook
        sync: false
      - key: PLAID_REDIRECT_URI # https://<host>/plaid-oauth
        sync: false
      # Build-time (baked into the web bundle — rebuild to change):
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # Server secrets (restart to roll):
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      # --- AI platform + jobs (AI-0) ---
      # AI stays off until the owner sets AI_ENABLED=true in the dashboard.
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_REF_SALT
        sync: false
      - key: JOBS_MODE
        value: "on"
      - key: PGBOSS_SCHEMA
        value: pgboss
      # --- SMS (AI-4b) ---
      # Console mode (nothing is sent) until the owner finishes Twilio A2P
      # registration and flips SMS_PROVIDER to twilio in the dashboard.
      - key: SMS_PROVIDER
        value: console
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: SMS_WEBHOOK_BASE_URL
        sync: false
      - key: SMS_DAILY_SEND_CAP
        value: "50"
      # Per-task model/effort overrides (ai_task_config rows beat these):
      # - key: AI_MODEL_CATEGORIZE
      #   value: claude-sonnet-5-5
      # - key: AI_EFFORT_CHAT
      #   value: medium
